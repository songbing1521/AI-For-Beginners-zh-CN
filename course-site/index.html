些使用计算机视觉执行特定任务的示例：<\/p>\n<ul>\n<li><strong>对盲文书籍的照片进行预处理<\/strong>。我们重点介绍如何使用阈值处理、特征检测、透视变换和NumPy操作来分离单个盲文符号，以便神经网络进一步分类。<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th><img alt=\"盲文图像\" src=\"../translated_images/zh-CN/braille.341962ff76b1bd70.webp\" /><\/th>\n<th><img alt=\"盲文图像预处理结果\" src=\"../translated_images/zh-CN/braille-result.46530fea020b03c7.webp\" /><\/th>\n<th><img alt=\"盲文符号\" src=\"../translated_images/zh-CN/braille-symbols.0159185ab69d5339.webp\" /><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>图片来源：<a href=\"../translations/zh-CN/lessons/4-ComputerVision/06-IntroCV/OpenCV.ipynb\">OpenCV.ipynb<\/a><\/p>\n<\/blockquote>\n<ul>\n<li><strong>使用帧差检测视频中的运动<\/strong>。如果摄像机是固定的，那么摄像机画面中的帧应该彼此非常相似。由于帧被表示为数组，只需对两个连续帧的数组进行减法运算，就可以得到像素差异，对于静态帧来说差异应该很小，而当图像中有显著运动时差异会变大。<\/li>\n<\/ul>\n<p><img alt=\"视频帧和帧差异图像\" src=\"../translated_images/zh-CN/frame-difference.706f805491a0883c.webp\" /><\/p>\n<blockquote>\n<p>图片来源：<a href=\"../translations/zh-CN/lessons/4-ComputerVision/06-IntroCV/OpenCV.ipynb\">OpenCV.ipynb<\/a><\/p>\n<\/blockquote>\n<ul>\n<li>\n<p><strong>使用光流检测运动<\/strong>。<a href=\"https://docs.opencv.org/3.4/d4/dee/tutorial_optical_flow.html\">光流<\/a>允许我们理解视频帧中单个像素的运动方式。光流有两种类型：<\/p>\n<\/li>\n<li>\n<p><strong>密集光流<\/strong>计算每个像素的运动向量场。<\/p>\n<\/li>\n<li><strong>稀疏光流<\/strong>基于图像中的一些显著特征（例如边缘），并从帧到帧构建它们的轨迹。<\/li>\n<\/ul>\n<p><img alt=\"光流图像\" src=\"../translated_images/zh-CN/optical.1f4a94464579a83a.webp\" /><\/p>\n<blockquote>\n<p>图片来源：<a href=\"../translations/zh-CN/lessons/4-ComputerVision/06-IntroCV/OpenCV.ipynb\">OpenCV.ipynb<\/a><\/p>\n<\/blockquote>\n<h2>✍️ 示例笔记本: OpenCV <a href=\"../translations/zh-CN/lessons/4-ComputerVision/06-IntroCV/OpenCV.ipynb\">尝试OpenCV实践<\/a><\/h2>\n<p>让我们通过探索<a href=\"../translations/zh-CN/lessons/4-ComputerVision/06-IntroCV/OpenCV.ipynb\">OpenCV Notebook<\/a>来进行一些OpenCV实验。<\/p>\n<h2>结论<\/h2>\n<p>有时，像运动检测或指尖检测这样相对复杂的任务可以完全通过计算机视觉来解决。因此，了解计算机视觉的基本技术以及像OpenCV这样的库能做什么是非常有帮助的。<\/p>\n<h2>🚀 挑战<\/h2>\n<p>观看<a href=\"https://docs.microsoft.com/shows/ai-show/ai-show--2021-opencv-ai-competition--grand-prize-winners--cortic-tigers--episode-32?WT.mc_id=academic-77998-cacaste\">这个视频<\/a>，了解Cortic Tigers项目以及他们如何通过机器人构建一个基于模块的解决方案来普及计算机视觉任务。研究其他类似项目，这些项目帮助新学习者进入该领域。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/12\">课后测验<\/a><\/h2>\n<h2>复习与自学<\/h2>\n<p>阅读更多关于光流的内容，<a href=\"https://learnopencv.com/optical-flow-in-opencv/\">请参考这个优秀教程<\/a>。<\/p>\n<h2><a href=\"#/doc/lessons/4-ComputerVision/06-IntroCV/lab/README.md\">作业<\/a><\/h2>\n<p>在这个实验中，你将拍摄一个带有简单手势的视频，你的目标是使用光流提取上下左右的运动。<\/p>\n<p><img src=\"../translated_images/zh-CN/palm-movement.341495f0e9c47da3.webp\" width=\"30%\" alt=\"手掌运动帧\"/><\/p>\n<hr />"},"lessons/4-ComputerVision/06-IntroCV/lab/README.md":{"t":"计算机视觉简介 · 实验","h":"<h1>使用光流检测运动<\/h1>\n<p>来自 <a href=\"https://aka.ms/ai-beginners\">AI 初学者课程<\/a> 的实验任务。<\/p>\n<h2>任务<\/h2>\n<p>请参考<a href=\"https://raw.githubusercontent.com/songbing1521/AI-For-Beginners-zh-CN/main/lessons/4-ComputerVision/06-IntroCV/lab/palm-movement.mp4\">这个视频<\/a>，视频中一个人的手掌在稳定的背景下向左/右/上/下移动。<\/p>\n<p><strong>你的目标<\/strong>是使用光流技术来判断视频中哪些部分包含向上/向下/向左/向右的运动。<\/p>\n<p><strong>进阶目标<\/strong>是通过肤色检测实际追踪手掌/手指的运动，具体方法可参考<a href=\"https://dev.to/amarlearning/finger-detection-and-tracking-using-opencv-and-python-586m\">这篇博客<\/a>或<a href=\"http://www.benmeline.com/finger-tracking-with-opencv-and-python/\">这里<\/a>。<\/p>\n<h2>起始笔记本<\/h2>\n<p>通过打开 <a href=\"https://raw.githubusercontent.com/songbing1521/AI-For-Beginners-zh-CN/main/lessons/4-ComputerVision/06-IntroCV/lab/MovementDetection.ipynb\">MovementDetection.ipynb<\/a> 开始实验。<\/p>\n<h2>收获<\/h2>\n<p>有时，像运动检测或指尖检测这样相对复杂的任务可以完全通过计算机视觉来解决。因此，了解像 OpenCV 这样的库的功能非常有帮助。<\/p>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原文档的原始语言版本为权威来源。对于关键信息，建议使用专业人工翻译。我们对因使用此翻译而引起的任何误解或误读不承担责任。<\/p>"},"lessons/4-ComputerVision/07-ConvNets/CNN_Architectures.md":{"t":"卷积神经网络 · 🗺 CNN 架构一览","h":"<h1>常见的CNN架构<\/h1>\n<h3>VGG-16<\/h3>\n<p>VGG-16是一种网络，在2014年的ImageNet top-5分类中达到了92.7%的准确率。它的层结构如下：<\/p>\n<p><img alt=\"ImageNet Layers\" src=\"../translated_images/zh-CN/vgg-16-arch1.d901a5583b3a51ba.webp\" /><\/p>\n<p>如图所示，VGG采用了传统的金字塔架构，即一系列卷积-池化层的组合。<\/p>\n<p><img alt=\"ImageNet Pyramid\" src=\"../translated_images/zh-CN/vgg-16-arch.64ff2137f50dd49f.webp\" /><\/p>\n<blockquote>\n<p>图片来源：<a href=\"https://www.researchgate.net/figure/Vgg16-model-structure-To-get-the-VGG-NIN-model-we-replace-the-2-nd-4-th-6-th-7-th_fig2_335194493\">Researchgate<\/a><\/p>\n<\/blockquote>\n<h3>ResNet<\/h3>\n<p>ResNet是微软研究院在2015年提出的一系列模型。ResNet的核心思想是使用<strong>残差块<\/strong>：<\/p>\n<p><img src=\"../translated_images/zh-CN/resnet-block.aba4ccbcc0944434.webp\" width=\"300\"/><\/p>\n<blockquote>\n<p>图片来源：<a href=\"https://arxiv.org/pdf/1512.03385.pdf\">这篇论文<\/a><\/p>\n<\/blockquote>\n<p>使用恒等传递的原因是让我们的层预测<strong>前一层结果与残差块输出之间的差值<\/strong>，因此得名“残差”。这些块更容易训练，并且可以构建包含数百个残差块的网络（最常见的变体包括ResNet-52、ResNet-101和ResNet-152）。<\/p>\n<p>你也可以将这个网络理解为能够根据数据集调整其复杂度。最初，在开始训练网络时，权重值较小，大部分信号通过恒等传递层。随着训练的进行，权重变大，网络参数的重要性增加，网络会调整以适应所需的表达能力，从而正确分类训练图像。<\/p>\n<h3>Google Inception<\/h3>\n<p>Google Inception架构进一步发展了这一思想，将每一层网络构建为多个不同路径的组合：<\/p>\n<p><img src=\"../translated_images/zh-CN/inception.a6605b85bcbc6f52.webp\" width=\"400\"/><\/p>\n<blockquote>\n<p>图片来源：<a href=\"https://www.researchgate.net/figure/Inception-module-with-dimension-reductions-left-and-schema-for-Inception-ResNet-v1_fig2_355547454\">Researchgate<\/a><\/p>\n<\/blockquote>\n<p>这里需要强调1x1卷积的作用，因为一开始它似乎没有意义。为什么我们需要用1x1滤波器处理图像？然而，你需要记住，卷积滤波器也会处理多个深度通道（最初是RGB颜色，在后续层中是不同滤波器的通道），而1x1卷积用于通过不同的可训练权重将这些输入通道混合在一起。它也可以被视为在通道维度上的降采样（池化）。<\/p>\n<p>这里有一篇关于这个主题的<a href=\"https://medium.com/analytics-vidhya/talented-mr-1x1-comprehensive-look-at-1x1-convolution-in-deep-learning-f6b355825578\">优秀博客文章<\/a>，以及<a href=\"https://arxiv.org/pdf/1312.4400.pdf\">原始论文<\/a>。<\/p>\n<h3>MobileNet<\/h3>\n<p>MobileNet是一系列适合移动设备的模型，具有较小的尺寸。如果资源有限，并且可以牺牲一些准确性，可以使用它们。其核心思想是所谓的<strong>深度可分离卷积<\/strong>，它允许通过空间卷积和深度通道上的1x1卷积的组合来表示卷积滤波器。这显著减少了参数数量，使网络尺寸更小，同时也更容易用较少的数据进行训练。<\/p>\n<p>这里有一篇关于MobileNet的<a href=\"https://medium.com/analytics-vidhya/image-classification-with-mobilenet-cc6fbb2cd470\">优秀博客文章<\/a>。<\/p>\n<h2>总结<\/h2>\n<p>在本单元中，你已经学习了计算机视觉神经网络的核心概念——卷积网络。现实中的架构，如图像分类、目标检测，甚至图像生成网络，都是基于CNN的，只是层数更多，并且加入了一些额外的训练技巧。<\/p>\n<h2>🚀 挑战<\/h2>\n<p>在配套的笔记本中，底部有关于如何获得更高准确率的笔记。尝试进行一些实验，看看是否可以实现更高的准确率。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/14\">课后测验<\/a><\/h2>\n<h2>复习与自学<\/h2>\n<p>虽然CNN最常用于计算机视觉任务，但它们通常也适用于提取固定大小的模式。例如，如果我们处理声音，也可以使用CNN来寻找音频信号中的特定模式——在这种情况下，滤波器将是1维的（这种CNN称为1D-CNN）。此外，有时会使用3D-CNN来提取多维空间中的特征，例如视频中发生的某些事件——CNN可以捕捉特定的特征随时间变化的模式。请进行一些复习和自学，了解CNN可以完成的其他任务。<\/p>\n<h2><a href=\"#/doc/lessons/4-ComputerVision/07-ConvNets/lab/README.md\">作业<\/a><\/h2>\n<p>在本实验中，你的任务是对不同的猫狗品种进行分类。这些图像比MNIST数据集更复杂，维度更高，并且类别超过10种。<\/p>\n<hr />"},"lessons/4-ComputerVision/07-ConvNets/README.md":{"t":"卷积神经网络","h":"<h1>卷积神经网络<\/h1>\n<p>我们之前已经看到，神经网络在处理图像方面表现得非常出色，甚至单层感知机也能够以较高的准确率识别 MNIST 数据集中的手写数字。然而，MNIST 数据集非常特殊，所有数字都被居中放置在图像中，这使得任务变得更简单。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/13\">课前测验<\/a><\/h2>\n<p>在现实生活中，我们希望能够识别图像中的物体，而不受其具体位置的影响。计算机视觉与普通分类不同，因为当我们试图在图像中找到某个特定物体时，我们实际上是在扫描图像，寻找某些特定的<strong>模式<\/strong>及其组合。例如，当寻找一只猫时，我们可能首先寻找水平线，这些线可以形成猫的胡须，然后某种胡须的组合可以告诉我们这确实是一张猫的图片。某些模式的相对位置和存在是重要的，而不是它们在图像中的确切位置。<\/p>\n<p>为了提取模式，我们将使用<strong>卷积滤波器<\/strong>的概念。正如你所知，图像可以用二维矩阵或带有颜色深度的三维张量来表示。应用滤波器意味着我们使用一个相对较小的<strong>滤波核<\/strong>矩阵，并对原始图像中的每个像素与其邻近点进行加权平均计算。我们可以将其视为一个小窗口在整个图像上滑动，并根据滤波核矩阵中的权重对所有像素进行平均。<\/p>\n<table>\n<thead>\n<tr>\n<th><img alt=\"垂直边缘滤波器\" src=\"../translated_images/zh-CN/filter-vert.b7148390ca0bc356.webp\" /><\/th>\n<th><img alt=\"水平边缘滤波器\" src=\"../translated_images/zh-CN/filter-horiz.59b80ed4feb946ef.webp\" /><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>图片来源：Dmitry Soshnikov<\/p>\n<\/blockquote>\n<p>例如，如果我们对 MNIST 数字应用 3x3 的垂直边缘和水平边缘滤波器，我们可以在原始图像中存在垂直和水平边缘的地方获得高亮（例如高值）。因此，这两个滤波器可以用来“寻找”边缘。同样，我们可以设计不同的滤波器来寻找其他低级模式：<\/p>\n<p><img src=\"../translated_images/zh-CN/lmfilters.ea9e4868a82cf74c.webp\" width=\"500\" align=\"center\"/><\/p>\n<blockquote>\n<p>图片来源：<a href=\"https://www.robots.ox.ac.uk/~vgg/research/texclass/filters.html\">Leung-Malik 滤波器组<\/a><\/p>\n<\/blockquote>\n<p>然而，虽然我们可以手动设计滤波器来提取某些模式，我们也可以设计网络，使其能够自动学习这些模式。这是 CNN 背后的主要思想之一。<\/p>\n<h2>CNN 的主要思想<\/h2>\n<p>CNN 的工作方式基于以下重要思想：<\/p>\n<ul>\n<li>卷积滤波器可以提取模式<\/li>\n<li>我们可以设计网络，使滤波器能够自动训练<\/li>\n<li>我们可以使用相同的方法来发现高级特征中的模式，而不仅仅是原始图像中的模式。因此，CNN 的特征提取在特征的层次结构中工作，从低级像素组合开始，到更高级的图像部分组合。<\/li>\n<\/ul>\n<p><img alt=\"层次特征提取\" src=\"../translated_images/zh-CN/FeatureExtractionCNN.d9b456cbdae7cb64.webp\" /><\/p>\n<blockquote>\n<p>图片来源：<a href=\"https://www.semanticscholar.org/paper/Computer-vision-based-pedestrian-trajectory-Hislop-Lynch/26e6f74853fc9bbb7487b06dc2cf095d36c9021d\">Hislop-Lynch 的论文<\/a>，基于<a href=\"https://dl.acm.org/doi/abs/10.1145/1553374.1553453\">他们的研究<\/a><\/p>\n<\/blockquote>\n<h2>✍️ 练习：卷积神经网络<\/h2>\n<p>让我们继续探索卷积神经网络的工作原理，以及如何通过相关的笔记本实现可训练的滤波器：<\/p>\n<ul>\n<li><a href=\"../translations/zh-CN/lessons/4-ComputerVision/07-ConvNets/ConvNetsPyTorch.ipynb\">卷积神经网络 - PyTorch<\/a><\/li>\n<li><a href=\"../translations/zh-CN/lessons/4-ComputerVision/07-ConvNets/ConvNetsTF.ipynb\">卷积神经网络 - TensorFlow<\/a><\/li>\n<\/ul>\n<h2>金字塔架构<\/h2>\n<p>大多数用于图像处理的 CNN 都遵循所谓的金字塔架构。应用于原始图像的第一层卷积通常具有相对较少的滤波器（8-16），这些滤波器对应于不同的像素组合，例如水平/垂直线条或笔画。在下一层，我们减少网络的空间维度，并增加滤波器的数量，这对应于更多简单特征的可能组合。随着每一层的推进，空间维度逐渐减小，而滤波器的数量逐渐增加，最终到达分类器。<\/p>\n<p>例如，让我们看看 VGG-16 的架构，这是一种在 2014 年 ImageNet 的 top-5 分类中实现了 92.7% 准确率的网络：<\/p>\n<p><img alt=\"ImageNet 层次结构\" src=\"../translated_images/zh-CN/vgg-16-arch1.d901a5583b3a51ba.webp\" /><\/p>\n<p><img alt=\"ImageNet 金字塔\" src=\"../translated_images/zh-CN/vgg-16-arch.64ff2137f50dd49f.webp\" /><\/p>\n<blockquote>\n<p>图片来源：<a href=\"https://www.researchgate.net/figure/Vgg16-model-structure-To-get-the-VGG-NIN-model-we-replace-the-2-nd-4-th-6-th-7-th_fig2_335194493\">Researchgate<\/a><\/p>\n<\/blockquote>\n<h2>最著名的 CNN 架构<\/h2>\n<p><a href=\"#/doc/lessons/4-ComputerVision/07-ConvNets/CNN_Architectures.md\">继续学习最著名的 CNN 架构<\/a><\/p>\n<hr />"},"lessons/4-ComputerVision/07-ConvNets/lab/README.md":{"t":"卷积神经网络 · 实验","h":"<h1>宠物面部分类<\/h1>\n<p>来自 <a href=\"https://github.com/microsoft/ai-for-beginners\">AI for Beginners Curriculum<\/a> 的实验任务。<\/p>\n<h2>任务<\/h2>\n<p>假设你需要开发一个宠物托管应用程序，用于记录所有宠物信息。该应用程序的一个重要功能是通过照片自动识别宠物的品种。这可以通过神经网络成功实现。<\/p>\n<p>你需要训练一个卷积神经网络，使用 <strong>Pet Faces<\/strong> 数据集对不同品种的猫和狗进行分类。<\/p>\n<h2>数据集<\/h2>\n<p>我们将使用 <a href=\"https://www.robots.ox.ac.uk/~vgg/data/pets/\">Oxford-IIIT Pet Dataset<\/a>，该数据集包含37种不同品种的猫和狗的图像。<\/p>\n<p><img alt=\"我们将处理的数据集\" src=\"../translated_images/zh-CN/data.50b2a9d5484bdbf0.webp\" /><\/p>\n<p>要下载数据集，请使用以下代码片段：<\/p>\n<pre><code class=\"language-python\">!wget https://thor.robots.ox.ac.uk/~vgg/data/pets/images.tar.gz\n!tar xfz images.tar.gz\n!rm images.tar.gz\n<\/code><\/pre>\n<p><strong>注意：<\/strong> Oxford-IIIT Pet Dataset 的图像是按文件名组织的（例如，<code>Abyssinian_1.jpg<\/code>，<code>Bengal_2.jpg<\/code>）。笔记本中包含代码，将这些图像组织到按品种分类的子目录中，以便于分类。<\/p>\n<h2>启动笔记本<\/h2>\n<p>通过打开 <a href=\"../translations/zh-CN/lessons/4-ComputerVision/07-ConvNets/lab/PetFaces.ipynb\">PetFaces.ipynb<\/a> 开始实验。<\/p>\n<h2>收获<\/h2>\n<p>你已经从零开始解决了一个相对复杂的图像分类问题！尽管类别很多，你仍然能够获得合理的准确率！同时，测量 top-k 准确率也是有意义的，因为有些类别即使对人类来说也不容易区分。<\/p>\n<hr />\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。原始语言的文档应被视为权威来源。对于关键信息，建议使用专业人工翻译。我们不对因使用此翻译而产生的任何误解或误读承担责任。<\/p>"},"lessons/4-ComputerVision/08-TransferLearning/README.md":{"t":"预训练网络与迁移学习","h":"<h1>预训练网络与迁移学习<\/h1>\n<p>训练 CNN 需要耗费大量时间，并且需要大量数据。然而，大部分时间都花在学习网络可以用来从图像中提取模式的最佳低级滤波器上。一个自然的问题是：我们是否可以使用一个在某个数据集上训练过的神经网络，并将其适配到不同的图像分类任务，而无需完整的训练过程？<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/15\">课前测验<\/a><\/h2>\n<p>这种方法被称为<strong>迁移学习<\/strong>，因为我们将一个神经网络模型的一些知识转移到另一个模型中。在迁移学习中，我们通常从一个预训练模型开始，该模型已经在某个大型图像数据集（例如 <strong>ImageNet<\/strong>）上进行了训练。这些模型已经能够很好地从通用图像中提取不同的特征，在许多情况下，仅仅在这些提取的特征之上构建一个分类器就可以取得不错的效果。<\/p>\n<blockquote>\n<p>✅ 迁移学习是一个在其他学术领域（如教育）中也会遇到的术语，它指的是将一个领域的知识应用到另一个领域的过程。<\/p>\n<\/blockquote>\n<h2>预训练模型作为特征提取器<\/h2>\n<p>我们在上一节中讨论的卷积网络包含多个层，每一层都旨在从图像中提取一些特征，从低级像素组合（例如水平/垂直线或笔画）到高级特征组合（例如火焰的眼睛）。如果我们在足够大的通用和多样化图像数据集上训练 CNN，网络应该能够学习提取这些常见特征。<\/p>\n<p>Keras 和 PyTorch 都包含函数，可以轻松加载一些常见架构的预训练神经网络权重，这些权重大多是在 ImageNet 图像上训练的。最常用的架构在上一课的 <a href=\"#/doc/lessons/4-ComputerVision/07-ConvNets/CNN_Architectures.md\">CNN Architectures<\/a> 页面中有描述。特别是，你可以考虑使用以下模型之一：<\/p>\n<ul>\n<li><strong>VGG-16/VGG-19<\/strong> 是相对简单的模型，但仍然具有良好的准确性。通常使用 VGG 作为初步尝试是一个不错的选择，可以看看迁移学习的效果如何。<\/li>\n<li><strong>ResNet<\/strong> 是微软研究院在 2015 年提出的一系列模型。它们有更多的层，因此需要更多资源。<\/li>\n<li><strong>MobileNet<\/strong> 是一系列尺寸较小的模型，适合移动设备。如果资源有限并且可以牺牲一些准确性，可以使用它们。<\/li>\n<\/ul>\n<p>以下是 VGG-16 网络从一张猫的图片中提取的示例特征：<\/p>\n<p><img alt=\"VGG-16 提取的特征\" src=\"../translated_images/zh-CN/features.6291f9c7ba3a0b95.webp\" /><\/p>\n<h2>猫与狗数据集<\/h2>\n<p>在这个例子中，我们将使用一个<a href=\"https://www.microsoft.com/download/details.aspx?id=54765&amp;WT.mc_id=academic-77998-cacaste\">猫与狗<\/a>数据集，这非常接近真实的图像分类场景。<\/p>\n<h2>✍️ 练习：迁移学习<\/h2>\n<p>让我们在相关的笔记本中看看迁移学习的实际应用：<\/p>\n<ul>\n<li><a href=\"../translations/zh-CN/lessons/4-ComputerVision/08-TransferLearning/TransferLearningPyTorch.ipynb\">迁移学习 - PyTorch<\/a><\/li>\n<li><a href=\"../translations/zh-CN/lessons/4-ComputerVision/08-TransferLearning/TransferLearningTF.ipynb\">迁移学习 - TensorFlow<\/a><\/li>\n<\/ul>\n<h2>可视化对抗性猫<\/h2>\n<p>预训练的神经网络在其“脑海”中包含了不同的模式，包括<strong>理想猫<\/strong>（以及理想狗、理想斑马等）的概念。我们可以尝试以某种方式<strong>可视化这个图像<\/strong>。然而，这并不简单，因为这些模式分布在网络权重的各个部分，并且以层次结构组织。<\/p>\n<p>我们可以采取的一种方法是从一个随机图像开始，然后尝试使用<strong>梯度下降优化<\/strong>技术调整该图像，使网络认为它是一只猫。<\/p>\n<p><img alt=\"图像优化循环\" src=\"../translated_images/zh-CN/ideal-cat-loop.999fbb8ff306e044.webp\" /><\/p>\n<p>然而，如果我们这样做，我们会得到一些非常类似于随机噪声的东西。这是因为<em>有很多方法可以让网络认为输入图像是一只猫<\/em>，包括一些在视觉上没有意义的方式。虽然这些图像包含了许多典型的猫的模式，但没有任何约束使它们在视觉上具有辨识度。<\/p>\n<p>为了改善结果，我们可以在损失函数中添加另一个项，称为<strong>变化损失<\/strong>。它是一种度量，显示图像中相邻像素的相似程度。最小化变化损失可以使图像更平滑，并消除噪声，从而揭示更具视觉吸引力的模式。以下是一些这样的“理想”图像示例，它们被高概率分类为猫和斑马：<\/p>\n<table>\n<thead>\n<tr>\n<th><img alt=\"理想猫\" src=\"../translated_images/zh-CN/ideal-cat.203dd4597643d6b0.webp\" /><\/th>\n<th><img alt=\"理想斑马\" src=\"../translated_images/zh-CN/ideal-zebra.7f70e8b54ee15a7a.webp\" /><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>理想猫<\/em><\/td>\n<td><em>理想斑马<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>类似的方法可以用来对神经网络进行所谓的<strong>对抗性攻击<\/strong>。假设我们想欺骗一个神经网络，让一只狗看起来像一只猫。如果我们拿一张被网络识别为狗的狗的图片，然后稍微调整它，直到网络开始将其分类为猫：<\/p>\n<table>\n<thead>\n<tr>\n<th><img alt=\"狗的图片\" src=\"../translated_images/zh-CN/original-dog.8f68a67d2fe0911f.webp\" /><\/th>\n<th><img alt=\"被分类为猫的狗的图片\" src=\"../translated_images/zh-CN/adversarial-dog.d9fc7773b0142b89.webp\" /><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>狗的原始图片<\/em><\/td>\n<td><em>被分类为猫的狗的图片<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>查看以下笔记本中的代码以重现上述结果：<\/p>\n<ul>\n<li><a href=\"../translations/zh-CN/lessons/4-ComputerVision/08-TransferLearning/AdversarialCat_TF.ipynb\">理想与对抗性猫 - TensorFlow<\/a><\/li>\n<\/ul>\n<h2>总结<\/h2>\n<p>通过迁移学习，你可以快速构建一个用于自定义对象分类任务的分类器，并获得较高的准确性。可以看到，我们现在解决的更复杂任务需要更高的计算能力，无法轻松在 CPU 上完成。在下一单元中，我们将尝试使用更轻量化的实现来训练相同的模型，使用较低的计算资源，结果仅稍微降低准确性。<\/p>\n<h2>🚀 挑战<\/h2>\n<p>在配套的笔记本中，底部有关于迁移知识在某些相似训练数据（例如新类型的动物）中效果最佳的注释。尝试使用完全不同类型的图像进行实验，看看你的迁移知识模型表现得如何。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/16\">课后测验<\/a><\/h2>\n<h2>复习与自学<\/h2>\n<p>阅读 <a href=\"#/doc/lessons/4-ComputerVision/08-TransferLearning/TrainingTricks.md\">TrainingTricks.md<\/a>，深入了解其他训练模型的方法。<\/p>\n<h2><a href=\"#/doc/lessons/4-ComputerVision/08-TransferLearning/lab/README.md\">作业<\/a><\/h2>\n<p>在这个实验中，我们将使用真实的 <a href=\"https://www.robots.ox.ac.uk/~vgg/data/pets/\">Oxford-IIIT<\/a> 宠物数据集，其中包含 35 种猫和狗的品种，并构建一个迁移学习分类器。<\/p>\n<hr />"},"lessons/4-ComputerVision/08-TransferLearning/TrainingTricks.md":{"t":"预训练网络与迁移学习 · ⚙ 训练技巧","h":"<h1>深度学习训练技巧<\/h1>\n<p>随着神经网络的加深，其训练过程变得越来越具有挑战性。一个主要问题是所谓的<a href=\"https://en.wikipedia.org/wiki/Vanishing_gradient_problem\">梯度消失<\/a>或<a href=\"https://deepai.org/machine-learning-glossary-and-terms/exploding-gradient-problem#:~:text=Exploding%20gradients%20are%20a%20problem,updates%20are%20small%20and%20controlled\">梯度爆炸<\/a>。<a href=\"https://towardsdatascience.com/the-vanishing-exploding-gradient-problem-in-deep-neural-networks-191358470c11\">这篇文章<\/a>对这些问题进行了很好的介绍。<\/p>\n<p>为了使深度网络的训练更高效，可以使用一些技巧。<\/p>\n<h2>保持数值在合理范围内<\/h2>\n<p>为了使数值计算更稳定，我们需要确保神经网络中的所有数值都在合理的范围内，通常是 [-1..1] 或 [0..1]。这并不是一个非常严格的要求，但浮点计算的特性决定了不同数量级的数值无法被准确地一起操作。例如，如果我们将 10<sup>-10<\/sup> 和 10<sup>10<\/sup> 相加，结果很可能是 10<sup>10<\/sup>，因为较小的值会被“转换”到与较大值相同的数量级，从而导致尾数丢失。<\/p>\n<p>大多数激活函数在 [-1..1] 范围内具有非线性特性，因此将所有输入数据缩放到 [-1..1] 或 [0..1] 范围是有意义的。<\/p>\n<h2>初始权重初始化<\/h2>\n<p>理想情况下，我们希望数值在通过网络层后仍保持在相同的范围内。因此，初始化权重时需要确保数值分布的保留。<\/p>\n<p>正态分布 <strong>N(0,1)<\/strong> 并不是一个好选择，因为如果我们有 <em>n<\/em> 个输入，输出的标准差将是 <em>n<\/em>，数值很可能会超出 [0..1] 的范围。<\/p>\n<p>以下是常用的初始化方法：<\/p>\n<ul>\n<li>均匀分布 -- <code>uniform<\/code><\/li>\n<li><strong>N(0,1/n)<\/strong> -- <code>gaussian<\/code><\/li>\n<li><strong>N(0,1/√n_in)<\/strong> 保证对于均值为零、标准差为 1 的输入，输出的均值和标准差保持不变<\/li>\n<li><strong>N(0,√2/(n_in+n_out))<\/strong> -- 所谓的 <strong>Xavier 初始化<\/strong> (<code>glorot<\/code>)，有助于在前向传播和反向传播中保持信号在合理范围内<\/li>\n<\/ul>\n<h2>批量归一化<\/h2>\n<p>即使有了合适的权重初始化，训练过程中权重仍可能变得非常大或非常小，从而使信号超出合理范围。我们可以通过使用某种<strong>归一化<\/strong>技术将信号拉回合理范围。虽然有多种归一化方法（如权重归一化、层归一化），但最常用的是批量归一化。<\/p>\n<p><strong>批量归一化<\/strong>的思想是考虑小批量中的所有数值，并基于这些数值进行归一化（即减去均值并除以标准差）。它被实现为一个网络层，在应用权重后但在激活函数之前进行归一化。结果是，我们通常会看到更高的最终准确率和更快的训练速度。<\/p>\n<p>以下是关于批量归一化的<a href=\"https://arxiv.org/pdf/1502.03167.pdf\">原始论文<\/a>、<a href=\"https://en.wikipedia.org/wiki/Batch_normalization\">维基百科解释<\/a>以及<a href=\"https://towardsdatascience.com/batch-normalization-in-3-levels-of-understanding-14c2da90a338\">一篇很好的入门博客<\/a>（还有<a href=\"https://habrahabr.ru/post/309302/\">俄文版<\/a>）。<\/p>\n<h2>Dropout<\/h2>\n<p><strong>Dropout<\/strong> 是一种有趣的技术，它在训练过程中随机移除一定比例的神经元。它被实现为一个具有一个参数的层（移除神经元的百分比，通常为 10%-50%），在训练过程中，它会将输入向量的随机元素置零，然后再传递到下一层。<\/p>\n<p>虽然这听起来像是一个奇怪的想法，但你可以在 <a href=\"https://raw.githubusercontent.com/songbing1521/AI-For-Beginners-zh-CN/main/lessons/4-ComputerVision/08-TransferLearning/Dropout.ipynb\"><code>Dropout.ipynb<\/code><\/a> 笔记本中看到 Dropout 对训练 MNIST 数字分类器的效果。它加速了训练，并使我们能够在更少的训练轮次中达到更高的准确率。<\/p>\n<p>这种效果可以通过以下几种方式解释：<\/p>\n<ul>\n<li>它可以被认为是对模型的随机冲击因素，从而将优化从局部最小值中拉出<\/li>\n<li>它可以被视为<em>隐式模型平均化<\/em>，因为我们可以说在 Dropout 过程中我们训练了略有不同的模型<\/li>\n<\/ul>\n<blockquote>\n<p><em>有人说，当一个醉酒的人试图学习某些东西时，与清醒的人相比，他第二天早上会记得更清楚，因为一个有一些功能失常神经元的大脑会更努力地适应以抓住意义。我们自己从未验证过这是否属实。<\/em><\/p>\n<\/blockquote>\n<h2>防止过拟合<\/h2>\n<p>深度学习中一个非常重要的方面是能够防止<a href=\"../translations/zh-CN/lessons/3-NeuralNetworks/05-Frameworks/Overfitting.md\">过拟合<\/a>。虽然使用非常强大的神经网络模型可能很有吸引力，但我们应该始终平衡模型参数的数量与训练样本的数量。<\/p>\n<blockquote>\n<p>确保你理解我们之前介绍的<a href=\"../translations/zh-CN/lessons/3-NeuralNetworks/05-Frameworks/Overfitting.md\">过拟合<\/a>概念！<\/p>\n<\/blockquote>\n<p>以下是防止过拟合的几种方法：<\/p>\n<ul>\n<li>提前停止 -- 持续监控验证集上的误差，当验证误差开始增加时停止训练。<\/li>\n<li>显式权重衰减 / 正则化 -- 在损失函数中添加一个额外的惩罚项，用于限制权重的绝对值过大，从而防止模型产生非常不稳定的结果<\/li>\n<li>模型平均化 -- 训练多个模型，然后对结果进行平均。这有助于最小化方差。<\/li>\n<li>Dropout（隐式模型平均化）<\/li>\n<\/ul>\n<h2>优化器 / 训练算法<\/h2>\n<p>训练的另一个重要方面是选择合适的训练算法。虽然经典的<strong>梯度下降<\/strong>是一个合理的选择，但它有时可能过于缓慢，或者导致其他问题。<\/p>\n<p>在深度学习中，我们使用<strong>随机梯度下降<\/strong>（SGD），它是对从训练集中随机选择的小批量数据应用的梯度下降。权重通过以下公式调整：<\/p>\n<p>w<sup>t+1<\/sup> = w<sup>t<\/sup> - η∇ℒ<\/p>\n<h3>动量<\/h3>\n<p>在<strong>动量 SGD<\/strong> 中，我们保留了前几步的部分梯度。这类似于当我们以惯性移动时，如果受到一个不同方向的冲击，我们的轨迹不会立即改变，而是保留了一部分原始运动。这里我们引入另一个向量 v 来表示<em>速度<\/em>：<\/p>\n<ul>\n<li>v<sup>t+1<\/sup> = γ v<sup>t<\/sup> - η∇ℒ<\/li>\n<li>w<sup>t+1<\/sup> = w<sup>t<\/sup> + v<sup>t+1<\/sup><\/li>\n<\/ul>\n<p>这里参数 γ 表示我们考虑惯性的程度：γ=0 对应于经典 SGD；γ=1 是一个纯粹的运动方程。<\/p>\n<h3>Adam, Adagrad 等<\/h3>\n<p>由于在每一层中我们将信号乘以某个矩阵 W<sub>i<\/sub>，根据 ||W<sub>i<\/sub>||，梯度可能会减小接近于 0，或者无限增大。这正是梯度爆炸/消失问题的本质。<\/p>\n<p>解决此问题的一种方法是仅在公式中使用梯度的方向，而忽略其绝对值，即：<\/p>\n<p>w<sup>t+1<\/sup> = w<sup>t<\/sup> - η(∇ℒ/||∇ℒ||)，其中 ||∇ℒ|| = √∑(∇ℒ)<sup>2<\/sup><\/p>\n<p>这种算法被称为 <strong>Adagrad<\/strong>。其他使用相同思想的算法包括：<strong>RMSProp<\/strong>，<strong>Adam<\/strong><\/p>\n<blockquote>\n<p><strong>Adam<\/strong> 被认为是许多应用中非常高效的算法，因此如果你不确定使用哪种算法，可以选择 Adam。<\/p>\n<\/blockquote>\n<h3>梯度裁剪<\/h3>\n<p>梯度裁剪是上述思想的扩展。当 ||∇ℒ|| ≤ θ 时，我们在权重优化中使用原始梯度；当 ||∇ℒ|| &gt; θ 时，我们将梯度除以其范数。这里 θ 是一个参数，在大多数情况下我们可以取 θ=1 或 θ=10。<\/p>\n<h3>学习率衰减<\/h3>\n<p>训练的成功往往取决于学习率参数 η。可以合理地假设，较大的 η 值会导致更快的训练，这是我们通常在训练初期所希望的，而较小的 η 值则允许我们对网络进行微调。因此，在大多数情况下，我们希望在训练过程中逐渐减小 η。<\/p>\n<p>这可以通过在每个训练轮次后将 η 乘以某个数（例如 0.98）来实现，或者使用更复杂的<strong>学习率调度<\/strong>。<\/p>\n<h2>不同的网络架构<\/h2>\n<p>为你的问题选择合适的网络架构可能会很棘手。通常，我们会选择一个已被证明适用于我们特定任务（或类似任务）的架构。这里有一个关于计算机视觉神经网络架构的<a href=\"https://www.topbots.com/a-brief-history-of-neural-network-architectures/\">很好的概述<\/a>。<\/p>\n<blockquote>\n<p>选择一个足够强大的架构来匹配我们拥有的训练样本数量是很重要的。选择过于强大的模型可能会导致<a href=\"../translations/zh-CN/lessons/3-NeuralNetworks/05-Frameworks/Overfitting.md\">过拟合<\/a>。<\/p>\n<\/blockquote>\n<p>另一种好的方法是使用能够自动调整到所需复杂度的架构。在某种程度上，<strong>ResNet<\/strong> 架构和 <strong>Inception<\/strong> 是自适应的。<a href=\"#/doc/lessons/4-ComputerVision/07-ConvNets/CNN_Architectures.md\">更多关于计算机视觉架构的信息<\/a><\/p>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务<a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a>进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。原始语言的文档应被视为权威来源。对于关键信息，建议使用专业人工翻译。我们不对因使用此翻译而产生的任何误解或误读承担责任。<\/p>"},"lessons/4-ComputerVision/08-TransferLearning/lab/README.md":{"t":"预训练网络与迁移学习 · 实验","h":"<h1>使用迁移学习对牛津宠物进行分类<\/h1>\n<p>来自 <a href=\"https://github.com/microsoft/ai-for-beginners\">AI 初学者课程<\/a> 的实验任务。<\/p>\n<h2>任务<\/h2>\n<p>想象一下，你需要为一家宠物托管中心开发一个应用程序，用来记录所有的宠物。这样的应用程序一个很棒的功能就是能够通过照片自动识别宠物的品种。在本次任务中，我们将使用迁移学习对 <a href=\"https://www.robots.ox.ac.uk/~vgg/data/pets/\">Oxford-IIIT<\/a> 宠物数据集中的真实宠物图片进行分类。<\/p>\n<h2>数据集<\/h2>\n<p>我们将使用原始的 <a href=\"https://www.robots.ox.ac.uk/~vgg/data/pets/\">Oxford-IIIT<\/a> 宠物数据集，该数据集包含 35 种不同品种的猫和狗。<\/p>\n<p>要下载数据集，请使用以下代码片段：<\/p>\n<pre><code class=\"language-python\">!wget https://www.robots.ox.ac.uk/~vgg/data/pets/data/images.tar.gz\n!tar xfz images.tar.gz\n!rm images.tar.gz\n<\/code><\/pre>\n<h2>启动 Notebook<\/h2>\n<p>通过打开 <a href=\"https://raw.githubusercontent.com/songbing1521/AI-For-Beginners-zh-CN/main/lessons/4-ComputerVision/08-TransferLearning/lab/OxfordPets.ipynb\">OxfordPets.ipynb<\/a> 开始实验。<\/p>\n<h2>收获<\/h2>\n<p>迁移学习和预训练网络使我们能够相对轻松地解决现实世界中的图像分类问题。然而，预训练网络在处理相似类型的图像时效果较好，如果我们开始分类非常不同的图像（例如医学图像），结果可能会大打折扣。<\/p>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原始语言的文档作为权威来源。对于关键信息，建议使用专业人工翻译。因使用本翻译而引起的任何误解或误读，我们概不负责。<\/p>"},"lessons/4-ComputerVision/09-Autoencoders/README.md":{"t":"自动编码器","h":"<h1>自动编码器<\/h1>\n<p>在训练 CNN 时，一个问题是我们需要大量的标注数据。在图像分类的情况下，我们需要将图像分成不同的类别，这通常需要手动完成。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/17\">课前测验<\/a><\/h2>\n<p>然而，我们可能希望使用原始（未标注）数据来训练 CNN 特征提取器，这被称为<strong>自监督学习<\/strong>。在这种情况下，我们将训练图像同时作为网络的输入和输出。<strong>自动编码器<\/strong>的核心思想是，我们会有一个<strong>编码器网络<\/strong>，将输入图像转换为某种<strong>潜在空间<\/strong>（通常是一个较小尺寸的向量），然后通过<strong>解码器网络<\/strong>来重建原始图像。<\/p>\n<blockquote>\n<p>✅ <a href=\"https://wikipedia.org/wiki/Autoencoder\">自动编码器<\/a> 是“一种用于学习未标注数据高效编码的人工神经网络。”<\/p>\n<\/blockquote>\n<p>由于我们训练自动编码器的目标是尽可能捕捉原始图像的信息以实现准确的重建，网络会尝试找到输入图像的最佳<strong>嵌入<\/strong>以捕捉其意义。<\/p>\n<p><img alt=\"自动编码器示意图\" src=\"../translated_images/zh-CN/autoencoder_schema.5e6fc9ad98a5eb61.webp\" /><\/p>\n<blockquote>\n<p>图片来源：<a href=\"https://blog.keras.io/building-autoencoders-in-keras.html\">Keras 博客<\/a><\/p>\n<\/blockquote>\n<h2>自动编码器的应用场景<\/h2>\n<p>虽然重建原始图像本身似乎没有太大的实际用途，但在以下场景中，自动编码器特别有用：<\/p>\n<ul>\n<li><strong>降低图像维度以便可视化<\/strong>或<strong>训练图像嵌入<\/strong>。通常，自动编码器比 PCA 效果更好，因为它考虑了图像的空间特性和层次化特征。<\/li>\n<li><strong>去噪<\/strong>，即去除图像中的噪声。由于噪声包含了大量无用信息，自动编码器无法将所有噪声信息压缩到相对较小的潜在空间中，因此它只捕捉图像的重要部分。在训练去噪器时，我们以原始图像为目标，并使用人工添加噪声的图像作为自动编码器的输入。<\/li>\n<li><strong>超分辨率<\/strong>，即提高图像分辨率。我们以高分辨率图像为目标，并使用低分辨率图像作为自动编码器的输入。<\/li>\n<li><strong>生成模型<\/strong>。一旦我们训练了自动编码器，解码器部分可以用来从随机潜在向量生成新对象。<\/li>\n<\/ul>\n<h2>变分自动编码器 (VAE)<\/h2>\n<p>传统的自动编码器通过某种方式降低输入数据的维度，从而提取输入图像的重要特征。然而，潜在向量通常没有太多意义。换句话说，以 MNIST 数据集为例，确定哪些数字对应于不同的潜在向量并不容易，因为相近的潜在向量不一定对应于相同的数字。<\/p>\n<p>另一方面，要训练<strong>生成模型<\/strong>，最好对潜在空间有一定的理解。这一想法引导我们进入<strong>变分自动编码器<\/strong> (VAE)。<\/p>\n<p>VAE 是一种自动编码器，它学习预测潜在参数的<strong>统计分布<\/strong>，即所谓的<strong>潜在分布<\/strong>。例如，我们可能希望潜在向量呈正态分布，具有某个均值 z<sub>mean<\/sub> 和标准差 z<sub>sigma<\/sub>（均值和标准差都是某个维度 d 的向量）。VAE 的编码器学习预测这些参数，然后解码器从该分布中随机抽取一个向量以重建对象。<\/p>\n<p>总结如下：<\/p>\n<ul>\n<li>从输入向量预测 <code>z_mean<\/code> 和 <code>z_log_sigma<\/code>（我们预测的是标准差的对数而不是标准差本身）<\/li>\n<li>从分布 N(z<sub>mean<\/sub>,exp(z<sub>log_sigma<\/sub>)) 中抽取一个向量 <code>sample<\/code><\/li>\n<li>解码器尝试使用 <code>sample<\/code> 作为输入向量解码原始图像<\/li>\n<\/ul>\n<p><img src=\"../translated_images/zh-CN/vae.464c465a5b6a9e25.webp\" width=\"50%\"><\/p>\n<blockquote>\n<p>图片来源：<a href=\"https://ijdykeman.github.io/ml/2016/12/21/cvae.html\">Isaak Dykeman 的博客文章<\/a><\/p>\n<\/blockquote>\n<p>变分自动编码器使用一个复杂的损失函数，该损失函数由两部分组成：<\/p>\n<ul>\n<li><strong>重建损失<\/strong>是一个损失函数，用于衡量重建图像与目标图像的接近程度（可以是均方误差，MSE）。它与普通自动编码器的损失函数相同。<\/li>\n<li><strong>KL 损失<\/strong>确保潜在变量分布接近正态分布。它基于 <a href=\"https://www.countbayesie.com/blog/2017/5/9/kullback-leibler-divergence-explained\">Kullback-Leibler 散度<\/a> 的概念——一种估计两个统计分布相似程度的度量。<\/li>\n<\/ul>\n<p>VAE 的一个重要优势是它可以相对轻松地生成新图像，因为我们知道从哪个分布中抽取潜在向量。例如，如果我们在 MNIST 数据集上用 2D 潜在向量训练 VAE，我们可以通过改变潜在向量的分量来获得不同的数字：<\/p>\n<p><img alt=\"vaemnist\" src=\"../translated_images/zh-CN/vaemnist.cab9e602dc08dc50.webp\" width=\"50%\"/><\/p>\n<blockquote>\n<p>图片来源：<a href=\"http://soshnikov.com\">Dmitry Soshnikov<\/a><\/p>\n<\/blockquote>\n<p>观察图像如何相互融合，当我们从潜在参数空间的不同部分获取潜在向量时，图像开始逐渐变化。我们还可以将这个空间可视化为二维：<\/p>\n<p><img alt=\"vaemnist cluster\" src=\"../translated_images/zh-CN/vaemnist-diag.694315f775d5d666.webp\" width=\"50%\"/> <\/p>\n<blockquote>\n<p>图片来源：<a href=\"http://soshnikov.com\">Dmitry Soshnikov<\/a><\/p>\n<\/blockquote>\n<h2>✍️ 练习：自动编码器<\/h2>\n<p>通过以下笔记本了解更多关于自动编码器的内容：<\/p>\n<ul>\n<li><a href=\"../translations/zh-CN/lessons/4-ComputerVision/09-Autoencoders/AutoencodersTF.ipynb\">TensorFlow 中的自动编码器<\/a><\/li>\n<li><a href=\"../translations/zh-CN/lessons/4-ComputerVision/09-Autoencoders/AutoEncodersPyTorch.ipynb\">PyTorch 中的自动编码器<\/a><\/li>\n<\/ul>\n<h2>自动编码器的特性<\/h2>\n<ul>\n<li><strong>数据特定性<\/strong> - 它们只对训练时使用的图像类型效果良好。例如，如果我们在花卉图像上训练一个超分辨率网络，它在肖像图像上效果可能不佳。这是因为网络通过从训练数据集中学习的特征中提取细节来生成高分辨率图像。<\/li>\n<li><strong>有损性<\/strong> - 重建的图像与原始图像并不完全相同。损失的性质由训练期间使用的<strong>损失函数<\/strong>定义。<\/li>\n<li>适用于<strong>未标注数据<\/strong><\/li>\n<\/ul>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/18\">课后测验<\/a><\/h2>\n<h2>总结<\/h2>\n<p>在本课中，您学习了 AI 科学家可用的各种类型的自动编码器。您学习了如何构建它们，以及如何使用它们重建图像。您还学习了 VAE 以及如何使用它生成新图像。<\/p>\n<h2>🚀 挑战<\/h2>\n<p>在本课中，您学习了如何将自动编码器用于图像。但它们也可以用于音乐！查看 Magenta 项目的 <a href=\"https://magenta.tensorflow.org/music-vae\">MusicVAE<\/a> 项目，该项目使用自动编码器学习重建音乐。使用该库进行一些<a href=\"https://colab.research.google.com/github/magenta/magenta-demos/blob/master/colab-notebooks/Multitrack_MusicVAE.ipynb\">实验<\/a>，看看您能创造出什么。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/16\">课后测验<\/a><\/h2>\n<h2>复习与自学<\/h2>\n<p>参考以下资源，了解更多关于自动编码器的内容：<\/p>\n<ul>\n<li><a href=\"https://blog.keras.io/building-autoencoders-in-keras.html\">在 Keras 中构建自动编码器<\/a><\/li>\n<li><a href=\"https://neurohive.io/ru/osnovy-data-science/variacionnyj-avtojenkoder-vae/\">NeuroHive 博客文章<\/a><\/li>\n<li><a href=\"https://kvfrans.com/variational-autoencoders-explained/\">变分自动编码器详解<\/a><\/li>\n<li><a href=\"https://ijdykeman.github.io/ml/2016/12/21/cvae.html\">条件变分自动编码器<\/a><\/li>\n<\/ul>\n<h2>作业<\/h2>\n<p>在 <a href=\"../translations/zh-CN/lessons/4-ComputerVision/09-Autoencoders/AutoencodersTF.ipynb\">使用 TensorFlow 的自动编码器笔记本<\/a> 的末尾，您会发现一个“任务”——将其作为您的作业。<\/p>\n<hr />"},"lessons/4-ComputerVision/10-GANs/README.md":{"t":"生成对抗网络","h":"<h1>生成对抗网络<\/h1>\n<p>在上一节中，我们学习了<strong>生成模型<\/strong>：可以生成与训练数据集中的图像相似的新图像的模型。VAE是生成模型的一个很好的例子。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/19\">课前测验<\/a><\/h2>\n<p>然而，如果我们尝试生成一些真正有意义的内容，比如一幅分辨率合理的画作，使用VAE时会发现训练效果并不理想。针对这种情况，我们需要学习另一种专门用于生成模型的架构——<strong>生成对抗网络<\/strong>，简称GAN。<\/p>\n<p>GAN的核心思想是使用两个神经网络相互对抗进行训练：<\/p>\n<p><img src=\"../translated_images/zh-CN/gan_architecture.8f3a5ab62b8d5d69.webp\" width=\"70%\"/><\/p>\n<blockquote>\n<p>图片来源：<a href=\"http://soshnikov.com\">Dmitry Soshnikov<\/a><\/p>\n<p>✅ 一些术语：\n* <strong>生成器<\/strong>是一个网络，它接收一个随机向量，并生成图像作为输出。\n* <strong>判别器<\/strong>是一个网络，它接收一张图像，并判断该图像是来自训练数据集的真实图像，还是由生成器生成的虚假图像。它本质上是一个图像分类器。<\/p>\n<\/blockquote>\n<h3>判别器<\/h3>\n<p>判别器的架构与普通的图像分类网络没有区别。最简单的情况下，它可以是一个全连接分类器，但更常见的是一个<a href=\"#/doc/lessons/4-ComputerVision/07-ConvNets/README.md\">卷积网络<\/a>。<\/p>\n<blockquote>\n<p>✅ 基于卷积网络的GAN被称为<a href=\"https://arxiv.org/pdf/1511.06434.pdf\">DCGAN<\/a><\/p>\n<\/blockquote>\n<p>一个CNN判别器由以下层组成：几个卷积+池化层（空间尺寸逐渐减小），以及一个或多个全连接层以获得“特征向量”，最后是一个二分类器。<\/p>\n<blockquote>\n<p>✅ “池化”是一种减少图像尺寸的技术。“池化层通过将一个层中神经元簇的输出合并为下一层中的单个神经元来减少数据的维度。” - <a href=\"https://wikipedia.org/wiki/Convolutional_neural_network#Pooling_layers\">来源<\/a><\/p>\n<\/blockquote>\n<h3>生成器<\/h3>\n<p>生成器稍微复杂一些。可以将其视为一个反向的判别器。从一个潜在向量（代替特征向量）开始，它通过一个全连接层将其转换为所需的尺寸/形状，然后进行反卷积+上采样。这类似于<a href=\"#/doc/lessons/4-ComputerVision/09-Autoencoders/README.md\">自动编码器<\/a>的<em>解码器<\/em>部分。<\/p>\n<blockquote>\n<p>✅ 由于卷积层是通过线性滤波器遍历图像实现的，反卷积本质上与卷积类似，可以使用相同的层逻辑实现。<\/p>\n<\/blockquote>\n<p><img src=\"../translated_images/zh-CN/gan_arch_detail.46b95fd366f8e543.webp\" width=\"70%\"/><\/p>\n<blockquote>\n<p>图片来源：<a href=\"http://soshnikov.com\">Dmitry Soshnikov<\/a><\/p>\n<\/blockquote>\n<h3>GAN的训练<\/h3>\n<p>GAN被称为<strong>对抗性<\/strong>网络，因为生成器和判别器之间存在持续的竞争。在这种竞争中，生成器和判别器都会不断改进，从而使网络能够生成越来越好的图像。<\/p>\n<p>训练分为两个阶段：<\/p>\n<ul>\n<li><strong>训练判别器<\/strong>。这个任务相对简单：我们通过生成器生成一批图像，将其标记为0（代表虚假图像），然后从输入数据集中取一批图像（标记为1，真实图像）。我们计算出判别器的<em>损失<\/em>，并进行反向传播。<\/li>\n<li><strong>训练生成器<\/strong>。这稍微复杂一些，因为我们无法直接知道生成器的期望输出。我们将整个GAN网络（由生成器和判别器组成）输入一些随机向量，并期望输出为1（对应真实图像）。然后我们冻结判别器的参数（此步骤不对判别器进行训练），并进行反向传播。<\/li>\n<\/ul>\n<p>在这个过程中，生成器和判别器的损失不会显著下降。在理想情况下，它们应该呈现振荡状态，表明两个网络都在不断提高性能。<\/p>\n<h2>✍️ 练习：GANs<\/h2>\n<ul>\n<li><a href=\"../translations/zh-CN/lessons/4-ComputerVision/10-GANs/GANTF.ipynb\">TensorFlow/Keras中的GAN笔记本<\/a><\/li>\n<li><a href=\"../translations/zh-CN/lessons/4-ComputerVision/10-GANs/GANPyTorch.ipynb\">PyTorch中的GAN笔记本<\/a><\/li>\n<\/ul>\n<h3>GAN训练中的问题<\/h3>\n<p>GAN训练尤其困难，以下是一些常见问题：<\/p>\n<ul>\n<li><strong>模式崩溃<\/strong>。指生成器学会生成一种成功欺骗判别器的图像，而不是生成多样化的图像。<\/li>\n<li><strong>对超参数的敏感性<\/strong>。经常会发现GAN完全无法收敛，但突然降低学习率后可能会收敛。<\/li>\n<li><strong>保持生成器和判别器之间的平衡<\/strong>。在许多情况下，判别器的损失可能会迅速降到零，导致生成器无法继续训练。为了解决这个问题，可以尝试为生成器和判别器设置不同的学习率，或者在判别器损失已经很低时跳过判别器的训练。<\/li>\n<li><strong>高分辨率训练<\/strong>。与自动编码器类似的问题，重建卷积网络的过多层会导致伪影。通常通过所谓的<strong>渐进式增长<\/strong>来解决这一问题，先用低分辨率图像训练几层，然后逐步“解锁”或添加层。另一种解决方案是增加层之间的额外连接，同时训练多个分辨率——详情请参阅这篇<a href=\"https://arxiv.org/abs/1903.06048\">多尺度梯度GAN论文<\/a>。<\/li>\n<\/ul>\n<h2>风格迁移<\/h2>\n<p>GAN是生成艺术图像的绝佳工具。另一种有趣的技术是所谓的<strong>风格迁移<\/strong>，它将一个<strong>内容图像<\/strong>重新绘制为另一种风格，应用来自<strong>风格图像<\/strong>的滤镜。<\/p>\n<p>其工作原理如下：\n* 我们从一个随机噪声图像开始（或者从内容图像开始，但为了便于理解，通常从随机噪声开始）。\n* 我们的目标是生成一个图像，使其同时接近内容图像和风格图像。这通过两个损失函数来确定：\n   - <strong>内容损失<\/strong>基于CNN在某些层从当前图像和内容图像中提取的特征计算。\n   - <strong>风格损失<\/strong>通过一种巧妙的方法使用Gram矩阵在当前图像和风格图像之间计算（更多细节请参阅<a href=\"../translations/zh-CN/lessons/4-ComputerVision/10-GANs/StyleTransfer.ipynb\">示例笔记本<\/a>）。\n* 为了使图像更平滑并去除噪声，我们还引入了<strong>变化损失<\/strong>，它计算相邻像素之间的平均距离。\n* 主要的优化循环通过梯度下降（或其他优化算法）调整当前图像，以最小化总损失，总损失是所有三种损失的加权和。<\/p>\n<h2>✍️ 示例：<a href=\"../translations/zh-CN/lessons/4-ComputerVision/10-GANs/StyleTransfer.ipynb\">风格迁移<\/a><\/h2>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/20\">课后测验<\/a><\/h2>\n<h2>总结<\/h2>\n<p>在本课中，您学习了GAN及其训练方法。您还了解了这种类型的神经网络可能面临的特殊挑战，以及一些解决这些问题的策略。<\/p>\n<h2>🚀 挑战<\/h2>\n<p>运行<a href=\"../translations/zh-CN/lessons/4-ComputerVision/10-GANs/StyleTransfer.ipynb\">风格迁移笔记本<\/a>，使用您自己的图像进行实验。<\/p>\n<h2>复习与自学<\/h2>\n<p>参考以下资源，了解更多关于GAN的信息：<\/p>\n<ul>\n<li>Marco Pasini，<a href=\"https://towardsdatascience.com/10-lessons-i-learned-training-generative-adversarial-networks-gans-for-a-year-c9071159628\">我在训练GAN一年中学到的10个教训<\/a><\/li>\n<li><a href=\"https://en.wikipedia.org/wiki/StyleGAN\">StyleGAN<\/a>，一个值得关注的GAN架构<\/li>\n<li><a href=\"https://soshnikov.com/scienceart/creating-generative-art-using-gan-on-azureml/\">在Azure ML上使用GAN创建生成艺术<\/a><\/li>\n<\/ul>\n<h2>作业<\/h2>\n<p>重新访问本课相关的两个笔记本之一，并使用您自己的图像重新训练GAN。您能创造出什么？<\/p>\n<hr />"},"lessons/4-ComputerVision/11-ObjectDetection/README.md":{"t":"目标检测","h":"<h1>目标检测<\/h1>\n<p>我们之前处理的图像分类模型会接收一张图片并输出一个类别结果，例如在 MNIST 问题中输出类别“数字”。然而，在许多情况下，我们不仅仅想知道图片中有物体，还希望能够确定它们的具体位置。这正是<strong>目标检测<\/strong>的核心所在。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/21\">课前测验<\/a><\/h2>\n<p><img alt=\"目标检测\" src=\"../translated_images/zh-CN/Screen_Shot_2016-11-17_at_11.14.54_AM.b4bb3769353287be.webp\" /><\/p>\n<blockquote>\n<p>图片来源：<a href=\"https://pjreddie.com/darknet/yolov2/\">YOLO v2 网站<\/a><\/p>\n<\/blockquote>\n<h2>一种简单的目标检测方法<\/h2>\n<p>假设我们想在一张图片中找到一只猫，一种非常简单的目标检测方法如下：<\/p>\n<ol>\n<li>将图片分割成多个小块。<\/li>\n<li>对每个小块进行图像分类。<\/li>\n<li>对于分类结果激活值足够高的小块，可以认为其中包含目标物体。<\/li>\n<\/ol>\n<p><img alt=\"简单目标检测\" src=\"../translated_images/zh-CN/naive-detection.e7f1ba220ccd08c6.webp\" /><\/p>\n<blockquote>\n<p><em>图片来源：<a href=\"https://raw.githubusercontent.com/songbing1521/AI-For-Beginners-zh-CN/main/translations/zh-CN/lessons/4-ComputerVision/11-ObjectDetection/ObjectDetection-TF.ipynb\">练习笔记本<\/a><\/em><\/p>\n<\/blockquote>\n<p>然而，这种方法远非理想，因为它只能非常粗略地定位物体的边界框。为了更精确地定位，我们需要进行某种<strong>回归<\/strong>来预测边界框的坐标——这需要特定的数据集。<\/p>\n<h2>用回归进行目标检测<\/h2>\n<p><a href=\"https://towardsdatascience.com/object-detection-with-neural-networks-a4e2c46b4491\">这篇博客文章<\/a>对检测形状进行了很好的入门介绍。<\/p>\n<h2>目标检测数据集<\/h2>\n<p>在进行目标检测任务时，你可能会遇到以下数据集：<\/p>\n<ul>\n<li><a href=\"http://host.robots.ox.ac.uk/pascal/VOC/\">PASCAL VOC<\/a> - 包含20个类别<\/li>\n<li><a href=\"http://cocodataset.org/#home\">COCO<\/a> - 常见物体上下文数据集。包含80个类别、边界框和分割掩码<\/li>\n<\/ul>\n<p><img alt=\"COCO\" src=\"../translated_images/zh-CN/coco-examples.71bc60380fa6cceb.webp\" /><\/p>\n<h2>目标检测评估指标<\/h2>\n<h3>交并比（Intersection over Union）<\/h3>\n<p>对于图像分类来说，评估算法性能相对简单；但对于目标检测，我们需要同时评估类别的正确性以及推断出的边界框位置的精确性。后者通常使用<strong>交并比<\/strong>（IoU）来衡量两个框（或任意两个区域）的重叠程度。<\/p>\n<p><img alt=\"IoU\" src=\"../translated_images/zh-CN/iou_equation.9a4751d40fff4e11.webp\" /><\/p>\n<blockquote>\n<p><em>图片来源：<a href=\"https://pyimagesearch.com/2016/11/07/intersection-over-union-iou-for-object-detection/\">这篇关于IoU的优秀博客文章<\/a><\/em><\/p>\n<\/blockquote>\n<p>其思想很简单——将两个图形的交集面积除以它们的并集面积。对于两个完全相同的区域，IoU值为1；对于完全不相交的区域，IoU值为0。其他情况下，IoU值介于0到1之间。我们通常只考虑IoU值超过某个阈值的边界框。<\/p>\n<h3>平均精度（Average Precision）<\/h3>\n<p>假设我们想评估某个类别$C$的识别效果。为此，我们使用<strong>平均精度<\/strong>（AP）指标，其计算方法如下：<\/p>\n<ol>\n<li>绘制精度-召回曲线，显示检测阈值（从0到1）变化时的准确性。<\/li>\n<li>根据阈值，我们会检测到图片中的更多或更少的物体，并得到不同的精度和召回值。<\/li>\n<li>曲线如下所示：<\/li>\n<\/ol>\n<p><img src=\"https://github.com/shwars/NeuroWorkshop/raw/master/images/ObjDetectionPrecisionRecall.png\"/><\/p>\n<blockquote>\n<p><em>图片来源：<a href=\"http://github.com/shwars/NeuroWorkshop\">NeuroWorkshop<\/a><\/em><\/p>\n<\/blockquote>\n<p>类别$C$的平均精度是该曲线下的面积。更具体地说，召回轴通常分为10个部分，精度在这些点上取平均值：<\/p>\n<p>$$\nAP = {1\\over11}\\sum_{i=0}^{10}\\mbox{Precision}(\\mbox{Recall}={i\\over10})\n$$<\/p>\n<h3>AP与IoU<\/h3>\n<p>我们只考虑IoU超过某个阈值的检测结果。例如，在PASCAL VOC数据集中，通常假设$\\mbox{IoU Threshold} = 0.5$，而在COCO数据集中，AP会针对不同的$\\mbox{IoU Threshold}$值进行测量。<\/p>\n<p><img src=\"https://github.com/shwars/NeuroWorkshop/raw/master/images/ObjDetectionPrecisionRecallIoU.png\"/><\/p>\n<blockquote>\n<p><em>图片来源：<a href=\"http://github.com/shwars/NeuroWorkshop\">NeuroWorkshop<\/a><\/em><\/p>\n<\/blockquote>\n<h3>平均平均精度（Mean Average Precision - mAP）<\/h3>\n<p>目标检测的主要评估指标是<strong>平均平均精度<\/strong>（mAP）。它是所有类别的平均精度值，有时也会对$\\mbox{IoU Threshold}$进行平均。更详细的mAP计算过程可以参考\n<a href=\"https://medium.com/@timothycarlen/understanding-the-map-evaluation-metric-for-object-detection-a07fe6962cf3\">这篇博客文章<\/a>，以及<a href=\"https://gist.github.com/tarlen5/008809c3decf19313de216b9208f3734\">这里的代码示例<\/a>。<\/p>\n<h2>不同的目标检测方法<\/h2>\n<p>目标检测算法主要分为两大类：<\/p>\n<ul>\n<li><strong>区域提议网络<\/strong>（R-CNN, Fast R-CNN, Faster R-CNN）。其核心思想是生成<strong>兴趣区域<\/strong>（ROI），并对其运行CNN以寻找最大激活值。这种方法与简单方法有些类似，但ROI的生成方式更为智能。这类方法的主要缺点是速度较慢，因为需要对图像进行多次CNN分类器的处理。<\/li>\n<li><strong>单次检测<\/strong>（YOLO, SSD, RetinaNet）方法。这些架构设计的网络能够在一次处理过程中同时预测类别和ROI。<\/li>\n<\/ul>\n<h3>R-CNN：基于区域的CNN<\/h3>\n<p><a href=\"http://islab.ulsan.ac.kr/files/announcement/513/rcnn_pami.pdf\">R-CNN<\/a>使用<a href=\"http://www.huppelen.nl/publications/selectiveSearchDraft.pdf\">选择性搜索<\/a>生成ROI区域的层次结构，然后通过CNN特征提取器和SVM分类器确定物体类别，并通过线性回归确定<em>边界框<\/em>坐标。<a href=\"https://arxiv.org/pdf/1506.01497v1.pdf\">官方论文<\/a><\/p>\n<p><img alt=\"RCNN\" src=\"../translated_images/zh-CN/rcnn1.cae407020dfb1d1f.webp\" /><\/p>\n<blockquote>\n<p><em>图片来源：van de Sande et al. ICCV’11<\/em><\/p>\n<\/blockquote>\n<p><img alt=\"RCNN-1\" src=\"../translated_images/zh-CN/rcnn2.2d9530bb83516484.webp\" /><\/p>\n<blockquote>\n<p><em>图片来源：<a href=\"https://towardsdatascience.com/r-cnn-fast-r-cnn-faster-r-cnn-yolo-object-detection-algorithms-36d53571365e\">这篇博客<\/a><\/em><\/p>\n<\/blockquote>\n<h3>F-RCNN - 快速R-CNN<\/h3>\n<p>这种方法与R-CNN类似，但区域是在应用卷积层之后定义的。<\/p>\n<p><img alt=\"FRCNN\" src=\"../translated_images/zh-CN/f-rcnn.3cda6d9bb4188875.webp\" /><\/p>\n<blockquote>\n<p>图片来源：<a href=\"https://www.cv-foundation.org/openaccess/content_iccv_2015/papers/Girshick_Fast_R-CNN_ICCV_2015_paper.pdf\">官方论文<\/a>，<a href=\"https://arxiv.org/pdf/1504.08083.pdf\">arXiv<\/a>，2015<\/p>\n<\/blockquote>\n<h3>Faster R-CNN<\/h3>\n<p>这种方法的核心思想是使用神经网络预测ROI——即所谓的<em>区域提议网络<\/em>。<a href=\"https://arxiv.org/pdf/1506.01497.pdf\">论文<\/a>，2016<\/p>\n<p><img alt=\"FasterRCNN\" src=\"../translated_images/zh-CN/faster-rcnn.8d46c099b87ef30a.webp\" /><\/p>\n<blockquote>\n<p>图片来源：<a href=\"https://arxiv.org/pdf/1506.01497.pdf\">官方论文<\/a><\/p>\n<\/blockquote>\n<h3>R-FCN：基于区域的全卷积网络<\/h3>\n<p>这种算法比Faster R-CNN更快。其核心思想如下：<\/p>\n<ol>\n<li>使用ResNet-101提取特征。<\/li>\n<li>特征通过<strong>位置敏感得分图<\/strong>处理。每个类别$C$的物体被划分为$k\\times k$区域，并训练预测物体的各部分。<\/li>\n<li>对于$k\\times k$区域中的每个部分，所有网络对物体类别进行投票，选择投票最多的类别。<\/li>\n<\/ol>\n<p><img alt=\"r-fcn image\" src=\"../translated_images/zh-CN/r-fcn.13eb88158b99a3da.webp\" /><\/p>\n<blockquote>\n<p>图片来源：<a href=\"https://arxiv.org/abs/1605.06409\">官方论文<\/a><\/p>\n<\/blockquote>\n<h3>YOLO - 只看一次<\/h3>\n<p>YOLO是一种实时单次检测算法。其核心思想如下：<\/p>\n<ul>\n<li>将图像划分为$S\\times S$区域。<\/li>\n<li>对每个区域，<strong>CNN<\/strong>预测$n$个可能的物体、<em>边界框<\/em>坐标和<em>置信度<\/em>=<em>概率<\/em> * IoU。<\/li>\n<\/ul>\n<p><img alt=\"YOLO\" src=\"../translated_images/zh-CN/yolo.a2648ec82ee8bb4e.webp\" /><\/p>\n<blockquote>\n<p>图片来源：<a href=\"https://arxiv.org/abs/1506.02640\">官方论文<\/a><\/p>\n<\/blockquote>\n<h3>其他算法<\/h3>\n<ul>\n<li>RetinaNet: <a href=\"https://arxiv.org/abs/1708.02002\">官方论文<\/a><\/li>\n<li><a href=\"https://pytorch.org/vision/stable/_modules/torchvision/models/detection/retinanet.html\">Torchvision中的PyTorch实现<\/a><\/li>\n<li><a href=\"https://github.com/fizyr/keras-retinanet\">Keras实现<\/a><\/li>\n<li><a href=\"https://keras.io/examples/vision/retinanet/\">Keras示例中的RetinaNet目标检测<\/a><\/li>\n<li>SSD（单次检测器）：<a href=\"https://arxiv.org/abs/1512.02325\">官方论文<\/a><\/li>\n<\/ul>\n<h2>✍️ 练习：目标检测<\/h2>\n<p>通过以下笔记本继续学习：<\/p>\n<p><a href=\"../translations/zh-CN/lessons/4-ComputerVision/11-ObjectDetection/ObjectDetection.ipynb\">ObjectDetection.ipynb<\/a><\/p>\n<h2>总结<\/h2>\n<p>在本课中，你快速了解了实现目标检测的各种方法！<\/p>\n<h2>🚀 挑战<\/h2>\n<p>阅读以下关于YOLO的文章和笔记本，并尝试自己动手实践：<\/p>\n<ul>\n<li><a href=\"https://www.analyticsvidhya.com/blog/2018/12/practical-guide-object-detection-yolo-framewor-python/\">关于YOLO的优秀博客文章<\/a><\/li>\n<li><a href=\"https://pjreddie.com/darknet/yolo/\">官方网站<\/a><\/li>\n<li>YOLO：<a href=\"https://github.com/experiencor/keras-yolo2\">Keras实现<\/a>，<a href=\"https://github.com/experiencor/basic-yolo-keras/blob/master/Yolo%20Step-by-Step.ipynb\">逐步讲解笔记本<\/a><\/li>\n<li>YOLO v2：<a href=\"https://github.com/experiencor/keras-yolo2\">Keras实现<\/a>，<a href=\"https://github.com/experiencor/keras-yolo2/blob/master/Yolo%20Step-by-Step.ipynb\">逐步讲解笔记本<\/a><\/li>\n<\/ul>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/22\">课后测验<\/a><\/h2>\n<h2>复习与自学<\/h2>\n<ul>\n<li><a href=\"https://tjmachinelearning.com/lectures/1718/obj/\">目标检测<\/a> by Nikhil Sardana<\/li>\n<li><a href=\"https://lilianweng.github.io/lil-log/2018/12/27/object-detection-part-4.html\">目标检测算法的优秀比较<\/a><\/li>\n<li><a href=\"https://medium.com/comet-app/review-of-deep-learning-algorithms-for-object-detection-c1f3d437b852\">深度学习目标检测算法综述<\/a><\/li>\n<li><a href=\"https://www.analyticsvidhya.com/blog/2018/10/a-step-by-step-introduction-to-the-basic-object-detection-algorithms-part-1/\">目标检测算法基础入门<\/a><\/li>\n<li><a href=\"https://www.analyticsvidhya.com/blog/2018/11/implementation-faster-r-cnn-python-object-detection/\">Python实现Faster R-CNN进行目标检测<\/a><\/li>\n<\/ul>\n<h2><a href=\"#/doc/lessons/4-ComputerVision/11-ObjectDetection/lab/README.md\">作业：目标检测<\/a><\/h2>\n<hr />"},"lessons/4-ComputerVision/11-ObjectDetection/lab/README.md":{"t":"目标检测 · 实验","h":"<h1>使用好莱坞头部数据集进行头部检测<\/h1>\n<p>来自 <a href=\"https://github.com/microsoft/ai-for-beginners\">AI 初学者课程<\/a> 的实验任务。<\/p>\n<h2>任务<\/h2>\n<p>通过视频监控摄像头流统计人数是一项重要任务，它可以帮助我们估算商店的访客数量、餐厅的繁忙时段等。为了解决这个任务，我们需要能够从不同角度检测人类的头部。为了训练一个能够检测人类头部的目标检测模型，我们可以使用 <a href=\"https://www.di.ens.fr/willow/research/headdetection/\">好莱坞头部数据集<\/a>。<\/p>\n<h2>数据集<\/h2>\n<p><a href=\"https://www.di.ens.fr/willow/research/headdetection/release/HollywoodHeads.zip\">好莱坞头部数据集<\/a> 包含了 369,846 个标注的人类头部，分布在 224,740 帧好莱坞电影画面中。数据集采用 <a href=\"https://raw.githubusercontent.com/songbing1521/AI-For-Beginners-zh-CN/main/lessons/4-ComputerVision/11-ObjectDetection/lab/PASCAL%20VOC\">https://host.robots.ox.ac.uk/pascal/VOC/<\/a> 格式提供，每张图片都有一个对应的 XML 描述文件，格式如下：<\/p>\n<pre><code class=\"language-xml\">&lt;annotation&gt;\n    &lt;folder&gt;HollywoodHeads&lt;/folder&gt;\n    &lt;filename&gt;mov_021_149390.jpeg&lt;/filename&gt;\n    &lt;source&gt;\n        &lt;database&gt;HollywoodHeads 2015 Database&lt;/database&gt;\n        &lt;annotation&gt;HollywoodHeads 2015&lt;/annotation&gt;\n        &lt;image&gt;WILLOW&lt;/image&gt;\n    &lt;/source&gt;\n    &lt;size&gt;\n        &lt;width&gt;608&lt;/width&gt;\n        &lt;height&gt;320&lt;/height&gt;\n        &lt;depth&gt;3&lt;/depth&gt;\n    &lt;/size&gt;\n    &lt;segmented&gt;0&lt;/segmented&gt;\n    &lt;object&gt;\n        &lt;name&gt;head&lt;/name&gt;\n        &lt;bndbox&gt;\n            &lt;xmin&gt;201&lt;/xmin&gt;\n            &lt;ymin&gt;1&lt;/ymin&gt;\n            &lt;xmax&gt;480&lt;/xmax&gt;\n            &lt;ymax&gt;263&lt;/ymax&gt;\n        &lt;/bndbox&gt;\n        &lt;difficult&gt;0&lt;/difficult&gt;\n    &lt;/object&gt;\n    &lt;object&gt;\n        &lt;name&gt;head&lt;/name&gt;\n        &lt;bndbox&gt;\n            &lt;xmin&gt;3&lt;/xmin&gt;\n            &lt;ymin&gt;4&lt;/ymin&gt;\n            &lt;xmax&gt;241&lt;/xmax&gt;\n            &lt;ymax&gt;285&lt;/ymax&gt;\n        &lt;/bndbox&gt;\n        &lt;difficult&gt;0&lt;/difficult&gt;\n    &lt;/object&gt;\n&lt;/annotation&gt;\n<\/code><\/pre>\n<p>在这个数据集中，只有一个类别的对象 <code>head<\/code>，对于每个头部，都会提供其边界框的坐标。你可以使用 Python 库解析 XML，或者使用 <a href=\"https://pypi.org/project/pascal-voc/\">这个库<\/a> 直接处理 PASCAL VOC 格式。<\/p>\n<h2>训练目标检测模型<\/h2>\n<p>你可以通过以下方式之一来训练目标检测模型：<\/p>\n<ul>\n<li>使用 <a href=\"https://docs.microsoft.com/azure/cognitive-services/custom-vision-service/quickstarts/object-detection?tabs=visual-studio&amp;WT.mc_id=academic-77998-cacaste\">Azure Custom Vision<\/a> 及其 Python API，在云端以编程方式训练模型。Custom Vision 只能使用几百张图片进行模型训练，因此可能需要限制数据集的规模。<\/li>\n<li>使用 <a href=\"https://keras.io/examples/vision/retinanet/\">Keras 教程<\/a> 中的示例来训练 RetunaNet 模型。<\/li>\n<li>使用 <a href=\"https://pytorch.org/vision/stable/_modules/torchvision/models/detection/retinanet.html\">torchvision.models.detection.RetinaNet<\/a> 中的内置模块进行训练。<\/li>\n<\/ul>\n<h2>收获<\/h2>\n<p>目标检测是工业中经常需要完成的任务。虽然有一些服务可以用来执行目标检测（例如 <a href=\"https://docs.microsoft.com/azure/cognitive-services/custom-vision-service/quickstarts/object-detection?tabs=visual-studio&amp;WT.mc_id=academic-77998-cacaste\">Azure Custom Vision<\/a>），但理解目标检测的工作原理并能够训练自己的模型是非常重要的。<\/p>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务<a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a>进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。原始语言的文档应被视为权威来源。对于关键信息，建议使用专业人工翻译。我们对因使用此翻译而产生的任何误解或误读不承担责任。<\/p>"},"lessons/4-ComputerVision/12-Segmentation/README.md":{"t":"分割","h":"<h1>分割<\/h1>\n<p>我们之前学习了目标检测，它可以通过预测<em>边界框<\/em>来定位图像中的对象。然而，对于某些任务，我们不仅需要边界框，还需要更精确的对象定位。这项任务被称为<strong>分割<\/strong>。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/23\">课前测验<\/a><\/h2>\n<p>分割可以看作是<strong>像素分类<\/strong>，即对于图像中的<strong>每个<\/strong>像素，我们必须预测其类别（<em>背景<\/em>是其中一个类别）。主要有两种分割算法：<\/p>\n<ul>\n<li><strong>语义分割<\/strong>只告诉像素的类别，不区分同一类别的不同对象。<\/li>\n<li><strong>实例分割<\/strong>将类别划分为不同的实例。<\/li>\n<\/ul>\n<p>例如，对于实例分割，这些羊是不同的对象；而对于语义分割，所有的羊都被表示为一个类别。<\/p>\n<p><img src=\"../translated_images/zh-CN/instance_vs_semantic.eee9812bebf8cd45.webp\" width=\"50%\"><\/p>\n<blockquote>\n<p>图片来源于<a href=\"https://nirmalamurali.medium.com/image-classification-vs-semantic-segmentation-vs-instance-segmentation-625c33a08d50\">这篇博客文章<\/a><\/p>\n<\/blockquote>\n<p>分割有不同的神经网络架构，但它们的结构都相同。从某种意义上说，它类似于你之前学习过的自动编码器，但不是解构原始图像，而是解构一个<strong>掩码<\/strong>。因此，分割网络包括以下部分：<\/p>\n<ul>\n<li><strong>编码器<\/strong>从输入图像中提取特征<\/li>\n<li><strong>解码器<\/strong>将这些特征转换为<strong>掩码图像<\/strong>，其大小与通道数对应于类别数量。<\/li>\n<\/ul>\n<p><img src=\"../translated_images/zh-CN/segm.92442f2cb42ff4fa.webp\" width=\"80%\"><\/p>\n<blockquote>\n<p>图片来源于<a href=\"https://arxiv.org/pdf/2001.05566.pdf\">这篇论文<\/a><\/p>\n<\/blockquote>\n<p>我们特别需要提到分割中使用的损失函数。在使用经典自动编码器时，我们需要测量两张图像之间的相似性，可以使用均方误差（MSE）来实现。在分割中，目标掩码图像中的每个像素表示类别编号（在第三维度上进行独热编码），因此我们需要使用特定于分类的损失函数——交叉熵损失，并对所有像素进行平均。如果掩码是二值的，则使用<strong>二值交叉熵损失<\/strong>（BCE）。<\/p>\n<blockquote>\n<p>✅ 独热编码是一种将类别标签编码为长度等于类别数量的向量的方法。可以查看<a href=\"https://datagy.io/sklearn-one-hot-encode/\">这篇文章<\/a>了解这一技术。<\/p>\n<\/blockquote>\n<h2>医学影像中的分割<\/h2>\n<p>在本课中，我们将通过训练网络识别医学图像中的人类痣（也称为黑痣）来实际应用分割技术。我们将使用<a href=\"https://www.fc.up.pt/addi/ph2%20database.html\">PH<sup>2<\/sup>数据库<\/a>的皮肤镜图像作为图像来源。该数据集包含200张图像，分为三类：典型痣、非典型痣和黑色素瘤。所有图像还包含一个对应的<strong>掩码<\/strong>，用于勾勒痣的轮廓。<\/p>\n<blockquote>\n<p>✅ 这种技术特别适用于这种类型的医学影像，但你还能想到哪些其他的实际应用场景？<\/p>\n<\/blockquote>\n<p><img alt=\"navi\" src=\"../translated_images/zh-CN/navi.2f20b727910110ea.webp\"/><\/p>\n<blockquote>\n<p>图片来源于PH<sup>2<\/sup>数据库<\/p>\n<\/blockquote>\n<p>我们将训练一个模型，将任何痣从背景中分割出来。<\/p>\n<h2>✍️ 练习：语义分割<\/h2>\n<p>打开以下笔记本，了解不同的语义分割架构，练习使用它们，并观察它们的实际效果。<\/p>\n<ul>\n<li><a href=\"../translations/zh-CN/lessons/4-ComputerVision/12-Segmentation/SemanticSegmentationPytorch.ipynb\">语义分割 Pytorch<\/a><\/li>\n<li><a href=\"../translations/zh-CN/lessons/4-ComputerVision/12-Segmentation/SemanticSegmentationTF.ipynb\">语义分割 TensorFlow<\/a><\/li>\n<\/ul>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/24\">课后测验<\/a><\/h2>\n<h2>总结<\/h2>\n<p>分割是一种非常强大的图像分类技术，它超越了边界框，实现了像素级分类。这项技术在医学影像等领域有广泛应用。<\/p>\n<h2>🚀 挑战<\/h2>\n<p>人体分割只是我们可以对人物图像进行的常见任务之一。其他重要任务包括<strong>骨架检测<\/strong>和<strong>姿态检测<\/strong>。试试<a href=\"https://github.com/CMU-Perceptual-Computing-Lab/openpose\">OpenPose<\/a>库，看看姿态检测的实际应用。<\/p>\n<h2>复习与自学<\/h2>\n<p>这篇<a href=\"https://wikipedia.org/wiki/Image_segmentation\">维基百科文章<\/a>提供了关于该技术各种应用的良好概述。自行学习实例分割和全景分割领域的相关知识。<\/p>\n<h2><a href=\"#/doc/lessons/4-ComputerVision/12-Segmentation/lab/README.md\">作业<\/a><\/h2>\n<p>在本实验中，尝试使用<a href=\"https://www.kaggle.com/datasets/tapakah68/segmentation-full-body-mads-dataset\">Segmentation Full Body MADS Dataset<\/a>数据集进行<strong>人体分割<\/strong>。<\/p>\n<hr />"},"lessons/4-ComputerVision/12-Segmentation/lab/README.md":{"t":"分割 · 实验","h":"<h1>人体分割<\/h1>\n<p>来自 <a href=\"https://github.com/microsoft/ai-for-beginners\">AI for Beginners Curriculum<\/a> 的实验任务。<\/p>\n<h2>任务<\/h2>\n<p>在视频制作中，例如天气预报，我们经常需要从摄像机中剪切出人像，并将其叠加到其他画面上。这通常通过 <strong>抠像技术（chroma key）<\/strong> 实现，即人在一个统一颜色的背景前拍摄，然后将背景移除。在本实验中，我们将训练一个神经网络模型来剪切出人像轮廓。<\/p>\n<h2>数据集<\/h2>\n<p>我们将使用来自 Kaggle 的 <a href=\"https://www.kaggle.com/datasets/tapakah68/segmentation-full-body-mads-dataset\">Segmentation Full Body MADS Dataset<\/a>。请从 Kaggle 手动下载该数据集。<\/p>\n<h2>起始笔记本<\/h2>\n<p>通过打开 <a href=\"https://raw.githubusercontent.com/songbing1521/AI-For-Beginners-zh-CN/main/lessons/4-ComputerVision/12-Segmentation/lab/BodySegmentation.ipynb\">BodySegmentation.ipynb<\/a> 开始实验。<\/p>\n<h2>收获<\/h2>\n<p>人体分割只是我们可以对人物图像进行的常见任务之一。其他重要任务包括 <strong>骨架检测<\/strong> 和 <strong>姿态检测<\/strong>。可以查看 <a href=\"https://github.com/CMU-Perceptual-Computing-Lab/openpose\">OpenPose<\/a> 库，了解如何实现这些任务。<\/p>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原文档的原始语言版本为权威来源。对于关键信息，建议使用专业人工翻译。我们对因使用本翻译而引起的任何误解或误读不承担责任。<\/p>"},"lessons/5-NLP/README.md":{"t":"自然语言处理","h":"<h1>自然语言处理<\/h1>\n<p><img alt=\"自然语言处理任务概览草图\" src=\"../translated_images/zh-CN/ai-nlp.b22dcb8ca4707cea.webp\" /><\/p>\n<p>在本节中，我们将重点使用神经网络处理与<strong>自然语言处理（NLP）<\/strong>相关的任务。我们希望计算机能够解决许多NLP问题：<\/p>\n<ul>\n<li><strong>文本分类<\/strong>是一个典型的关于文本序列的分类问题。例子包括将电子邮件消息分类为垃圾邮件或非垃圾邮件，或将文章分类为体育、商业、政治等。同时，在开发聊天机器人时，我们常常需要理解用户的意图——这时我们处理的是<strong>意图分类<\/strong>。意图分类中通常需要处理很多类别。\n<em> <strong>情感分析<\/strong>是一个典型的回归问题，我们需要给句子含义的正负程度赋予一个数值（情绪值）。情感分析的更高级版本是<strong>基于方面的情感分析<\/strong>（ABSA），我们不是对整个句子赋予情感，而是对句子的不同部分（方面）赋予情感，例如 <\/em>这家餐厅，我喜欢它的菜肴，但氛围很糟糕<em>。\n<em> <strong>命名实体识别<\/strong>（NER）指的是从文本中提取特定实体的问题。例如，我们需要理解短语 <\/em>我明天需要飞往巴黎<em> 中，<\/em>明天<em> 指的是日期，<\/em>巴黎<\/em> 是位置。  <\/li>\n<li><strong>关键词提取<\/strong>与NER类似，但我们需要自动提取对句子意义重要的词汇，而无需针对特定实体类型进行预训练。<\/li>\n<li><strong>文本聚类<\/strong>在我们希望将相似句子归为一组时非常有用，例如，在技术支持对话中相似的请求。<\/li>\n<li><strong>问答系统<\/strong>指模型回答具体问题的能力。模型输入一段文本和一个问题，需要在文本中找出包含问题答案的位置（或者有时直接生成答案文本）。\n<em> <strong>文本生成<\/strong>是模型生成新文本的能力。它可以被视为一个基于某个<\/em>文本提示*预测下一个字母或单词的分类任务。先进的文本生成模型，如GPT-3，能够使用称为<a href=\"https://towardsdatascience.com/software-3-0-how-prompting-will-change-the-rules-of-the-game-a982fbfe1e0\">提示编程<\/a>或<a href=\"https://medium.com/swlh/openai-gpt-3-and-prompt-engineering-dcdc2c5fcd29\">提示工程<\/a>的技术解决其他NLP任务如分类。<\/li>\n<li><strong>文本摘要<\/strong>是一种技术，我们希望计算机“阅读”长文本并将其总结成几句话。<\/li>\n<li><strong>机器翻译<\/strong>可以视为一种在一种语言上理解文本，在另一种语言上生成文本的结合。<\/li>\n<\/ul>\n<p>最初，大多数NLP任务是用传统方法如文法来解决的。例如，在机器翻译中，解析器用于将初始句子转换为语法树，然后提取更高层次的语义结构来表示句子的含义，基于这个含义和目标语言的文法生成结果。如今，许多NLP任务更有效的解决方法是使用神经网络。<\/p>\n<blockquote>\n<p>许多经典的NLP方法在<a href=\"https://www.nltk.org\">自然语言处理工具包（NLTK）<\/a> Python库中实现。网上有一本很棒的<a href=\"https://www.nltk.org/book/\">NLTK书籍<\/a>，介绍了如何使用NLTK解决不同的NLP任务。<\/p>\n<\/blockquote>\n<p>在我们的课程中，我们将主要关注使用神经网络处理NLP，并在需要时使用NLTK。<\/p>\n<p>我们已经学习过如何使用神经网络处理表格数据和图像。这些数据与文本的主要区别在于，文本是可变长度的序列，而图像的输入大小是预先已知的。虽然卷积网络可从输入数据中提取模式，但文本中的模式更为复杂。例如，否定词与主语之间可以隔开任意多个词（如 <em>我不喜欢橙子<\/em>，和 <em>我不喜欢那些又大又好吃的彩色橙子<\/em>），但仍然应被视为一个模式。因此，为了处理语言，我们需要引入新的神经网络类型，如<em>循环网络<\/em>和<em>transformer<\/em>。<\/p>\n<h2>安装库<\/h2>\n<p>如果你在本地Python环境中运行本课程，可能需要使用以下命令安装所有NLP所需的库：<\/p>\n<p><strong>对于PyTorch<\/strong><\/p>\n<pre><code class=\"language-bash\">pip install -r requirements-pytorch.txt\n<\/code><\/pre>\n<p><strong>对于TensorFlow<\/strong><\/p>\n<pre><code class=\"language-bash\">pip install -r requirements-tf.txt\n<\/code><\/pre>\n<blockquote>\n<p>你可以在<a href=\"https://docs.microsoft.com/learn/modules/intro-natural-language-processing-tensorflow/?WT.mc_id=academic-77998-cacaste\">Microsoft Learn<\/a>上尝试使用TensorFlow进行NLP<\/p>\n<\/blockquote>\n<h2>GPU 注意事项<\/h2>\n<p>本节中，在一些示例里我们将训练相当大型的模型。\n* <strong>使用支持GPU的电脑<\/strong>：建议在支持GPU的计算机上运行笔记本，以减少使用大型模型时等待的时间。\n* <strong>GPU内存限制<\/strong>：使用GPU时，训练大型模型可能会导致GPU内存不足。\n* <strong>GPU内存消耗<\/strong>：训练时消耗的GPU内存量取决于多个因素，包括小批量大小。\n* <strong>尽可能减小小批量大小<\/strong>：遇到GPU内存问题时，可以尝试通过减小代码中的小批量大小来解决。\n* <strong>TensorFlow GPU内存释放<\/strong>：较旧版本的TensorFlow在同一Python内核中训练多个模型时可能无法正确释放GPU内存。为有效管理GPU内存，你可以配置TensorFlow按需分配GPU内存。\n* <strong>代码示例<\/strong>：要设置TensorFlow仅按需增长GPU内存分配，可在笔记本中加入以下代码：<\/p>\n<pre><code class=\"language-python\">physical_devices = tf.config.list_physical_devices('GPU') \nif len(physical_devices)&gt;0:\n    tf.config.experimental.set_memory_growth(physical_devices[0], True) \n<\/code><\/pre>\n<p>如果你对从经典机器学习的角度学习NLP感兴趣，请访问<a href=\"https://github.com/microsoft/ML-For-Beginners/tree/main/6-NLP\">这套课程<\/a><\/p>\n<h2>本节内容<\/h2>\n<p>本节我们将学习：<\/p>\n<ul>\n<li><a href=\"#/doc/lessons/5-NLP/13-TextRep/README.md\">将文本表示为张量<\/a><\/li>\n<li><a href=\"../translations/zh-CN/lessons/5-NLP/14-Emdeddings/README.md\">词嵌入<\/a><\/li>\n<li><a href=\"#/doc/lessons/5-NLP/15-LanguageModeling/README.md\">语言模型<\/a><\/li>\n<li><a href=\"#/doc/lessons/5-NLP/16-RNN/README.md\">循环神经网络<\/a><\/li>\n<li><a href=\"#/doc/lessons/5-NLP/17-GenerativeNetworks/README.md\">生成网络<\/a><\/li>\n<li><a href=\"#/doc/lessons/5-NLP/18-Transformers/README.md\">Transformer<\/a><\/li>\n<\/ul>\n<hr />\n<!-- CO-OP TRANSLATOR DISCLAIMER START -->\n<p><strong>免责声明<\/strong>：\n本文件由 AI 翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 翻译完成。尽管我们力求准确，但请注意，自动翻译可能包含错误或不准确之处。原始语言版文件应视为权威来源。对于重要信息，建议使用专业人工翻译。我们对因使用本翻译而产生的任何误解或误释不承担责任。<\/p>\n<!-- CO-OP TRANSLATOR DISCLAIMER END -->"},"lessons/5-NLP/13-TextRep/README.md":{"t":"将文本表示为张量","h":"<h1>将文本表示为张量<\/h1>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/25\">课前测验<\/a><\/h2>\n<h2>文本分类<\/h2>\n<p>在本节的第一部分中，我们将专注于<strong>文本分类<\/strong>任务。我们将使用 <a href=\"https://www.kaggle.com/amananandrai/ag-news-classification-dataset\">AG News<\/a> 数据集，该数据集包含如下新闻文章：<\/p>\n<ul>\n<li>类别：科技<\/li>\n<li>标题：Ky.公司获得研究肽类的资助（美联社）<\/li>\n<li>正文：美联社 - 一家由路易斯维尔大学化学研究员创立的公司获得了一项开发资助...<\/li>\n<\/ul>\n<p>我们的目标是根据文本将新闻项目分类到某个类别中。<\/p>\n<h2>表示文本<\/h2>\n<p>如果我们想用神经网络解决自然语言处理（NLP）任务，我们需要一种方法将文本表示为张量。计算机已经通过诸如 ASCII 或 UTF-8 等编码将文本字符表示为数字，这些数字映射到屏幕上的字体。<\/p>\n<p><img alt=\"显示字符映射到 ASCII 和二进制表示的图示\" src=\"../translated_images/zh-CN/ascii-character-map.18ed6aa7f3b0a7ff.webp\" width=\"50%\"/><\/p>\n<blockquote>\n<p><a href=\"https://www.seobility.net/en/wiki/ASCII\">图片来源<\/a><\/p>\n<\/blockquote>\n<p>作为人类，我们理解每个字母<strong>代表<\/strong>什么，以及所有字符如何组合形成句子的单词。然而，计算机本身并没有这样的理解，神经网络需要在训练过程中学习这些含义。<\/p>\n<p>因此，我们可以使用不同的方法来表示文本：<\/p>\n<ul>\n<li><strong>字符级表示<\/strong>，即将文本中的每个字符表示为一个数字。假设我们的文本语料库中有 <em>C<\/em> 个不同的字符，那么单词 <em>Hello<\/em> 将被表示为一个 5x<em>C<\/em> 的张量。每个字母对应于一个独热编码的张量列。<\/li>\n<li><strong>词级表示<\/strong>，即我们创建一个包含文本中所有单词的<strong>词汇表<\/strong>，然后使用独热编码表示单词。这种方法更好一些，因为单个字母本身没有太多意义，因此通过使用更高级的语义概念——单词——我们简化了神经网络的任务。然而，由于词汇表的规模较大，我们需要处理高维稀疏张量。<\/li>\n<\/ul>\n<p>无论采用哪种表示方式，我们首先需要将文本转换为<strong>标记<\/strong>序列，一个标记可以是字符、单词，甚至是单词的一部分。然后，我们使用<strong>词汇表<\/strong>将标记转换为数字，这个数字可以通过独热编码输入到神经网络中。<\/p>\n<h2>N-Grams<\/h2>\n<p>在自然语言中，单词的确切含义只能在上下文中确定。例如，<em>神经网络<\/em> 和 <em>捕鱼网络<\/em> 的含义完全不同。考虑上下文的一种方法是基于单词对构建模型，并将单词对视为单独的词汇标记。这样，句子 <em>I like to go fishing<\/em> 将被表示为以下标记序列：<em>I like<\/em>，<em>like to<\/em>，<em>to go<\/em>，<em>go fishing<\/em>。这种方法的问题在于词汇表的规模显著增长，并且像 <em>go fishing<\/em> 和 <em>go shopping<\/em> 这样的组合被表示为不同的标记，尽管它们使用了相同的动词，但并没有共享任何语义相似性。<\/p>\n<p>在某些情况下，我们可能会考虑使用三元组（tri-grams）——三个单词的组合。因此，这种方法通常被称为<strong>n-grams<\/strong>。此外，使用字符级表示时，n-grams 通常大致对应于不同的音节。<\/p>\n<h2>词袋模型和 TF/IDF<\/h2>\n<p>在解决文本分类等任务时，我们需要能够用一个固定大小的向量表示文本，这个向量将作为最终密集分类器的输入。最简单的方法之一是组合所有单个单词的表示，例如通过将它们相加。如果我们将每个单词的独热编码相加，我们将得到一个频率向量，显示每个单词在文本中出现的次数。这种文本表示被称为<strong>词袋模型<\/strong>（BoW）。<\/p>\n<p><img src=\"../translated_images/zh-CN/bow.3811869cff59368d.webp\" width=\"90%\"/><\/p>\n<blockquote>\n<p>图片由作者提供<\/p>\n<\/blockquote>\n<p>词袋模型本质上表示了文本中出现了哪些单词以及它们的数量，这确实可以很好地指示文本的内容。例如，关于政治的新闻文章可能包含 <em>总统<\/em> 和 <em>国家<\/em> 等词，而科学出版物可能包含 <em>对撞机<\/em>、<em>发现<\/em> 等词。因此，单词频率在许多情况下可以很好地指示文本内容。<\/p>\n<p>词袋模型的问题在于某些常见单词，例如 <em>and<\/em>、<em>is<\/em> 等，出现在大多数文本中，并且它们的频率最高，从而掩盖了真正重要的单词。我们可以通过考虑单词在整个文档集合中出现的频率来降低这些单词的重要性。这就是 TF/IDF 方法的主要思想，该方法在本课附带的笔记本中有更详细的介绍。<\/p>\n<p>然而，这些方法都无法完全考虑文本的<strong>语义<\/strong>。我们需要更强大的神经网络模型来实现这一点，我们将在本节后续内容中讨论。<\/p>\n<h2>✍️ 练习：文本表示<\/h2>\n<p>通过以下笔记本继续学习：<\/p>\n<ul>\n<li><a href=\"../translations/zh-CN/lessons/5-NLP/13-TextRep/TextRepresentationPyTorch.ipynb\">使用 PyTorch 表示文本<\/a><\/li>\n<li><a href=\"../translations/zh-CN/lessons/5-NLP/13-TextRep/TextRepresentationTF.ipynb\">使用 TensorFlow 表示文本<\/a><\/li>\n<\/ul>\n<h2>总结<\/h2>\n<p>到目前为止，我们已经学习了可以为不同单词添加频率权重的技术。然而，这些技术无法表示单词的含义或顺序。正如著名语言学家 J. R. Firth 在1935年所说：“单词的完整意义总是与上下文相关，任何脱离上下文的意义研究都不能被认真对待。”我们将在课程后续内容中学习如何通过语言建模从文本中捕获上下文信息。<\/p>\n<h2>🚀 挑战<\/h2>\n<p>尝试使用词袋模型和不同的数据模型完成一些其他练习。你可以参考这个 <a href=\"https://www.kaggle.com/competitions/word2vec-nlp-tutorial/overview/part-1-for-beginners-bag-of-words\">Kaggle 比赛<\/a> 来获得灵感。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/26\">课后测验<\/a><\/h2>\n<h2>复习与自学<\/h2>\n<p>在 <a href=\"https://docs.microsoft.com/learn/modules/intro-natural-language-processing-pytorch/?WT.mc_id=academic-77998-cacaste\">Microsoft Learn<\/a> 上练习你的文本嵌入和词袋模型技术。<\/p>\n<h2><a href=\"#/doc/lessons/5-NLP/13-TextRep/assignment.md\">作业：笔记本<\/a><\/h2>\n<hr />"},"lessons/5-NLP/13-TextRep/assignment.md":{"t":"将文本表示为张量 · 作业","h":"<h1>作业：笔记本<\/h1>\n<p>使用与本课程相关的笔记本（可以选择 PyTorch 或 TensorFlow 版本），使用您自己的数据集重新运行它们，例如从 Kaggle 获取并注明出处。重写笔记本以突出您自己的发现。尝试一些可能令人惊讶的创新数据集，例如 <a href=\"https://www.kaggle.com/datasets/NUFORC/ufo-sightings\">这个关于 UFO 目击事件的数据集<\/a> 来自 NUFORC。<\/p>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原始语言的文档作为权威来源。对于关键信息，建议使用专业人工翻译。我们对于因使用此翻译而引起的任何误解或误读不承担责任。<\/p>"},"lessons/5-NLP/14-Embeddings/README.md":{"t":"嵌入","h":"<h1>嵌入<\/h1>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/27\">课前测验<\/a><\/h2>\n<p>在基于 BoW 或 TF/IDF 训练分类器时，我们使用的是长度为 <code>vocab_size<\/code> 的高维词袋向量，并且我们显式地将低维位置表示向量转换为稀疏的独热表示。然而，这种独热表示并不节省内存。此外，每个单词都被独立对待，即独热编码的向量无法表达单词之间的语义相似性。<\/p>\n<p><strong>嵌入<\/strong>的想法是用低维密集向量来表示单词，这些向量能够以某种方式反映单词的语义含义。稍后我们会讨论如何构建有意义的词嵌入，但现在我们只需将嵌入理解为一种降低单词向量维度的方法。<\/p>\n<p>嵌入层会将一个单词作为输入，并生成指定 <code>embedding_size<\/code> 的输出向量。从某种意义上说，它与 <code>Linear<\/code> 层非常相似，但它不需要独热编码向量，而是可以直接接受单词编号作为输入，从而避免创建大型独热编码向量。<\/p>\n<p>通过在分类器网络中使用嵌入层作为第一层，我们可以从词袋模型切换到 <strong>嵌入袋<\/strong> 模型。在嵌入袋模型中，我们首先将文本中的每个单词转换为对应的嵌入，然后对所有这些嵌入计算某种聚合函数，例如 <code>sum<\/code>、<code>average<\/code> 或 <code>max<\/code>。<\/p>\n<p><img alt=\"展示五个序列单词的嵌入分类器的图片。\" src=\"../translated_images/zh-CN/embedding-classifier-example.b77f021a7ee67eee.webp\" /><\/p>\n<blockquote>\n<p>图片由作者提供<\/p>\n<\/blockquote>\n<h2>✍️ 练习：嵌入<\/h2>\n<p>通过以下笔记本继续学习：\n* <a href=\"../translations/zh-CN/lessons/5-NLP/14-Embeddings/EmbeddingsPyTorch.ipynb\">使用 PyTorch 的嵌入<\/a>\n* <a href=\"../translations/zh-CN/lessons/5-NLP/14-Embeddings/EmbeddingsTF.ipynb\">使用 TensorFlow 的嵌入<\/a><\/p>\n<h2>语义嵌入：Word2Vec<\/h2>\n<p>虽然嵌入层可以学习将单词映射到向量表示，但这种表示不一定具有很强的语义意义。如果我们能学习一种向量表示，使得相似单词或同义词在某种向量距离（例如欧几里得距离）上彼此接近，那就更好了。<\/p>\n<p>为此，我们需要以特定方式在大量文本上预训练嵌入模型。一种训练语义嵌入的方法叫做 <a href=\"https://en.wikipedia.org/wiki/Word2vec\">Word2Vec<\/a>。它基于两种主要架构来生成单词的分布式表示：<\/p>\n<ul>\n<li><strong>连续词袋<\/strong> (CBoW) —— 在这种架构中，我们训练模型根据上下文预测单词。给定 ngram $(W_{-2},W_{-1},W_0,W_1,W_2)$，模型的目标是根据 $(W_{-2},W_{-1},W_1,W_2)$ 预测 $W_0$。<\/li>\n<li><strong>连续跳词模型<\/strong> (Skip-Gram) —— 与 CBoW 相反，模型使用上下文窗口中的单词来预测当前单词。<\/li>\n<\/ul>\n<p>CBoW 速度更快，而 Skip-Gram 虽然较慢，但在表示不常见单词方面表现更好。<\/p>\n<p><img alt=\"展示 CBoW 和 Skip-Gram 算法将单词转换为向量的图片。\" src=\"../translated_images/zh-CN/example-algorithms-for-converting-words-to-vectors.fbe9207a726922f6.webp\" /><\/p>\n<blockquote>\n<p>图片来源于 <a href=\"https://arxiv.org/pdf/1301.3781.pdf\">这篇论文<\/a><\/p>\n<\/blockquote>\n<p>Word2Vec 预训练嵌入（以及其他类似模型，例如 GloVe）也可以替代神经网络中的嵌入层使用。然而，我们需要处理词汇表问题，因为用于预训练 Word2Vec/GloVe 的词汇表可能与我们文本语料库中的词汇表不同。查看上述笔记本，了解如何解决这个问题。<\/p>\n<h2>上下文嵌入<\/h2>\n<p>传统的预训练嵌入表示（如 Word2Vec）的一个主要限制是词义消歧问题。虽然预训练嵌入可以捕捉单词在上下文中的部分含义，但每个单词的所有可能含义都被编码到同一个嵌入中。这可能会在下游模型中引发问题，因为许多单词（例如“play”）的含义会根据使用的上下文而有所不同。<\/p>\n<p>例如，“play”在以下两个句子中的含义完全不同：<\/p>\n<ul>\n<li>我去剧院看了一场<strong>戏剧<\/strong>。<\/li>\n<li>约翰想和朋友们<strong>玩耍<\/strong>。<\/li>\n<\/ul>\n<p>上述预训练嵌入将“play”的这两种含义表示为同一个嵌入。为了克服这一限制，我们需要基于<strong>语言模型<\/strong>构建嵌入，该模型在大量文本语料库上进行训练，并且<em>了解<\/em>单词在不同上下文中的组合方式。讨论上下文嵌入超出了本教程的范围，但我们将在课程后续讨论语言模型时回到这个话题。<\/p>\n<h2>总结<\/h2>\n<p>在本课中，你学习了如何在 TensorFlow 和 PyTorch 中构建和使用嵌入层，以更好地反映单词的语义含义。<\/p>\n<h2>🚀 挑战<\/h2>\n<p>Word2Vec 已被用于一些有趣的应用，包括生成歌词和诗歌。看看<a href=\"https://www.politetype.com/blog/word2vec-color-poems\">这篇文章<\/a>，作者在其中介绍了如何使用 Word2Vec 生成诗歌。还可以观看<a href=\"https://www.youtube.com/watch?v=LSS_bos_TPI&amp;ab_channel=TheCodingTrain\">Dan Shiffmann 的这个视频<\/a>，了解该技术的另一种解释。然后尝试将这些技术应用到你自己的文本语料库中，可以从 Kaggle 获取数据。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/28\">课后测验<\/a><\/h2>\n<h2>复习与自学<\/h2>\n<p>阅读这篇关于 Word2Vec 的论文：<a href=\"https://arxiv.org/pdf/1301.3781.pdf\">Efficient Estimation of Word Representations in Vector Space<\/a><\/p>\n<h2><a href=\"#/doc/lessons/5-NLP/14-Embeddings/assignment.md\">作业：笔记本<\/a><\/h2>\n<hr />"},"lessons/5-NLP/14-Embeddings/assignment.md":{"t":"嵌入 · 作业","h":"<h1>作业：笔记本<\/h1>\n<p>使用与本课程相关的笔记本（可以是 PyTorch 或 TensorFlow 版本），使用您自己的数据集重新运行它们，例如来自 Kaggle 的数据集，并注明出处。重写笔记本以突出您自己的发现。尝试使用不同类型的数据集并记录您的发现，例如使用<a href=\"https://www.kaggle.com/datasets/jenlooper/beatles-lyrics\">这些 Beatles 歌词<\/a>中的文本。<\/p>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原始语言的文档作为权威来源。对于关键信息，建议使用专业人工翻译。因使用本翻译而引起的任何误解或误读，我们概不负责。<\/p>"},"lessons/5-NLP/15-LanguageModeling/README.md":{"t":"语言建模","h":"<h1>语言建模<\/h1>\n<p>语义嵌入（如 Word2Vec 和 GloVe）实际上是迈向<strong>语言建模<\/strong>的第一步——创建某种能够<em>理解<\/em>（或<em>表示<\/em>）语言本质的模型。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/29\">课前测验<\/a><\/h2>\n<p>语言建模的核心思想是通过无监督方式在未标注的数据集上进行训练。这非常重要，因为我们拥有大量未标注的文本，而标注文本的数量总是受到标注工作量的限制。通常，我们可以构建能够<strong>预测文本中缺失单词<\/strong>的语言模型，因为在文本中随机遮盖一个单词并将其作为训练样本是非常容易的。<\/p>\n<h2>嵌入训练<\/h2>\n<p>在之前的例子中，我们使用了预训练的语义嵌入，但了解这些嵌入是如何训练的也很有趣。有几种可能的思路可以用来训练嵌入：<\/p>\n<ul>\n<li><strong>N-Gram<\/strong>语言建模，通过查看前 N 个标记（N-gram）来预测一个标记。<\/li>\n<li><strong>连续词袋模型<\/strong> (CBoW)，通过预测标记序列 $W_{-N}$, ..., $W_N$ 中的中间标记 $W_0$。<\/li>\n<li><strong>Skip-gram<\/strong>，通过中间标记 $W_0$ 来预测一组邻近标记 {$W_{-N},\\dots, W_{-1}, W_1,\\dots, W_N$}。<\/li>\n<\/ul>\n<p><img alt=\"论文中关于将单词转换为向量的算法示例\" src=\"../translated_images/zh-CN/example-algorithms-for-converting-words-to-vectors.fbe9207a726922f6.webp\" /><\/p>\n<blockquote>\n<p>图片来源于<a href=\"https://arxiv.org/pdf/1301.3781.pdf\">这篇论文<\/a><\/p>\n<\/blockquote>\n<h2>✍️ 示例笔记本：训练 CBoW 模型<\/h2>\n<p>通过以下笔记本继续学习：<\/p>\n<ul>\n<li><a href=\"../translations/zh-CN/lessons/5-NLP/15-LanguageModeling/CBoW-TF.ipynb\">使用 TensorFlow 训练 CBoW Word2Vec<\/a><\/li>\n<li><a href=\"../translations/zh-CN/lessons/5-NLP/15-LanguageModeling/CBoW-PyTorch.ipynb\">使用 PyTorch 训练 CBoW Word2Vec<\/a><\/li>\n<\/ul>\n<h2>总结<\/h2>\n<p>在上一节课中，我们看到单词嵌入的效果非常神奇！现在我们知道训练单词嵌入并不是一项非常复杂的任务，如果需要，我们应该能够为特定领域的文本训练自己的单词嵌入。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/30\">课后测验<\/a><\/h2>\n<h2>复习与自学<\/h2>\n<ul>\n<li><a href=\"https://pytorch.org/tutorials/beginner/nlp/word_embeddings_tutorial.html\">PyTorch 官方语言建模教程<\/a>。<\/li>\n<li><a href=\"https://www.TensorFlow.org/tutorials/text/word2vec\">TensorFlow 官方 Word2Vec 模型训练教程<\/a>。<\/li>\n<li>使用 <strong>gensim<\/strong> 框架训练最常用嵌入的简便方法详见<a href=\"https://pytorch.org/tutorials/beginner/nlp/word_embeddings_tutorial.html\">此文档<\/a>。<\/li>\n<\/ul>\n<h2>🚀 <a href=\"#/doc/lessons/5-NLP/15-LanguageModeling/lab/README.md\">作业：训练 Skip-Gram 模型<\/a><\/h2>\n<p>在实验中，我们挑战你修改本课的代码以训练 Skip-Gram 模型而不是 CBoW。<a href=\"#/doc/lessons/5-NLP/15-LanguageModeling/lab/README.md\">阅读详情<\/a><\/p>\n<hr />"},"lessons/5-NLP/15-LanguageModeling/lab/README.md":{"t":"语言建模 · 实验","h":"<h1>训练 Skip-Gram 模型<\/h1>\n<p>来自 <a href=\"https://github.com/microsoft/ai-for-beginners\">AI for Beginners Curriculum<\/a> 的实验任务。<\/p>\n<h2>任务<\/h2>\n<p>在本实验中，我们挑战你使用 Skip-Gram 技术训练 Word2Vec 模型。训练一个嵌入网络来预测 $N$ 个词宽的 Skip-Gram 窗口中的邻近词。你可以使用<a href=\"https://raw.githubusercontent.com/songbing1521/AI-For-Beginners-zh-CN/main/lessons/5-NLP/15-LanguageModeling/CBoW-TF.ipynb\">本课中的代码<\/a>，并稍作修改。<\/p>\n<h2>数据集<\/h2>\n<p>你可以使用任何书籍。你可以在 <a href=\"https://www.gutenberg.org/\">Project Gutenberg<\/a> 找到许多免费文本，例如，这里有一个直接链接到刘易斯·卡罗尔的《爱丽丝梦游仙境》：<a href=\"https://www.gutenberg.org/files/11/11-0.txt\">Alice's Adventures in Wonderland<\/a>。或者，你可以使用莎士比亚的戏剧，以下代码可以获取：<\/p>\n<pre><code class=\"language-python\">path_to_file = tf.keras.utils.get_file(\n   'shakespeare.txt', \n   'https://storage.googleapis.com/download.tensorflow.org/data/shakespeare.txt')\ntext = open(path_to_file, 'rb').read().decode(encoding='utf-8')\n<\/code><\/pre>\n<h2>探索！<\/h2>\n<p>如果你有时间并希望深入研究这个主题，可以尝试探索以下内容：<\/p>\n<ul>\n<li>嵌入大小如何影响结果？<\/li>\n<li>不同的文本风格如何影响结果？<\/li>\n<li>选择几组非常不同类型的单词及其同义词，获取它们的向量表示，应用 PCA 将维度降到 2，并在二维空间中绘制它们。你能发现任何模式吗？<\/li>\n<\/ul>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原文档的原始语言版本为权威来源。对于关键信息，建议使用专业人工翻译。我们对因使用此翻译而引起的任何误解或误读不承担责任。<\/p>"},"lessons/5-NLP/16-RNN/README.md":{"t":"循环神经网络","h":"<h1>循环神经网络<\/h1>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/31\">课前测验<\/a><\/h2>\n<p>在之前的章节中，我们使用了丰富的文本语义表示，并在嵌入层之上使用了一个简单的线性分类器。这种架构能够捕捉句子中词语的整体意义，但它没有考虑到词语的<strong>顺序<\/strong>，因为嵌入层上的聚合操作会丢失原始文本中的顺序信息。由于这些模型无法建模词语的顺序，它们无法解决更复杂或更模糊的任务，例如文本生成或问答。<\/p>\n<p>为了捕捉文本序列的意义，我们需要使用另一种神经网络架构，称为<strong>循环神经网络<\/strong>（Recurrent Neural Network，RNN）。在 RNN 中，我们将句子逐个符号输入网络，网络会生成某种<strong>状态<\/strong>，然后将该状态与下一个符号一起再次输入网络。<\/p>\n<p><img alt=\"RNN\" src=\"../translated_images/zh-CN/rnn.27f5c29c53d727b5.webp\" /><\/p>\n<blockquote>\n<p>图片由作者提供<\/p>\n<\/blockquote>\n<p>给定输入序列的标记 X<sub>0<\/sub>,...,X<sub>n<\/sub>，RNN 会创建一个神经网络块的序列，并通过反向传播对该序列进行端到端训练。每个网络块以 (X<sub>i<\/sub>,S<sub>i<\/sub>) 为输入，并生成 S<sub>i+1<\/sub> 作为结果。最终状态 S<sub>n<\/sub> 或 (输出 Y<sub>n<\/sub>) 会进入线性分类器以生成结果。所有网络块共享相同的权重，并通过一次反向传播训练端到端。<\/p>\n<p>由于状态向量 S<sub>0<\/sub>,...,S<sub>n<\/sub> 会通过网络传递，RNN 能够学习词语之间的顺序依赖关系。例如，当单词 <em>not<\/em> 出现在序列中的某处时，它可以学习在状态向量中否定某些元素，从而实现否定。<\/p>\n<blockquote>\n<p>✅ 由于上图中所有 RNN 块的权重是共享的，因此可以将整个图表示为一个带有循环反馈的单块（右侧），将网络的输出状态反馈到输入。<\/p>\n<\/blockquote>\n<h2>RNN 单元的结构<\/h2>\n<p>让我们看看一个简单的 RNN 单元是如何组织的。它接受前一个状态 S<sub>i-1<\/sub> 和当前符号 X<sub>i<\/sub> 作为输入，并生成输出状态 S<sub>i<\/sub>（有时我们也对其他输出 Y<sub>i<\/sub> 感兴趣，例如在生成网络中）。<\/p>\n<p>一个简单的 RNN 单元内部有两个权重矩阵：一个用于转换输入符号（我们称之为 W），另一个用于转换输入状态（H）。在这种情况下，网络的输出计算公式为 &sigma;(W&times;X<sub>i<\/sub>+H&times;S<sub>i-1<\/sub>+b)，其中 &sigma; 是激活函数，b 是额外的偏置。<\/p>\n<p><img alt=\"RNN 单元结构\" src=\"../translated_images/zh-CN/rnn-anatomy.79ee3f3920b3294b.webp\" width=\"50%\"/><\/p>\n<blockquote>\n<p>图片由作者提供<\/p>\n<\/blockquote>\n<p>在许多情况下，输入标记会在进入 RNN 之前通过嵌入层以降低维度。在这种情况下，如果输入向量的维度为 <em>emb_size<\/em>，状态向量的维度为 <em>hid_size<\/em>，那么 W 的大小为 <em>emb_size<\/em>&times;<em>hid_size<\/em>，H 的大小为 <em>hid_size<\/em>&times;<em>hid_size<\/em>。<\/p>\n<h2>长短时记忆网络（LSTM）<\/h2>\n<p>经典 RNN 的主要问题之一是所谓的<strong>梯度消失<\/strong>问题。由于 RNN 是通过一次反向传播端到端训练的，它很难将误差传播到网络的第一层，因此无法学习远距离标记之间的关系。解决这一问题的一种方法是通过使用所谓的<strong>门控机制<\/strong>引入<strong>显式状态管理<\/strong>。有两种著名的架构：<strong>长短时记忆网络<\/strong>（Long Short Term Memory，LSTM）和<strong>门控循环单元<\/strong>（Gated Relay Unit，GRU）。<\/p>\n<p><img alt=\"显示长短时记忆单元示例的图片\" src=\"https://raw.githubusercontent.com/songbing1521/AI-For-Beginners-zh-CN/main/lessons/5-NLP/16-RNN/images/long-short-term-memory-cell.svg\" /><\/p>\n<blockquote>\n<p>图片来源待定<\/p>\n<\/blockquote>\n<p>LSTM 网络的组织方式与 RNN 类似，但有两个状态会从层到层传递：实际状态 C 和隐藏向量 H。在每个单元中，隐藏向量 H<sub>i<\/sub> 与输入 X<sub>i<\/sub> 连接在一起，它们通过<strong>门控机制<\/strong>控制状态 C 的变化。每个门控机制都是一个带有 sigmoid 激活（输出范围为 [0,1]）的神经网络，可以通过与状态向量相乘来视为逐位掩码。以下是这些门控机制（从左到右）：<\/p>\n<ul>\n<li><strong>遗忘门<\/strong>：接收隐藏向量并决定状态向量 C 的哪些部分需要遗忘，哪些需要保留。<\/li>\n<li><strong>输入门<\/strong>：从输入和隐藏向量中提取信息并插入状态。<\/li>\n<li><strong>输出门<\/strong>：通过带有 <em>tanh<\/em> 激活的线性层转换状态，然后使用隐藏向量 H<sub>i<\/sub> 选择状态的某些部分以生成新状态 C<sub>i+1<\/sub>。<\/li>\n<\/ul>\n<p>状态 C 的各个组成部分可以被视为一些可以打开或关闭的标志。例如，当我们在序列中遇到名字 <em>Alice<\/em> 时，我们可能会假设它指代一个女性角色，并在状态中设置一个标志，表示句子中有一个女性名词。当我们进一步遇到短语 <em>and Tom<\/em> 时，我们会设置一个标志，表示句子中有复数名词。因此，通过操控状态，我们可以跟踪句子部分的语法属性。<\/p>\n<blockquote>\n<p>✅ 理解 LSTM 内部机制的一个优秀资源是 Christopher Olah 的这篇文章 <a href=\"https://colah.github.io/posts/2015-08-Understanding-LSTMs/\">Understanding LSTM Networks<\/a>。<\/p>\n<\/blockquote>\n<h2>双向和多层 RNN<\/h2>\n<p>我们已经讨论了单向运行的循环网络，从序列的开头到结尾。这看起来很自然，因为它类似于我们阅读和听语音的方式。然而，由于在许多实际情况下我们可以随机访问输入序列，因此同时进行双向循环计算可能更有意义。这种网络称为<strong>双向 RNN<\/strong>。在处理双向网络时，我们需要两个隐藏状态向量，每个方向一个。<\/p>\n<p>循环网络，无论是单向还是双向，都能捕捉序列中的某些模式，并将其存储到状态向量中或传递到输出中。与卷积网络类似，我们可以在第一层之上构建另一层循环网络，以捕捉更高级的模式，并从第一层提取的低级模式中构建。这引出了<strong>多层 RNN<\/strong> 的概念，它由两个或更多循环网络组成，其中前一层的输出作为输入传递到下一层。<\/p>\n<p><img alt=\"显示多层长短时记忆 RNN 的图片\" src=\"../translated_images/zh-CN/multi-layer-lstm.dd975e29bb2a59fe.webp\" /><\/p>\n<p><em>图片来自 Fernando López 的<a href=\"https://towardsdatascience.com/from-a-lstm-cell-to-a-multilayer-lstm-network-with-pytorch-2899eb5696f3\">这篇精彩文章<\/a><\/em><\/p>\n<h2>✍️ 练习：嵌入<\/h2>\n<p>通过以下笔记本继续学习：<\/p>\n<ul>\n<li><a href=\"../translations/zh-CN/lessons/5-NLP/16-RNN/RNNPyTorch.ipynb\">使用 PyTorch 的 RNN<\/a><\/li>\n<li><a href=\"../translations/zh-CN/lessons/5-NLP/16-RNN/RNNTF.ipynb\">使用 TensorFlow 的 RNN<\/a><\/li>\n<\/ul>\n<h2>总结<\/h2>\n<p>在本单元中，我们了解到 RNN 可用于序列分类，但实际上它们可以处理更多任务，例如文本生成、机器翻译等。我们将在下一单元中讨论这些任务。<\/p>\n<h2>🚀 挑战<\/h2>\n<p>阅读一些关于 LSTM 的文献并思考它们的应用：<\/p>\n<ul>\n<li><a href=\"https://arxiv.org/pdf/1507.01526v1.pdf\">网格长短时记忆<\/a><\/li>\n<li><a href=\"https://arxiv.org/pdf/1502.03044v2.pdf\">展示、关注和讲述：带视觉注意力的神经图像字幕生成<\/a><\/li>\n<\/ul>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/32\">课后测验<\/a><\/h2>\n<h2>复习与自学<\/h2>\n<ul>\n<li>Christopher Olah 的 <a href=\"https://colah.github.io/posts/2015-08-Understanding-LSTMs/\">Understanding LSTM Networks<\/a>。<\/li>\n<\/ul>\n<h2><a href=\"#/doc/lessons/5-NLP/16-RNN/assignment.md\">作业：笔记本<\/a><\/h2>\n<hr />"},"lessons/5-NLP/16-RNN/assignment.md":{"t":"循环神经网络 · 作业","h":"<h1>作业：笔记本<\/h1>\n<p>使用与本课程相关的笔记本（可以是 PyTorch 或 TensorFlow 版本），使用您自己的数据集重新运行它们，例如来自 Kaggle 的数据集，并注明出处。重写笔记本以突出您自己的发现。尝试使用不同类型的数据集并记录您的发现，例如使用类似 <a href=\"https://www.kaggle.com/competitions/crowdflower-weather-twitter/data?select=train.csv\">这个关于天气推文的 Kaggle 比赛数据集<\/a> 的文本。<\/p>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原文档的原始语言版本为权威来源。对于关键信息，建议使用专业人工翻译。因使用本翻译而引起的任何误解或误读，我们概不负责。<\/p>"},"lessons/5-NLP/17-GenerativeNetworks/README.md":{"t":"生成网络","h":"<h1>生成网络<\/h1>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/33\">课前测验<\/a><\/h2>\n<p>循环神经网络（RNN）及其门控单元变体（如长短时记忆单元 LSTM 和门控循环单元 GRU）提供了一种语言建模机制，它们可以学习单词的顺序并预测序列中的下一个单词。这使得我们可以使用 RNN 执行<strong>生成任务<\/strong>，例如普通文本生成、机器翻译，甚至图像描述。<\/p>\n<blockquote>\n<p>✅ 想想你在输入时受益于文本补全等生成任务的所有场景。研究一下你喜欢的应用程序，看看它们是否使用了 RNN。<\/p>\n<\/blockquote>\n<p>在我们上一单元讨论的 RNN 架构中，每个 RNN 单元会生成下一个隐藏状态作为输出。然而，我们也可以为每个循环单元添加另一个输出，这样就可以输出一个<strong>序列<\/strong>（与原始序列长度相等）。此外，我们可以使用不在每一步接受输入的 RNN 单元，只接受一些初始状态向量，然后生成一系列输出。<\/p>\n<p>这使得可以构建不同的神经网络架构，如下图所示：<\/p>\n<p><img alt=\"展示常见循环神经网络模式的图片。\" src=\"../translated_images/zh-CN/unreasonable-effectiveness-of-rnn.541ead816778f42d.webp\" /><\/p>\n<blockquote>\n<p>图片来源于 <a href=\"http://karpathy.github.io/\">Andrej Karpaty<\/a> 的博客文章 <a href=\"http://karpathy.github.io/2015/05/21/rnn-effectiveness/\">循环神经网络的非凡有效性<\/a><\/p>\n<\/blockquote>\n<ul>\n<li><strong>一对一<\/strong>是传统的神经网络，具有一个输入和一个输出<\/li>\n<li><strong>一对多<\/strong>是一种生成架构，接受一个输入值并生成一系列输出值。例如，如果我们想训练一个<strong>图像描述<\/strong>网络来生成图片的文本描述，可以将图片作为输入，通过 CNN 获得其隐藏状态，然后通过循环链逐字生成描述<\/li>\n<li><strong>多对一<\/strong>对应于我们在上一单元中描述的 RNN 架构，例如文本分类<\/li>\n<li><strong>多对多<\/strong>或<strong>序列到序列<\/strong>对应于任务如<strong>机器翻译<\/strong>，其中第一个 RNN 收集输入序列中的所有信息到隐藏状态，另一个 RNN 链将该状态展开为输出序列。<\/li>\n<\/ul>\n<p>在本单元中，我们将重点关注帮助生成文本的简单生成模型。为了简化，我们将使用字符级标记化。<\/p>\n<p>我们将训练这个 RNN 逐步生成文本。在每一步中，我们将取长度为 <code>nchars<\/code> 的字符序列，并要求网络为每个输入字符生成下一个输出字符：<\/p>\n<p><img alt=\"展示 RNN 生成单词 'HELLO' 的示例图片。\" src=\"../translated_images/zh-CN/rnn-generate.56c54afb52f9781d.webp\" /><\/p>\n<p>在生成文本（推理阶段）时，我们从某个<strong>提示<\/strong>开始，将其传递给 RNN 单元以生成中间状态，然后从该状态开始生成。我们一次生成一个字符，并将状态和生成的字符传递给另一个 RNN 单元以生成下一个字符，直到生成足够的字符。<\/p>\n<p><img src=\"../translated_images/zh-CN/rnn-generate-inf.5168dc65e0370eea.webp\" width=\"60%\"/><\/p>\n<blockquote>\n<p>图片由作者提供<\/p>\n<\/blockquote>\n<h2>✍️ 练习：生成网络<\/h2>\n<p>通过以下笔记本继续学习：<\/p>\n<ul>\n<li><a href=\"../translations/zh-CN/lessons/5-NLP/17-GenerativeNetworks/GenerativePyTorch.ipynb\">使用 PyTorch 的生成网络<\/a><\/li>\n<li><a href=\"../translations/zh-CN/lessons/5-NLP/17-GenerativeNetworks/GenerativeTF.ipynb\">使用 TensorFlow 的生成网络<\/a><\/li>\n<\/ul>\n<h2>软文本生成与温度<\/h2>\n<p>每个 RNN 单元的输出是一个字符的概率分布。如果我们总是选择概率最高的字符作为生成文本的下一个字符，文本可能会出现“循环”现象，重复相同的字符序列，如以下示例：<\/p>\n<pre><code>today of the second the company and a second the company ...\n<\/code><\/pre>\n<p>然而，如果我们查看下一个字符的概率分布，可能会发现几个最高概率之间的差异并不大，例如一个字符的概率为 0.2，另一个为 0.19 等。例如，在寻找序列 '<em>play<\/em>' 的下一个字符时，下一个字符可能是空格，也可能是 <strong>e<\/strong>（如单词 <em>player<\/em>）。<\/p>\n<p>这让我们得出结论：选择概率最高的字符并不总是“公平”的，因为选择第二高的字符仍可能生成有意义的文本。更明智的做法是从网络输出的概率分布中<strong>采样<\/strong>字符。我们还可以使用一个参数 <strong>温度<\/strong>，来平滑概率分布，以增加随机性，或者使分布更陡峭，以更倾向于选择最高概率的字符。<\/p>\n<p>在上述链接的笔记本中探索软文本生成的实现方式。<\/p>\n<h2>总结<\/h2>\n<p>虽然文本生成本身可能很有用，但其主要优势在于能够从某些初始特征向量使用 RNN 生成文本。例如，文本生成可以作为机器翻译的一部分（序列到序列，在这种情况下，来自<em>编码器<\/em>的状态向量用于生成或<em>解码<\/em>翻译后的消息），或者生成图像的文本描述（在这种情况下，特征向量来自 CNN 提取器）。<\/p>\n<h2>🚀 挑战<\/h2>\n<p>在 Microsoft Learn 上学习相关课程：<\/p>\n<ul>\n<li>使用 <a href=\"https://docs.microsoft.com/learn/modules/intro-natural-language-processing-pytorch/6-generative-networks/?WT.mc_id=academic-77998-cacaste\">PyTorch<\/a>/<a href=\"https://docs.microsoft.com/learn/modules/intro-natural-language-processing-tensorflow/5-generative-networks/?WT.mc_id=academic-77998-cacaste\">TensorFlow<\/a> 进行文本生成<\/li>\n<\/ul>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/34\">课后测验<\/a><\/h2>\n<h2>复习与自学<\/h2>\n<p>以下文章可以扩展你的知识：<\/p>\n<ul>\n<li>使用马尔可夫链、LSTM 和 GPT-2 进行文本生成的不同方法：<a href=\"https://towardsdatascience.com/text-generation-gpt-2-lstm-markov-chain-9ea371820e1e\">博客文章<\/a><\/li>\n<li><a href=\"https://keras.io/examples/generative/lstm_character_level_text_generation/\">Keras 文档<\/a>中的文本生成示例<\/li>\n<\/ul>\n<h2><a href=\"#/doc/lessons/5-NLP/17-GenerativeNetworks/lab/README.md\">作业<\/a><\/h2>\n<p>我们已经了解了如何逐字符生成文本。在实验中，你将探索逐词生成文本。<\/p>\n<hr />"},"lessons/5-NLP/17-GenerativeNetworks/lab/README.md":{"t":"生成网络 · 实验","h":"<h1>使用 RNN 进行词级文本生成<\/h1>\n<p>来自 <a href=\"https://github.com/microsoft/ai-for-beginners\">AI 初学者课程<\/a> 的实验任务。<\/p>\n<h2>任务<\/h2>\n<p>在本实验中，你需要选择任意一本书，并将其用作数据集来训练一个词级文本生成器。<\/p>\n<h2>数据集<\/h2>\n<p>你可以使用任何书籍作为数据集。你可以在 <a href=\"https://www.gutenberg.org/\">Project Gutenberg<\/a> 找到许多免费的文本，例如，这里是 Lewis Carroll 的 <a href=\"https://www.gutenberg.org/files/11/11-0.txt\">爱丽丝梦游仙境<\/a> 的直接链接。<\/p>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。原始语言的文档应被视为权威来源。对于关键信息，建议使用专业人工翻译。我们不对因使用此翻译而产生的任何误解或误读承担责任。<\/p>"},"lessons/5-NLP/18-Transformers/README.md":{"t":"注意机制与Transformer","h":"<h1>注意机制与Transformer<\/h1>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/35\">课前测验<\/a><\/h2>\n<p>在自然语言处理领域中，<strong>机器翻译<\/strong>是一个非常重要的问题，它是像谷歌翻译这样的工具的核心任务。在本节中，我们将重点讨论机器翻译，或者更广泛地说，任何<em>序列到序列<\/em>任务（也称为<strong>句子转换<\/strong>）。<\/p>\n<p>使用RNN时，序列到序列任务通过两个循环网络实现，其中一个网络，即<strong>编码器<\/strong>，将输入序列压缩为一个隐藏状态，而另一个网络，即<strong>解码器<\/strong>，将隐藏状态展开为翻译结果。这种方法存在一些问题：<\/p>\n<ul>\n<li>编码器网络的最终状态难以记住句子的开头，从而导致模型在处理长句子时质量较差。<\/li>\n<li>序列中的所有词对结果的影响相同。然而在实际中，输入序列中的某些词对输出序列的影响往往比其他词更大。<\/li>\n<\/ul>\n<p><strong>注意机制<\/strong>提供了一种方法，可以对每个输入向量对RNN输出预测的上下文影响进行加权。其实现方式是创建输入RNN的中间状态与输出RNN之间的快捷路径。这样，在生成输出符号y<sub>t<\/sub>时，我们会考虑所有输入隐藏状态h<sub>i<\/sub>，并赋予不同的权重系数&alpha;<sub>t,i<\/sub>。<\/p>\n<p><img alt=\"显示带有加性注意层的编码器/解码器模型的图像\" src=\"../translated_images/zh-CN/encoder-decoder-attention.7a726296894fb567.webp\" /><\/p>\n<blockquote>\n<p><a href=\"https://arxiv.org/pdf/1409.0473.pdf\">Bahdanau等人，2015<\/a>中的加性注意机制编码器-解码器模型，图片来源于<a href=\"https://lilianweng.github.io/lil-log/2018/06/24/attention-attention.html\">这篇博客<\/a><\/p>\n<\/blockquote>\n<p>注意矩阵{&alpha;<sub>i,j<\/sub>}表示某些输入词在生成输出序列中某个词时的影响程度。下面是一个这样的矩阵示例：<\/p>\n<p><img alt=\"显示由RNNsearch-50找到的样本对齐的图像，取自Bahdanau - arviz.org\" src=\"../translated_images/zh-CN/bahdanau-fig3.09ba2d37f202a6af.webp\" /><\/p>\n<blockquote>\n<p>图片来自<a href=\"https://arxiv.org/pdf/1409.0473.pdf\">Bahdanau等人，2015<\/a>（图3）<\/p>\n<\/blockquote>\n<p>注意机制是当前或接近当前自然语言处理领域的最先进技术的关键所在。然而，添加注意机制会显著增加模型参数的数量，从而导致RNN的扩展问题。RNN扩展的一个关键限制是模型的循环性质使得训练难以批量化和并行化。在RNN中，序列的每个元素都需要按顺序处理，这意味着它无法轻松并行化。<\/p>\n<p><img alt=\"带有注意机制的编码器解码器\" src=\"https://raw.githubusercontent.com/songbing1521/AI-For-Beginners-zh-CN/main/lessons/5-NLP/18-Transformers/images/EncDecAttention.gif\" /><\/p>\n<blockquote>\n<p>图片来源于<a href=\"https://research.googleblog.com/2016/09/a-neural-network-for-machine.html\">谷歌博客<\/a><\/p>\n<\/blockquote>\n<p>注意机制的采用结合了这一限制，促成了如今我们所熟知和使用的最先进的Transformer模型的诞生，例如BERT和Open-GPT3。<\/p>\n<h2>Transformer模型<\/h2>\n<p>Transformer的核心思想之一是避免RNN的顺序处理特性，并创建一个在训练过程中可并行化的模型。这通过以下两个想法实现：<\/p>\n<ul>\n<li>位置编码<\/li>\n<li>使用自注意机制捕捉模式，而不是使用RNN（或CNN）（这也是为什么介绍Transformer的论文被称为<em><a href=\"https://arxiv.org/abs/1706.03762\">Attention is all you need<\/a><\/em>）<\/li>\n<\/ul>\n<h3>位置编码/嵌入<\/h3>\n<p>位置编码的思想如下：\n1. 使用RNN时，标记的相对位置由步数表示，因此不需要显式表示。\n2. 然而，一旦我们切换到注意机制，我们需要知道序列中标记的相对位置。\n3. 为了获得位置编码，我们将标记序列与序列中的标记位置序列（即数字序列0,1, ...）结合起来。\n4. 然后我们将标记位置与标记嵌入向量混合。为了将位置（整数）转换为向量，我们可以使用不同的方法：<\/p>\n<ul>\n<li>可训练嵌入，类似于标记嵌入。这是我们在这里考虑的方法。我们在标记和它们的位置上应用嵌入层，生成维度相同的嵌入向量，然后将它们相加。<\/li>\n<li>固定位置编码函数，如原始论文中提出的。<\/li>\n<\/ul>\n<p><img src=\"../translated_images/zh-CN/pos-embedding.e41ce9b6cf6078af.webp\" width=\"50%\"/><\/p>\n<blockquote>\n<p>图片由作者提供<\/p>\n<\/blockquote>\n<p>通过位置嵌入，我们可以同时嵌入原始标记及其在序列中的位置。<\/p>\n<h3>多头自注意机制<\/h3>\n<p>接下来，我们需要捕捉序列中的一些模式。为此，Transformer使用了<strong>自注意机制<\/strong>，即将注意机制同时应用于输入和输出的同一序列。应用自注意机制使我们能够考虑句子中的<strong>上下文<\/strong>，并查看哪些词是相互关联的。例如，它可以帮助我们识别代词<em>it<\/em>所指代的词，并考虑上下文：<\/p>\n<p><img alt=\"\" src=\"../translated_images/zh-CN/CoreferenceResolution.861924d6d384a7d6.webp\" /><\/p>\n<blockquote>\n<p>图片来源于<a href=\"https://research.googleblog.com/2017/08/transformer-novel-neural-network.html\">谷歌博客<\/a><\/p>\n<\/blockquote>\n<p>在Transformer中，我们使用<strong>多头注意机制<\/strong>，以赋予网络捕捉多种依赖关系的能力，例如长期与短期词关系、共指关系与其他关系等。<\/p>\n<p><a href=\"../translations/zh-CN/lessons/5-NLP/18-Transformers/TransformersTF.ipynb\">TensorFlow Notebook<\/a>中包含有关Transformer层实现的更多细节。<\/p>\n<h3>编码器-解码器注意机制<\/h3>\n<p>在Transformer中，注意机制用于两个地方：<\/p>\n<ul>\n<li>使用自注意机制捕捉输入文本中的模式<\/li>\n<li>执行序列翻译——这是编码器和解码器之间的注意层。<\/li>\n<\/ul>\n<p>编码器-解码器注意机制与RNN中使用的注意机制非常相似，如本节开头所述。以下动画图解释了编码器-解码器注意机制的作用。<\/p>\n<p><img alt=\"显示Transformer模型中评估过程的动画GIF\" src=\"https://raw.githubusercontent.com/songbing1521/AI-For-Beginners-zh-CN/main/lessons/5-NLP/18-Transformers/images/transformer-animated-explanation.gif\" /><\/p>\n<p>由于每个输入位置独立映射到每个输出位置，Transformer比RNN更容易并行化，这使得能够构建更大、更具表现力的语言模型。每个注意头可以用于学习词之间的不同关系，从而改善下游自然语言处理任务。<\/p>\n<h2>BERT<\/h2>\n<p><strong>BERT<\/strong>（Bidirectional Encoder Representations from Transformers，双向编码器表示）是一个非常大的多层Transformer网络，<em>BERT-base<\/em>有12层，<em>BERT-large<\/em>有24层。模型首先在大规模文本数据（维基百科+书籍）上进行无监督训练（预测句子中的被遮蔽词）。在预训练过程中，模型吸收了大量的语言理解能力，这些能力可以通过微调其他数据集来利用。这一过程称为<strong>迁移学习<\/strong>。<\/p>\n<p><img alt=\"图片来源于http://jalammar.github.io/illustrated-bert/\" src=\"../translated_images/zh-CN/jalammarBERT-language-modeling-masked-lm.34f113ea5fec4362.webp\" /><\/p>\n<blockquote>\n<p>图片<a href=\"http://jalammar.github.io/illustrated-bert/\">来源<\/a><\/p>\n<\/blockquote>\n<h2>✍️ 练习：Transformer<\/h2>\n<p>通过以下笔记本继续学习：<\/p>\n<ul>\n<li><a href=\"..
