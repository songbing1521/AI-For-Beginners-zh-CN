<style>
:root{--primary:#2563eb;--bg:#f7f8fa;--side:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--code:#f3f4f6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Microsoft YaHei",-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.8}
.topbar{position:fixed;top:0;left:0;right:0;height:54px;background:var(--primary);color:#fff;display:flex;align-items:center;gap:14px;padding:0 18px;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.topbar .brand{font-size:16px;font-weight:700;white-space:nowrap}
.searchbox{position:relative;flex:1;max-width:420px}
.searchbox input{width:100%;height:32px;border:none;border-radius:16px;padding:0 14px 0 34px;font-size:13px;outline:none;background:rgba(255,255,255,.92)}
.searchbox svg{position:absolute;left:11px;top:8px;width:16px;height:16px;fill:#9ca3af}
.results{position:absolute;top:40px;left:0;right:0;background:#fff;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);max-height:60vh;overflow:auto;display:none}
.results.show{display:block}
.results .r{display:block;padding:9px 14px;border-bottom:1px solid #f3f4f6;text-decoration:none;color:var(--text)}
.results .r:hover{background:#eff6ff}
.results .r .rt{font-size:13.5px;font-weight:600}
.results .r .rm{font-size:11.5px;color:var(--muted)}
.results .empty{padding:14px;color:var(--muted);font-size:13px}
.layout{display:flex;padding-top:54px;min-height:100vh}
.sidebar{width:292px;flex-shrink:0;background:var(--side);border-right:1px solid var(--border);position:sticky;top:54px;height:calc(100vh - 54px);overflow-y:auto;padding:14px 10px 40px}
.sidebar::-webkit-scrollbar{width:6px}.sidebar::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
.mod{margin-bottom:6px}
.mod>.mlabel{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.5px;padding:10px 12px 4px;text-transform:uppercase}
.mod.open>.mlabel,.mod>.mlabel:hover{color:var(--primary)}
.mod .items{display:none}
.mod.open .items{display:block}
.mod.current>.mlabel{color:var(--primary)}
.side-link{display:flex;align-items:center;gap:6px;padding:6px 12px;color:#374151;text-decoration:none;font-size:13.5px;border-radius:6px;border-left:3px solid transparent;line-height:1.4}
.side-link:hover{background:#eef2f7}
.side-link.active{background:#eff6ff;color:var(--primary);border-left-color:var(--primary);font-weight:600}
.child-link{padding-left:30px;font-size:13px;color:var(--muted)}
.content{flex:1;min-width:0;max-width:860px;margin:0 auto;padding:30px 42px 90px}
.doc-body h1{font-size:26px;margin:18px 0 16px;padding-bottom:10px;border-bottom:2px solid var(--border)}
.doc-body h2{font-size:20px;margin:34px 0 12px;padding-left:10px;border-left:4px solid var(--primary)}
.doc-body h3{font-size:16.5px;margin:26px 0 10px}
.doc-body h4{font-size:15px;margin:20px 0 8px}
.doc-body p{margin:10px 0}
.doc-body ul,.doc-body ol{margin:10px 0 10px 26px}
.doc-body li{margin:4px 0}
.doc-body img{max-width:100%;height:auto;border-radius:8px;margin:12px auto;display:block;box-shadow:0 1px 6px rgba(0,0,0,.1)}
.doc-body code{background:var(--code);padding:2px 6px;border-radius:4px;font-family:Consolas,"Courier New",monospace;font-size:13px;color:#be185d;word-break:break-word}
.doc-body pre{background:#0f172a;color:#e2e8f0;padding:16px 18px;border-radius:10px;overflow-x:auto;margin:14px 0}
.doc-body pre code{background:none;color:inherit;padding:0;font-size:13px;line-height:1.6}
.doc-body blockquote{border-left:4px solid var(--primary);background:#eff6ff;padding:8px 16px;margin:12px 0;border-radius:0 6px 6px 0;color:#374151}
.doc-body table{border-collapse:collapse;width:100%;margin:14px 0;display:block;overflow-x:auto}
.doc-body th,.doc-body td{border:1px solid var(--border);padding:8px 12px;text-align:left;font-size:14px}
.doc-body th{background:#eff6ff}
.doc-body hr{border:none;border-top:1px solid var(--border);margin:26px 0}
.doc-body a{color:var(--primary)}
.breadcrumb{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.pager{display:flex;gap:12px;margin-top:48px}
.pager a{flex:1;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 16px;text-decoration:none;color:var(--text)}
.pager a:hover{border-color:var(--primary);box-shadow:0 2px 10px rgba(37,99,235,.12)}
.pager .dir{font-size:11.5px;color:var(--muted)}
.pager .pt{font-size:14px;font-weight:600;color:var(--primary)}
.pager .next{text-align:right}
.totop{position:fixed;right:26px;bottom:26px;width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:18px;cursor:pointer;box-shadow:0 4px 14px rgba(37,99,235,.4);display:none;z-index:15}
.loading{color:var(--muted);padding:40px;text-align:center}
@media (max-width:900px){.sidebar{display:none}.content{padding:20px}}
@media print{.sidebar,.topbar,.pager,.totop{display:none}.content{max-width:100%}}
</style>

<p><a href=\"https://discord.gg/nTYy5BXMWG\"><img alt=\"Microsoft Foundry Discord\" src=\"https://dcbadge.limes.pink/api/server/nTYy5BXMWG\" /><\/a><\/p>\n<h1>人工智能初学者课程<\/h1>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\"><img alt=\"Sketchnote by @girlie_mac https://twitter.com/girlie_mac\" src=\"https://github.com/microsoft/AI-For-Beginners/raw/main/lessons/sketchnotes/ai-overview.png\" /><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">人工智能初学者 - <em>由<a href=\"https://twitter.com/girlie_mac\">@girlie_mac<\/a>手绘速记<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>通过我们的12周、24节课课程探索<strong>人工智能<\/strong>（AI）的世界！课程包括实用的课程内容、测验和实验。课程适合初学者，涵盖了TensorFlow和PyTorch等工具，以及AI伦理。<\/p>\n<h3>🌐 多语言支持<\/h3>\n<h4>通过GitHub Action支持（自动且始终保持最新）<\/h4>\n<!-- CO-OP TRANSLATOR LANGUAGES TABLE START -->\n<p><a href=\"../translations/ar/README.md\">阿拉伯语<\/a> | <a href=\"../translations/bn/README.md\">孟加拉语<\/a> | <a href=\"../translations/bg/README.md\">保加利亚语<\/a> | <a href=\"../translations/my/README.md\">缅甸语 (Myanmar)<\/a> | <a href=\"#/doc/README.md\">中文（简体）<\/a> | <a href=\"../translations/zh-HK/README.md\">中文（繁体，香港）<\/a> | <a href=\"../translations/zh-MO/README.md\">中文（繁体，澳门）<\/a> | <a href=\"../translations/zh-TW/README.md\">中文（繁体，台湾）<\/a> | <a href=\"../translations/hr/README.md\">克罗地亚语<\/a> | <a href=\"../translations/cs/README.md\">捷克语<\/a> | <a href=\"../translations/da/README.md\">丹麦语<\/a> | <a href=\"../translations/nl/README.md\">荷兰语<\/a> | <a href=\"../translations/et/README.md\">爱沙尼亚语<\/a> | <a href=\"../translations/fi/README.md\">芬兰语<\/a> | <a href=\"../translations/fr/README.md\">法语<\/a> | <a href=\"../translations/de/README.md\">德语<\/a> | <a href=\"../translations/el/README.md\">希腊语<\/a> | <a href=\"../translations/he/README.md\">希伯来语<\/a> | <a href=\"../translations/hi/README.md\">印地语<\/a> | <a href=\"../translations/hu/README.md\">匈牙利语<\/a> | <a href=\"../translations/id/README.md\">印尼语<\/a> | <a href=\"../translations/it/README.md\">意大利 \ncd AI-For-Beginners\ngit sparse-checkout set --no-cone '/*' '!translations' '!translated_images'<\/code><\/p>\n<p><strong>CMD（Windows）：<\/strong>\n<code>cmd\ngit clone --filter=blob:none --sparse https://github.com/microsoft/AI-For-Beginners.git\ncd AI-For-Beginners\ngit sparse-checkout set --no-cone \"/*\" \"!translations\" \"!translated_images\"<\/code><\/p>\n<p>这样你将获得完整课程内容，同时下载速度更快。<\/p>\n<\/blockquote>\n<!-- CO-OP TRANSLATOR LANGUAGES TABLE END -->\n\n<p><strong>如果您希望支持其他翻译语言，详情见 <a href=\"https://github.com/Azure/co-op-translator/blob/main/getting_started/supported-languages.md\">这里<\/a><\/strong><\/p>\n<h2>加入社区<\/h2>\n<p><a href=\"https://discord.gg/nTYy5BXMWG\"><img alt=\"Microsoft Foundry Discord\" src=\"https://dcbadge.limes.pink/api/server/nTYy5BXMWG\" /><\/a><\/p>\n<h2>你将学到什么<\/h2>\n<p><strong><a href=\"http://soshnikov.com/courses/ai-for-beginners/mindmap.html\">课程思维导图<\/a><\/strong><\/p>\n<p>在本课程中，你将学习：<\/p>\n<ul>\n<li>不同的人工智能方法，包括“老派”的符号方法以及<strong>知识表示<\/strong>与推理(<a href=\"https://en.wikipedia.org/wiki/Symbolic_artificial_intelligence\">GOFAI<\/a>)。<\/li>\n<li>现代AI核心的<strong>神经网络<\/strong>和<strong>深度学习<\/strong>。我们会通过代码示例讲解这些重要主题的概念，使用两种最流行的框架——<a href=\"http://Tensorflow.org\">TensorFlow<\/a>和<a href=\"http://pytorch.org\">PyTorch<\/a>。<\/li>\n<li>用于处理图像和文本的<strong>神经架构<\/strong>。我们会介绍近期的模型，但可能稍显不足于最新技术。<\/li>\n<li>较少使用的AI方法，如<strong>遗传算法<\/strong>和<strong>多智能体系统<\/strong>。<\/li>\n<\/ul>\n<p>本课程不涉及内容：<\/p>\n<blockquote>\n<p><a href=\"https://learn.microsoft.com/en-us/collections/7w28iy2xrqzdj0?WT.mc_id=academic-77998-bethanycheum\">在我们的Microsoft Learn合集里找到本课程所有额外资源<\/a><\/p>\n<\/blockquote>\n<ul>\n<li><strong>AI在商业中的应用案例<\/strong>。建议学习微软Learn上的<a href=\"https://docs.microsoft.com/learn/paths/introduction-ai-for-business-users/?WT.mc_id=academic-77998-bethanycheum\">面向商务用户的AI入门<\/a>课程或由<a href=\"https://www.insead.edu/\">INSEAD<\/a>协作开发的<a href=\"https://www.microsoft.com/ai/ai-business-school/?WT.mc_id=academic-77998-bethanycheum\">人工智能商学院<\/a>。<\/li>\n<li><strong>经典机器学习<\/strong>，在我们的<a href=\"http://github.com/Microsoft/ML-for-Beginners\">初学者机器学习课程<\/a>中有详细描述。<\/li>\n<li>基于<strong><a href=\"https://azure.microsoft.com/services/cognitive-services/?WT.mc_id=academic-77998-bethanycheum\">认知服务<\/a><\/strong>的实际AI应用。建议先从微软Learn上的<a href=\"https://docs.microsoft.com/learn/paths/create-computer-vision-solutions-azure-cognitive-services/?WT.mc_id=academic-77998-bethanycheum\">计算机视觉<\/a>、<a href=\"https://docs.microsoft.com/learn/paths/explore-natural-language-processing/?WT.mc_id=academic-77998-bethanycheum\">自然语言处理<\/a>、<strong><a href=\"https://learn.microsoft.com/en-us/training/paths/develop-ai-solutions-azure-openai/?WT.mc_id=academic-77998-bethanycheum\">Azure OpenAI 服务生成式 AI<\/a><\/strong>等模块开始学习。<\/li>\n<li>特定的机器学习<strong>云框架<\/strong>，如<a href=\"https://azure.microsoft.com/services/machine-learning/?WT.mc_id=academic-77998-bethanycheum\">Azure 机器学习<\/a>、<a href=\"https://learn.microsoft.com/en-us/training/paths/get-started-fabric/?WT.mc_id=academic-77998-bethanycheum\">Microsoft Fabric<\/a>、或<a href=\"https://docs.microsoft.com/learn/paths/data-engineer-azure-databricks?WT.mc_id=academic-77998-bethanycheum\">Azure Databricks<\/a>。推荐使用<a href=\"https://docs.microsoft.com/learn/paths/build-ai-solutions-with-azure-ml-service/?WT.mc_id=academic-77998-bethanycheum\">使用 Azure 机器学习构建和运行机器学习解决方案<\/a>和<a href=\"https://docs.microsoft.com/learn/paths/build-operate-machine-learning-solutions-azure-databricks/?WT.mc_id=academic-77998-bethanycheum\">在 Azure Databricks 上构建和运行机器学习解决方案<\/a>学习路径。<\/li>\n<li><strong>会话式AI<\/strong>和<strong>聊天机器人<\/strong>。有专门的<a href=\"https://docs.microsoft.com/learn/paths/create-conversational-ai-solutions/?WT.mc_id=academic-77998-bethanycheum\">创建会话式AI解决方案<\/a>学习路径，也可以参考<a href=\"https://soshnikov.com/azure/hello-bot-conversational-ai-on-microsoft-platform/\">此博客文章<\/a>了解详细内容。<\/li>\n<li>深度学习背后的<strong>深度数学<\/strong>。推荐阅读Ian Goodfellow、Yoshua Bengio和Aaron Courville合著的<a href=\"https://www.amazon.com/Deep-Learning-Adaptive-Computation-Machine/dp/0262035618\">Deep Learning<\/a>，在线版本请访问<a href=\"https://www.deeplearningbook.org/\">https://www.deeplearningbook.org/<\/a>。<\/li>\n<\/ul>\n<p>对于轻松入门云端的_Ai_相关话题，建议学习<a href=\"https://docs.microsoft.com/learn/paths/get-started-with-artificial-intelligence-on-azure/?WT.mc_id=academic-77998-bethanycheum\">在Azure上入门人工智能<\/a>学习路径。<\/p>\n<h1>课程内容<\/h1>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\"><\/th>\n<th style=\"text-align: center;\">课程链接<\/th>\n<th style=\"text-align: center;\">PyTorch/Keras/TensorFlow<\/th>\n<th>实验<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">0<\/td>\n<td style=\"text-align: center;\"><a href=\"#/doc/lessons/0-course-setup/setup.md\">课程环境设置<\/a><\/td>\n<td style=\"text-align: center;\"><a href=\"#/doc/lessons/0-course-setup/how-to-run.md\">搭建开发环境<\/a><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">I<\/td>\n<td style=\"text-align: center;\"><a href=\"#/doc/lessons/1-Intro/README.md\"><strong>人工智能简介<\/strong><\/a><\/td>\n<td style=\"text-align: center;\"><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">01<\/td>\n<td style=\"text-align: center;\"><a href=\"#/doc/lessons/1-Intro/README.md\">人工智能介绍与历史<\/a><\/td>\n<td style=\"text-align: center;\">-<\/td>\n<td>-<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">II<\/td>\n<td style=\"text-align: center;\"><strong>符号AI<\/strong><\/td>\n<td style=\"text-align: center;\"><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">02<\/td>\n<td style=\"text-align: center;\"><a href=\"#/doc/lessons/2-Symbolic/README.md\">知识表示与专家系统<\/a><\/td>\n<td style=\"text-align: center;\"><a href=\"../translations/zh-CN/lessons/2-Symbolic/Animals.ipynb\">专家系统<\/a> /  <a href=\"../translations/zh-CN/lessons/2-Symbolic/FamilyOntology.ipynb\">本体论<\/a> /<a href=\"../translations/zh-CN/lessons/2-Symbolic/MSConceptGraph.ipynb\">概念图谱<\/a><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td s geModeling/lab/README.md\">实验<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">16<\/td>\n<td style=\"text-align: center;\"><a href=\"#/doc/lessons/5-NLP/16-RNN/README.md\">循环神经网络<\/a><\/td>\n<td style=\"text-align: center;\"><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/5-NLP/16-RNN/RNNPyTorch.ipynb\">PyTorch<\/a> / <a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/5-NLP/16-RNN/RNNTF.ipynb\">TensorFlow<\/a><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">17<\/td>\n<td style=\"text-align: center;\"><a href=\"#/doc/lessons/5-NLP/17-GenerativeNetworks/README.md\">生成循环网络<\/a><\/td>\n<td style=\"text-align: center;\"><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/5-NLP/17-GenerativeNetworks/GenerativePyTorch.ipynb\">PyTorch<\/a> / <a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/5-NLP/17-GenerativeNetworks/GenerativeTF.ipynb\">TensorFlow<\/a><\/td>\n<td><a href=\"#/doc/lessons/5-NLP/17-GenerativeNetworks/lab/README.md\">实验<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">18<\/td>\n<td style=\"text-align: center;\"><a href=\"#/doc/lessons/5-NLP/18-Transformers/README.md\">变换器。BERT。<\/a><\/td>\n<td style=\"text-align: center;\"><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/5-NLP/18-Transformers/TransformersPyTorch.ipynb\">PyTorch<\/a> /<a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/5-NLP/18-Transformers/TransformersTF.ipynb\">TensorFlow<\/a><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">19<\/td>\n<td style=\"text-align: center;\"><a href=\"#/doc/lessons/5-NLP/19-NER/README.md\">命名实体识别<\/a><\/td>\n<td style=\"text-align: center;\"><a href=\"https://microsoft.github.io/AI-For-Beginners/lessons/5-NLP/19-NER/NER-TF.ipynb\">TensorFlow<\/a><\/td>\n<td><a href=\"#/doc/lessons/5-NLP/19-NER/lab/README.md\">实验<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">20<\/td>\n<td style=\"text-align: center;\"><a href=\"#/doc/lessons/5-NLP/20-LangModels/README.md\">大型语言模型，提示编程与少样本任务<\/a><\/td>\n<td style=\"text-align: center;\"><a href=\"https://microsoft.github.io/AI-For-Beginners/lessons/5-NLP/20-LangModels/GPT-PyTorch.ipynb\">PyTorch<\/a><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">VI<\/td>\n<td style=\"text-align: center;\"><strong>其他AI技术<\/strong><\/td>\n<td style=\"text-align: center;\"><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">21<\/td>\n<td style=\"text-align: center;\"><a href=\"#/doc/lessons/6-Other/21-GeneticAlgorithms/README.md\">遗传算法<\/a><\/td>\n<td style=\"text-align: center;\"><a href=\"../translations/zh-CN/lessons/6-Other/21-GeneticAlgorithms/Genetic.ipynb\">笔记本<\/a><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">22<\/td>\n<td style=\"text-align: center;\"><a href=\"#/doc/lessons/6-Other/22-DeepRL/README.md\">深度强化学习<\/a><\/td>\n<td style=\"text-align: center;\"><a href=\"../translations/zh-CN/lessons/6-Other/22-DeepRL/CartPole-RL-PyTorch.ipynb\">PyTorch<\/a> /<a href=\"../translations/zh-CN/lessons/6-Other/22-DeepRL/CartPole-RL-TF.ipynb\">TensorFlow<\/a><\/td>\n<td><a href=\"#/doc/lessons/6-Other/22-DeepRL/lab/README.md\">实验<\/a><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">23<\/td>\n<td style=\"text-align: center;\"><a href=\"#/doc/lessons/6-Other/23-MultiagentSystems/README.md\">多智能体系统<\/a><\/td>\n<td style=\"text-align: center;\"><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">VII<\/td>\n<td style=\"text-align: center;\"><strong>人工智能伦理<\/strong><\/td>\n<td style=\"text-align: center;\"><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">24<\/td>\n<td style=\"text-align: center;\"><a href=\"#/doc/lessons/7-Ethics/README.md\">人工智能伦理与负责任的AI<\/a><\/td>\n<td style=\"text-align: center;\"><a href=\"https://docs.microsoft.com/learn/paths/responsible-ai-business-principles/?WT.mc_id=academic-77998-cacaste\">Microsoft Learn: 负责任的AI原则<\/a><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">IX<\/td>\n<td style=\"text-align: center;\"><strong>附加内容<\/strong><\/td>\n<td style=\"text-align: center;\"><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: center;\">25<\/td>\n<td style=\"text-align: center;\"><a href=\"#/doc/lessons/X-Extras/X1-MultiModal/README.md\">多模态网络，CLIP 与 VQGAN<\/a><\/td>\n<td style=\"text-align: center;\"><a href=\"../translations/zh-CN/lessons/X-Extras/X1-MultiModal/Clip.ipynb\">笔记本<\/a><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>每节课包含<\/h2>\n<ul>\n<li>预习材料<\/li>\n<li>可执行的 Jupyter 笔记本，通常针对特定框架（<strong>PyTorch<\/strong> 或 <strong>TensorFlow<\/strong>）。可执行笔记本还包含大量理论内容，因此要理解主题，你需要至少通读其中一个版本的笔记本（PyTorch 或 TensorFlow）。<\/li>\n<li>一些主题配有<strong>实验<\/strong>，让你有机会将所学内容应用到具体问题中。<\/li>\n<li>部分章节含有指向涵盖相关主题的<a href=\"https://learn.microsoft.com/en-us/collections/7w28iy2xrqzdj0?WT.mc_id=academic-77998-bethanycheum\"><strong>MS Learn<\/strong><\/a>模块的链接。<\/li>\n<\/ul>\n<h2>入门指南<\/h2>\n<h3>🎯 AI 新手？从这里开始！<\/h3>\n<p>如果你完全是 AI 新手，想要快速获得动手示例，请查看我们的<a href=\"#/doc/examples/README.md\"><strong>初学者示例<\/strong><\/a>！内容包括：<\/p>\n<ul>\n<li>🌟 <strong>Hello AI World<\/strong> - 你的第一个 AI 程序（模式识别）<\/li>\n<li>🧠 <strong>简单神经网络<\/strong> - 从零构建神经网络  <\/li>\n<li>🖼️ <strong>图像分类器<\/strong> - 带详细注释的图像分类<\/li>\n<li>💬 <strong>文本情感分析<\/strong> - 分析正面/负面文本<\/li>\n<\/ul>\n<p>这些示例设计帮助你在深入完整课程前理解 AI 概念。<\/p>\n<h3>📚 完整课程设置<\/h3>\n<ul>\n<li>我们制作了一个<a href=\"#/doc/lessons/0-course-setup/setup.md\">安装课程<\/a>，帮助你搭建开发环境。<\/li>\n<li>对于教师，我们也制作了一个<a href=\"#/doc/lessons/0-course-setup/for-teachers.md\">课程设置教程<\/a>！<\/li>\n<li>如何在 VSCode 或 Codespace 中<a href=\"#/doc/lessons/0-course-setup/how-to-run.md\">运行代码<\/a><\/li>\n<\/ul>\n<p>请遵循以下步骤：<\/p>\n<p>仓库 Fork：点击本页右上角的“Fork”按钮。<\/p>\n<p>仓库克隆：<code>git clone https://github.com/microsoft/AI-For-Beginners.git<\/code><\/p>\n<p>别忘了给该仓库点星（🌟），方便以后找到它。<\/p>\n<h2>认识其他学习者<\/h2>\n<p>加入我们的<a href=\"https://aka.ms/genai-discord?WT.mc_id=academic-105485-bethanycheum\">官方 AI Discord 服务器<\/a>，结识和交流学习本课程的其他学习者，并获得支持。<\/p>\n<p>如果在构建过程中有产品反馈或问题，请访问我们的<a href=\"https://aka.ms/foundry/forum\">Azure AI Foundry 开发者论坛<\/a><\/p>\n<h2>测验<\/h2>\n<blockquote>\n<p><strong>关于测验的说明<\/strong>：所有测验都包含在 etc\\quiz-app 目录下的 Quiz-app 文件夹中，或可<a href=\"https://ff-quizzes.netlify.app/\">在此在线访问<\/a>。测验从课程中链接，测验应用程序可以本地运行或部署到 Azure；请按 <code>quiz-app<\/code> 文件夹中的说明操作。目前测验正在逐步本地化。<\/p>\n<\/blockquote>\n<h2>需要帮助<\/h2>\n<p>你有建议或者发现拼写或代码错误吗？请提交 issue 或创建 pull request。<\/p>\n<h2>特别感谢<\/h2>\n<ul>\n<li><strong>✍️ 主要作者：<\/strong> <a href=\"http://soshnikov.com\">Dmitry Soshnikov<\/a>，博士<\/li>\n<li><strong>🔥 编辑：<\/strong> <a href=\"https://twitter.com/jenlooper\">Jen Looper<\/a>，博士<\/li>\n<li><strong>🎨 速写插画师：<\/strong> <a href=\"https://twitter.com/girlie_mac\">Tomomi Imura<\/a><\/li>\n<li><strong>✅ 测验创建者：<\/strong> <a href=\"https://github.com/CinnamonXI\">Lateefah Bello<\/a>，<a href=\"https://studentambassadors.microsoft.com/\">MLSA<\/a><\/li>\n<li><strong>🙏 核心贡献者：<\/strong> <a href=\"https://github.com/Pe4enIks\">Evgenii Pishchik<\/a><\/li>\n<\/ul>\n<h2>其他课程体系<\/h2>\n<p>我们的团队还制作了其他课程！查看：<\/p>\n<!-- CO-OP TRANSLATOR OTHER COURSES START -->\n<h3>LangChain<\/h3>\n<p><a href=\"https://aka.ms/langchain4j-for-beginners\"><img alt=\"LangChain4j for Beginners\" src=\"https://img.shields.io/badge/LangChain4j%20for%20Beginners-22C55E?style=for-the-badge&amp;&amp;labelColor=E5E7EB&amp;color=0553D6\" /><\/a>\n<a href=\"https://aka.ms/langchainjs-for-beginners?WT.mc_id=m365-94501-dwahlin\"><img alt=\"LangChain.js for Beginners\" src=\"https://img.shields.io/badge/LangChain.js%20for%20Beginners-22C55E?style=for-the-badge&amp;labelColor=E5E7EB&amp;color=0553D6\" /><\/a>\n<a href=\"https://github.com/microsoft/langchain-for-beginners?WT.mc_id=m365-94501-dwahlin\"><img alt=\"LangChain for Beginners\" src=\"https://img.shields.io/badge/LangChain%20for%20Beginners-22C55E?style=for-the-badge&amp;labelColor=E5E7EB&amp;color=0553D6\" /><\/a><\/p>\ F8\" /><\/a><\/p>\n<hr />\n<h3>Copilot 系列<\/h3>\n<p><a href=\"https://aka.ms/GitHubCopilotAI?WT.mc_id=academic-105485-koreyst\"><img alt=\"AI 配对编程 Copilot\" src=\"https://img.shields.io/badge/Copilot%20for%20AI%20Paired%20Programming-FACC15?style=for-the-badge&amp;labelColor=E5E7EB&amp;color=FACC15\" /><\/a>\n<a href=\"https://github.com/microsoft/mastering-github-copilot-for-dotnet-csharp-developers?WT.mc_id=academic-105485-koreyst\"><img alt=\"C#/.NET Copilot\" src=\"https://img.shields.io/badge/Copilot%20for%20C%23/.NET-FBBF24?style=for-the-badge&amp;labelColor=E5E7EB&amp;color=FBBF24\" /><\/a>\n<a href=\"https://github.com/microsoft/CopilotAdventures?WT.mc_id=academic-105485-koreyst\"><img alt=\"Copilot 冒险\" src=\"https://img.shields.io/badge/Copilot%20Adventure-FDE68A?style=for-the-badge&amp;labelColor=E5E7EB&amp;color=FDE68A\" /><\/a><\/p>\n<!-- CO-OP TRANSLATOR OTHER COURSES END -->\n\n<h2>获取帮助<\/h2>\n<p>如果遇到瓶颈或有任何关于构建 AI 应用的问题，欢迎加入 MCP 学习者和资深开发者的讨论社区。这里是一个友好支持的社区，欢迎提问并自由分享知识。<\/p>\n<p><a href=\"https://discord.gg/nTYy5BXMWG\"><img alt=\"Microsoft Foundry Discord\" src=\"https://dcbadge.limes.pink/api/server/nTYy5BXMWG\" /><\/a><\/p>\n<p>如果在构建过程中有产品反馈或遇到问题，请访问：<\/p>\n<p><a href=\"https://aka.ms/foundry/forum\"><img alt=\"Microsoft Foundry Developer Forum\" src=\"https://img.shields.io/badge/GitHub-Microsoft_Foundry_Developer_Forum-blue?style=for-the-badge&amp;logo=github&amp;color=000000&amp;logoColor=fff\" /><\/a><\/p>\n<hr />\n<!-- CO-OP TRANSLATOR DISCLAIMER START -->\n<p><strong>免责声明<\/strong>：<br />\n本文件通过 AI 翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保准确性，但请注意自动翻译可能包含错误或不准确之处。原始文件的母语版本应视为权威来源。对于重要信息，建议使用专业人工翻译。我们不对因使用本翻译而产生的任何误解或误释承担责任。<\/p>\n<!-- CO-OP TRANSLATOR DISCLAIMER END -->"},"lessons/README.md":{"t":"概述","h":"<h1>概述<\/h1>\n<p><img alt=\"概述的手绘图\" src=\"https://github.com/microsoft/AI-For-Beginners/raw/main/lessons/sketchnotes/ai-overview.png\" /><\/p>\n<blockquote>\n<p>手绘笔记由 <a href=\"https://twitter.com/girlie_mac\">Tomomi Imura<\/a> 提供<\/p>\n<\/blockquote>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原文档的原始语言版本为权威来源。对于关键信息，建议使用专业人工翻译。我们对因使用此翻译而引起的任何误解或误读不承担责任。<\/p>"},"lessons/0-course-setup/for-teachers.md":{"t":"给教育工作者","h":"<h1>给教育工作者<\/h1>\n<p>想在课堂上使用这套课程吗？请随意使用！<\/p>\n<p>事实上，您可以通过 GitHub Classroom 在 GitHub 上直接使用它。<\/p>\n<p>要做到这一点，请先 fork 此仓库。您需要为每节课创建一个单独的仓库，因此需要将每个文件夹提取到一个独立的仓库中。这样，<a href=\"https://classroom.github.com/classrooms\">GitHub Classroom<\/a> 就可以分别识别每节课。<\/p>\n<p>这些<a href=\"https://github.blog/2020-03-18-set-up-your-digital-classroom-with-github-classroom/\">完整的说明<\/a>可以帮助您了解如何设置您的课堂。<\/p>\n<h2>按原样使用此仓库<\/h2>\n<p>如果您希望按当前形式使用此仓库，而不使用 GitHub Classroom，这也是可以的。您需要与学生沟通，一起完成哪一节课程。<\/p>\n<p>在在线教学环境中（如 Zoom、Teams 或其他平台），您可以为测验创建分组讨论室，并指导学生为学习做好准备。然后邀请学生参加测验，并在特定时间以“issues”的形式提交答案。如果您希望学生公开协作完成作业，也可以采用类似的方式。<\/p>\n<p>如果您更喜欢更私密的形式，可以让学生逐节 fork 课程到他们自己的 GitHub 私有仓库，并授予您访问权限。这样，他们可以私下完成测验和作业，并通过您课堂仓库中的 issues 提交给您。<\/p>\n<p>在在线课堂中，有很多方法可以让这套课程发挥作用。请告诉我们哪种方式最适合您！<\/p>\n<h2>请分享您的想法<\/h2>\n<p>我们希望这套课程能够满足您和学生的需求。请在讨论区中给我们反馈！<\/p>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原始语言的文档作为权威来源。对于关键信息，建议使用专业人工翻译。我们对于因使用此翻译而引起的任何误解或误读不承担责任。<\/p>"},"lessons/0-course-setup/how-to-run.md":{"t":"如何运行代码","h":"<h1>如何运行代码<\/h1>\n<p>本课程包含许多可执行示例和实验，您可能想运行它们。为此，您需要能够在本课程提供的 Jupyter Notebook 中执行 Python 代码。您有几种运行代码的选择：<\/p>\n<h2>在您的计算机上本地运行<\/h2>\n<p>若要在您的计算机上本地运行代码，需要安装 Python。推荐安装 <strong><a href=\"https://conda.io/en/latest/miniconda.html\">miniconda<\/a><\/strong> —— 它是较轻量的安装，支持使用 <code>conda<\/code> 包管理器管理不同的 Python <strong>虚拟环境<\/strong>。<\/p>\n<p>安装 miniconda 后，克隆仓库并创建一个本课程用的虚拟环境：<\/p>\n<pre><code class=\"language-bash\">git clone http://github.com/microsoft/ai-for-beginners\ncd ai-for-beginners\nconda env create --name ai4beg --file .devcontainer/environment.yml\nconda activate ai4beg\n<\/code><\/pre>\n<h3>使用带 Python 扩展的 Visual Studio Code<\/h3>\n<p>在 <a href=\"http://code.visualstudio.com/?WT.mc_id=academic-77998-cacaste\">Visual Studio Code<\/a> 中打开本课程并安装 <a href=\"https://marketplace.visualstudio.com/items?itemName=ms-python.python&amp;WT.mc_id=academic-77998-cacaste\">Python 扩展<\/a>，是使用本课程的最佳方式。<\/p>\n<blockquote>\n<p><strong>注意<\/strong>：克隆并在 VS Code 中打开目录后，它会自动提示您安装 Python 扩展。同时，您还需按照上面描述安装 miniconda。<\/p>\n<p><strong>注意<\/strong>：如果 VS Code 提示您重新在容器中打开仓库，您应拒绝该请求，以便使用本地 Python 安装。<\/p>\n<\/blockquote>\n<h3>在浏览器中使用 Jupyter<\/h3>\n<p>您也可以在自己计算机上的浏览器中使用 Jupyter 环境。无论是经典 Jupyter 还是 JupyterHub，都提供自动补全、代码高亮等便捷的开发环境。<\/p>\n<p>要在本地启动 Jupyter，请进入课程目录，执行以下命令：<\/p>\n<pre><code class=\"language-bash\">jupyter notebook\n<\/code><\/pre>\n<p>或<\/p>\n<pre><code class=\"language-bash\">jupyterhub\n<\/code><\/pre>\n<p>然后，您可以导航到任何 <code>.ipynb<\/code> 文件，打开它们并开始工作。<\/p>\n<h3>容器中运行<\/h3>\n<p>安装 Python 的另一种方式是通过容器运行代码。由于我们的仓库提供了一个专门的 <code>.devcontainer<\/code> 文件夹，指导如何为此仓库构建容器，VS Code 提供重新在容器中打开代码的选项。这需要安装 Docker，且更复杂，因此我们建议经验丰富的用户使用。<\/p>\n<h2>云端运行<\/h2>\n<p>如果您不想本地安装 Python，且拥有某些云资源，另一种选择是云端运行代码。您可以通过几种方式实现这一点：<\/p>\n<ul>\n<li>使用 <strong><a href=\"https://github.com/features/codespaces\">GitHub Codespaces<\/a><\/strong>，这是 GitHub 为您创建的虚拟环境，可通过 VS Code 浏览器界面访问。如果您能使用 Codespaces，只需点击仓库中的 <strong>Code<\/strong> 按钮，启动 codespace，马上就能运行。<\/li>\n<li>使用 <strong><a href=\"https://mybinder.org/v2/gh/microsoft/ai-for-beginners/HEAD\">Binder<\/a><\/strong>。<a href=\"https://mybinder.org\">Binder<\/a> 为像您这样的用户提供免费的云端计算资源，可以用来测试 GitHub 上的代码。主页上有一个按钮可以在 Binder 中打开仓库，这会迅速带您到 Binder 网站，它会构建底层容器，并无缝启动 Jupyter 网页界面。<\/li>\n<\/ul>\n<blockquote>\n<p><strong>注意<\/strong>：为防止滥用，Binder 对某些网络资源有限制。这可能导致部分代码无法运行（尤其是那些从公共互联网获取模型和/或数据集的代码）。您可能需要找到一些解决方法。另外，Binder 提供的计算资源相当基础，训练过程会很慢，尤其是在后面更复杂的课程中。<\/p>\n<\/blockquote>\n<h2>云端 GPU 运行<\/h2>\n<p>本课程后期的部分课程非常依赖 GPU 支持。例如模型训练，若无 GPU 会非常缓慢。如果您拥有云端账号，尤其是通过 <a href=\"https://azure.microsoft.com/free/students/?WT.mc_id=academic-77998-cacaste\">Azure for Students<\/a> 或您所在机构的云服务，可以采用以下几种方式：<\/p>\n<ul>\n<li>创建 <a href=\"https://docs.microsoft.com/learn/modules/intro-to-azure-data-science-virtual-machine/?WT.mc_id=academic-77998-cacaste\">数据科学虚拟机（Data Science Virtual Machine）<\/a>，通过 Jupyter 连接。然后您可以直接在虚拟机上克隆仓库，开始学习。NC 系列虚拟机支持 GPU。<\/li>\n<\/ul>\n<blockquote>\n<p><strong>注意<\/strong>：某些订阅（包括 Azure for Students）默认不提供 GPU 支持。您可能需要通过技术支持请求额外申请 GPU 核心。<\/p>\n<\/blockquote>\n<ul>\n<li>创建 <a href=\"https://azure.microsoft.com/services/machine-learning/?WT.mc_id=academic-77998-cacaste\">Azure 机器学习工作区<\/a>，使用其中的 Notebook 功能。<a href=\"https://azure-for-academics.github.io/quickstart/azureml-papers/\">此视频<\/a>展示了如何将仓库克隆到 Azure ML Notebook 并开始使用。<\/li>\n<\/ul>\n<p>您也可以使用 Google Colab，它提供部分免费 GPU 支持，您可以上传 Jupyter Notebook 并逐个执行。<\/p>\n<hr />\n<!-- CO-OP TRANSLATOR DISCLAIMER START -->\n<p><strong>免责声明<\/strong>：\n本文件由 AI 翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 翻译完成。尽管我们力求准确，但请注意，自动翻译可能包含错误或不准确之处。原始语言版文件应视为权威来源。对于重要信息，建议使用专业人工翻译。我们对因使用本翻译而产生的任何误解或误释不承担责任。<\/p>\n<!-- CO-OP TRANSLATOR DISCLAIMER END -->"},"lessons/0-course-setup/setup.md":{"t":"开始学习本课程","h":"<h1>开始学习本课程<\/h1>\n<h2>你是学生吗？<\/h2>\n<p>以下资源可以帮助你入门：<\/p>\n<ul>\n<li><a href=\"https://docs.microsoft.com/learn/student-hub?WT.mc_id=academic-77998-cacaste\">学生中心页面<\/a> 在这个页面，你可以找到初学者资源、学生礼包，甚至获取免费认证券的方法。建议你将此页面加入书签，并定期查看，因为我们至少每月更新内容。<\/li>\n<li><a href=\"https://studentambassadors.microsoft.com?WT.mc_id=academic-77998-cacaste\">微软学生学习大使<\/a> 加入全球学生大使社区，这可能是你进入微软的途径。<\/li>\n<\/ul>\n<p><strong>学生们<\/strong>，有几种方式可以使用本课程。首先，你可以直接阅读文本并在 GitHub 上查看代码。如果你想运行任何笔记本中的代码，请<a href=\"#/doc/lessons/0-course-setup/how-to-run.md\">阅读我们的说明<\/a>，并在<a href=\"https://soshnikov.com/education/how-to-execute-notebooks-from-github/\">这篇博客文章<\/a>中找到更多建议。<\/p>\n<blockquote>\n<p><strong>注意<\/strong>: <a href=\"#/doc/lessons/0-course-setup/how-to-run.md\">如何运行本课程代码的说明<\/a><\/p>\n<\/blockquote>\n<h2>自学<\/h2>\n<p>如果你想将课程作为自学项目，我们建议你将整个仓库 fork 到自己的 GitHub 账户，并独立或与小组一起完成练习：<\/p>\n<ul>\n<li>从课前测验开始。<\/li>\n<li>阅读课程的介绍文本。<\/li>\n<li>如果课程有额外的笔记本，逐步阅读并运行代码。如果同时提供了 TensorFlow 和 PyTorch 的笔记本，你可以专注于其中一个——选择你喜欢的框架。<\/li>\n<li>笔记本通常包含一些需要你稍作修改代码以进行实验的挑战。<\/li>\n<li>完成课后测验。<\/li>\n<li>如果模块附带实验室，请完成相关任务。<\/li>\n<li>访问<a href=\"https://github.com/microsoft/AI-For-Beginners/discussions\">讨论板<\/a>进行“公开学习”。<\/li>\n<\/ul>\n<blockquote>\n<p>对于进一步学习，我们推荐以下<a href=\"https://docs.microsoft.com/en-us/users/dmitrysoshnikov-9132/collections/31zgizg2p418yo/?WT.mc_id=academic-77998-cacaste\">微软学习<\/a>模块和学习路径。<\/p>\n<\/blockquote>\n<p><strong>教师们<\/strong>，我们<a href=\"#/doc/lessons/0-course-setup/for-teachers.md\">提供了一些建议<\/a>供您参考如何使用本课程。<\/p>\n<hr />\n<h2>教学法<\/h2>\n<p>在设计本课程时，我们选择了两个教学原则：确保课程是<strong>基于项目<\/strong>的动手实践，并且包含<strong>频繁的测验<\/strong>。<\/p>\n<p>通过确保内容与项目相结合，学习过程变得更具吸引力，同时也能增强概念的记忆。此外，课前的低压力测验可以让学生专注于学习主题，而课后的测验则进一步巩固记忆。本课程设计灵活有趣，可以完整学习，也可以部分学习。项目从简单开始，到12周周期结束时逐渐变得复杂。<\/p>\n<blockquote>\n<p><strong>关于测验的说明<\/strong>: 所有测验都包含在<a href=\"https://red-field-0a6ddfd03.1.azurestaticapps.net/\">这个应用程序<\/a>中，共有50个测验，每个测验包含三个问题。测验链接嵌入在课程中，但测验应用程序可以在本地运行；请按照 <code>etc/quiz-app<\/code> 文件夹中的说明操作。<\/p>\n<\/blockquote>\n<h2>离线访问<\/h2>\n<p>你可以使用 <a href=\"https://docsify.js.org/#/\">Docsify<\/a> 离线运行此文档。Fork 此仓库，在本地机器上<a href=\"https://docsify.js.org/#/quickstart\">安装 Docsify<\/a>，然后在此仓库的根文件夹中输入 <code>docsify serve<\/code>。网站将在本地的端口3000上运行：<code>localhost:3000<\/code>。课程的 PDF 可通过<a href=\"https://raw.githubusercontent.com/songbing1521/AI-For-Beginners-zh-CN/main/../../etc/pdf/readme.pdf\">此链接<\/a>获取。<\/p>\n<hr />\n<!-- CO-OP TRANSLATOR DISCLAIMER START -->\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务<a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a>进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。原始语言的文档应被视为权威来源。对于重要信息，建议使用专业人工翻译。我们对因使用此翻译而产生的任何误解或误读不承担责任。<\/p>\n<!-- CO-OP TRANSLATOR DISCLAIMER END -->"},"lessons/1-Intro/README.md":{"t":"人工智能简介","h":"<h1>人工智能简介<\/h1>\n<p><img alt=\"人工智能内容简介的涂鸦\" src=\"../translated_images/zh-CN/ai-intro.bf28d1ac4235881c.webp\" /><\/p>\n<blockquote>\n<p>涂鸦作者：<a href=\"https://twitter.com/girlie_mac\">Tomomi Imura<\/a><\/p>\n<\/blockquote>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/1\">课前测验<\/a><\/h2>\n<p><strong>人工智能<\/strong>是一门令人兴奋的科学学科，研究如何让计算机表现出智能行为，例如完成那些人类擅长的事情。<\/p>\n<p>最初，计算机是由<a href=\"https://en.wikipedia.org/wiki/Charles_Babbage\">查尔斯·巴贝奇<\/a>发明的，用于按照明确的程序（算法）对数字进行操作。尽管现代计算机比19世纪提出的原始模型先进得多，但它们仍然遵循受控计算的基本理念。因此，如果我们知道实现目标所需的确切步骤序列，就可以编程让计算机完成某项任务。<\/p>\n<p><img alt=\"一个人的照片\" src=\"../translated_images/zh-CN/dsh_age.d212a30d4e54fb5f.webp\" /><\/p>\n<blockquote>\n<p>照片由 <a href=\"http://twitter.com/vickievalerie\">Vickie Soshnikova<\/a> 提供<\/p>\n<p>✅ 从一张照片中判断一个人的年龄是无法通过明确编程实现的，因为我们并不知道在脑海中得出这个数字的具体过程。<\/p>\n<\/blockquote>\n<hr />\n<p>然而，有些任务我们并不知道如何明确解决。比如，从一张照片中判断一个人的年龄。我们之所以能做到，是因为我们见过许多不同年龄段的人的例子，但我们无法明确解释自己是如何做到的，也无法编程让计算机完成这项任务。这正是<strong>人工智能<\/strong>（简称AI）感兴趣的任务类型。<\/p>\n<p>✅ 想一想有哪些任务可以交给计算机完成，并且可以从AI中受益。考虑金融、医疗和艺术领域——这些领域今天是如何从AI中受益的？<\/p>\n<h2>弱人工智能与强人工智能<\/h2>\n<table>\n<thead>\n<tr>\n<th>弱人工智能<\/th>\n<th>强人工智能<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>弱人工智能指的是为特定任务或一组狭窄任务设计和训练的AI系统。<\/td>\n<td>强人工智能，或称通用人工智能（AGI），指的是具有与人类相当的智能和理解能力的AI系统。<\/td>\n<\/tr>\n<tr>\n<td>这些AI系统并不具备普遍的智能；它们擅长执行预定义的任务，但缺乏真正的理解或意识。<\/td>\n<td>这些AI系统能够执行人类可以完成的任何智力任务，适应不同领域，并具备某种形式的意识或自我意识。<\/td>\n<\/tr>\n<tr>\n<td>弱人工智能的例子包括像Siri或Alexa这样的虚拟助手、流媒体服务使用的推荐算法，以及为特定客户服务任务设计的聊天机器人。<\/td>\n<td>实现强人工智能是AI研究的长期目标，需要开发能够在广泛任务和情境中推理、学习、理解和适应的AI系统。<\/td>\n<\/tr>\n<tr>\n<td>弱人工智能高度专业化，不具备超出其狭窄领域的人类认知能力或通用问题解决能力。<\/td>\n<td>强人工智能目前是一个理论概念，还没有AI系统达到这种通用智能的水平。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>有关更多信息，请参考<strong><a href=\"https://en.wikipedia.org/wiki/Artificial_general_intelligence\">通用人工智能<\/a><\/strong> (AGI)。<\/p>\n<h2>智能的定义与图灵测试<\/h2>\n<p>在讨论<strong><a href=\"https://en.wikipedia.org/wiki/Intelligence\">智能<\/a><\/strong>这个术语时，一个问题是我们并没有对其明确的定义。有人认为智能与<strong>抽象思维<\/strong>或<strong>自我意识<\/strong>相关，但我们无法准确定义它。<\/p>\n<p><img alt=\"一只猫的照片\" src=\"../translated_images/zh-CN/photo-cat.8c8e8fb760ffe457.webp\" /><\/p>\n<blockquote>\n<p><a href=\"https://unsplash.com/photos/75715CVEJhI\">照片<\/a>由 <a href=\"https://unsplash.com/@sadmax\">Amber Kipp<\/a> 提供，来自Unsplash<\/p>\n<\/blockquote>\n<p>为了说明“智能”这个术语的模糊性，试着回答一个问题：“猫是智能的吗？”不同的人往往会给出不同的答案，因为没有普遍接受的测试可以证明这一说法的真伪。如果你认为有——试着让你的猫参加智商测试……<\/p>\n<p>✅ 花一分钟思考你如何定义智能。一只能够解决迷宫并获取食物的乌鸦是智能的吗？一个孩子是智能的吗？<\/p>\n<hr />\n<p>在讨论AGI时，我们需要某种方法来判断是否创造了一个真正智能的系统。<a href=\"https://en.wikipedia.org/wiki/Alan_Turing\">艾伦·图灵<\/a>提出了一种方法，称为<strong><a href=\"https://en.wikipedia.org/wiki/Turing_test\">图灵测试<\/a><\/strong>，这也可以看作是智能的定义。该测试将一个给定系统与某种本质上智能的东西——一个真实的人类进行比较。由于任何自动化比较都可能被计算机程序绕过，我们使用人类审问者。如果一个人类无法在基于文本的对话中区分真实的人和计算机系统，那么该系统就被认为是智能的。<\/p>\n<blockquote>\n<p>一个名为 <a href=\"https://en.wikipedia.org/wiki/Eugene_Goostman\">Eugene Goostman<\/a> 的聊天机器人于2014年在圣彼得堡开发，利用了一个巧妙的个性技巧，接近通过图灵测试。它一开始就声明自己是一个13岁的乌克兰男孩，这可以解释知识的缺乏和文本中的一些不一致之处。该机器人在5分钟的对话中说服了30%的评委相信它是人类，这是图灵认为机器到2000年能够通过的指标。然而，我们应该明白，这并不意味着我们已经创造了一个智能系统，或者计算机系统欺骗了人类审问者——实际上是机器人开发者欺骗了人类！<\/p>\n<\/blockquote>\n<p>✅ 你是否曾被聊天机器人欺骗，以为自己在与人类对话？它是如何让你相信的？<\/p>\n<h2>人工智能的不同方法<\/h2>\n<p>如果我们希望计算机像人类一样行为，我们需要在计算机中某种程度上模拟人类的思维方式。因此，我们需要尝试理解是什么让人类具有智能。<\/p>\n<blockquote>\n<p>为了能够将智能编程到机器中，我们需要理解我们自身的决策过程是如何运作的。如果你稍加自我反思，你会意识到有些过程是潜意识发生的——例如，我们可以在不思考的情况下区分猫和狗——而另一些过程则涉及推理。<\/p>\n<\/blockquote>\n<p>解决这个问题有两种可能的方法：<\/p>\n<table>\n<thead>\n<tr>\n<th>自上而下方法（符号推理）<\/th>\n<th>自下而上方法（神经网络）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>自上而下的方法模拟人类解决问题的推理方式。它涉及从人类中提取<strong>知识<\/strong>，并以计算机可读的形式表示出来。我们还需要开发一种方法在计算机中建模<strong>推理<\/strong>。<\/td>\n<td>自下而上的方法模拟人类大脑的结构，由大量简单单元组成，称为<strong>神经元<\/strong>。每个神经元的作用类似于其输入的加权平均值，我们可以通过提供<strong>训练数据<\/strong>来训练神经网络解决有用的问题。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>此外，还有一些其他可能的智能方法：<\/p>\n<ul>\n<li>\n<p><strong>涌现式<\/strong>、<strong>协同式<\/strong>或<strong>多代理方法<\/strong>基于这样一个事实：复杂的智能行为可以通过大量简单代理的交互获得。根据<a href=\"https://en.wikipedia.org/wiki/Global_brain#Evolutionary_cybernetics\">进化控制论<\/a>，智能可以在<em>元系统转变<\/em>的过程中从更简单的反应行为中<em>涌现<\/em>。<\/p>\n<\/li>\n<li>\n<p><strong>进化方法<\/strong>或<strong>遗传算法<\/strong>是一种基于进化原理的优化过程。<\/p>\n<\/li>\n<\/ul>\n<p>我们将在课程后续部分讨论这些方法，但现在我们将重点关注两种主要方向：自上而下和自下而上。<\/p>\n<h3>自上而下方法<\/h3>\n<p>在<strong>自上而下方法<\/strong>中，我们尝试模拟我们的推理过程。因为我们可以在推理时跟随自己的思路，我们可以尝试将这一过程形式化并编程到计算机中。这被称为<strong>符号推理<\/strong>。<\/p>\n<p>人们往往在头脑中有一些指导决策过程的规则。例如，当医生诊断病人时，他或她可能意识到病人发烧，因此可能存在某种炎症。通过将大量规则应用于特定问题，医生可能得出最终诊断。<\/p>\n<p>这种方法高度依赖于<strong>知识表示<\/strong>和<strong>推理<\/strong>。从人类专家那里提取知识可能是最困难的部分，因为医生在许多情况下并不确切知道为什么会得出某个诊断。有时，解决方案只是突然出现在他的脑海中，而没有明确的思考。有些任务，例如从照片中判断一个人的年龄，根本无法简化为知识的操作。<\/p>\n<h3>自下而上方法<\/h3>\n<p>另一种方法是尝试模拟我们大脑中最简单的元素——神经元。我们可以在计算机中构建一个所谓的<strong>人工神经网络<\/strong>，然后通过提供示例来教它解决问题。这一过程类似于新生儿通过观察学习周围环境的方式。<\/p>\n<p>✅ 研究一下婴儿是如何学习的。婴儿大脑的基本元素是什么？<\/p>\n<blockquote>\n<table>\n<thead>\n<tr>\n<th>那机器学习呢？<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>人工智能的一部分是基于计算机通过一些数据学习解决问题的，这被称为<strong>机器学习<\/strong>。我们不会在本课程中讨论经典的机器学习——请参考单独的<a href=\"http://aka.ms/ml-beginners\">机器学习初学者课程<\/a>。<\/td>\n<td><img alt=\"机器学习初学者\" src=\"../translated_images/zh-CN/ml-for-beginners.9e4fed176fd5817d.webp\" /><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/blockquote>\n<h2>人工智能简史<\/h2>\n<p>人工智能作为一个领域始于20世纪中期。最初，符号推理是一种流行的方法，并取得了一些重要的成功，例如专家系统——能够在某些有限问题领域中充当专家的计算机程序。然而，很快就发现这种方法并不具有良好的扩展性。从专家那里提取知识、在计算机中表示这些知识并保持知识库的准确性，结果证明是一项非常复杂且在许多情况下成本过高的任务。这导致了20世纪70年代所谓的<a href=\"https://en.wikipedia.org/wiki/AI_winter\">人工智能寒冬<\/a>。<\/p>\n<p><img alt=\"人工智能简史\" src=\"../translated_images/zh-CN/history-of-ai.7e83efa70b537f5a.webp\" width=\"70%\"/><\/p>\n<blockquote>\n<p>图片由 <a href=\"http://soshnikov.com\">Dmitry Soshnikov<\/a> 提供<\/p>\n<\/blockquote>\n<p>随着时间的推移，计算资源变得更便宜，数据也变得更加丰富，因此神经网络方法在许多领域（如计算机视觉或语音理解）中开始表现出色。在过去十年中，“人工智能”一词大多被用作神经网络的同义词，因为我们听到的大多数AI成功案例都基于它们。<\/p>\n<p>我们可以观察到方法的变化，例如在创建国际象棋程序时：<\/p>\n<ul>\n<li>早期的国际象棋程序基于搜索——程序明确尝试估计对手在给定的几个下一步中的可能走法，并根据几步内可以达到的最佳位置选择最佳走法。这导致了所谓的<a href=\"https://en.wikipedia.org/wiki/Alpha%E2%80%93beta_pruning\">α-β剪枝<\/a>搜索算法的发展。<\/li>\n<li>搜索策略在游戏后期效果很好，因为搜索空间被少量可能的走法限制。然而，在游戏开始时，搜索空间非常大，算法可以通过学习人类玩家之间的现有比赛来改进。后续实验采用了所谓的<a href=\"https://en.wikipedia.org/wiki/Case-based_reasoning\">基于案例的推理<\/a>，程序在知识库中寻找与当前棋局非常相似的案例。<\/li>\n<li>能够战胜人类玩家的现代程序基于神经网络和<a href=\"https://en.wikipedia.org/wiki/Reinforcement_learning\">强化学习<\/a>，程序通过长时间与自己对弈并从自己的错误中学习来学会下棋——这与人类学习下棋的方式非常相似。然而，计算机程序可以在更短的时间内进行更多的对弈，因此可以学习得更快。<\/li>\n<\/ul>\n<p>✅ 研究一下其他由AI参与的游戏。<\/p>\n<p>同样，我们可以看到创建“会说话的程序”（可能通过图灵测试）的方法的变化：<\/p>\n<ul>\n<li>早期此类程序（如<a href=\"https://en.wikipedia.org/wiki/ELIZA\">Eliza<\/a>）基于非常简单的语法规则和将输入句子重新表述为问题。<\/li>\n<li>现代助手，如Cortana、Siri或Google Assistant，都是混合系统，使用神经网络将语音转换为文本并识别我们的意图，然后采用一些推理或明确的算法来执行所需的操作。<\/li>\n<li>未来，我们可能会期待一个完全基于神经网络的模型能够自行处理对话。最近的GPT和<a href=\"https://www.microsoft.com/research/blog/turing-nlg-a-17-billion-parameter-language-model-by-microsoft\">Turing-NLG<\/a>系列神经网络在这方面表现出色。<\/li>\n<\/ul>\n<p><img alt=\"图灵测试的演变\" src=\"../translated_images/zh-CN/turing-test-evol.4184696701293ead.webp\" width=\"70%\"/><\/p>\n<blockquote>\n<p>图片由 Dmitry Soshnikov 提供，<a href=\"https://unsplash.com/photos/r8LmVbUKgns\">照片<\/a>由 <a href=\"https://unsplash.com/@abrosimova_marina_foto\">Marina Abrosimova<\/a> 提供，来源于 Unsplash<\/p>\n<\/blockquote>\n<h2>最近的人工智能研究<\/h2>\n<p>神经网络研究的巨大增长始于2010年左右，当时大型公共数据集开始变得可用。一组名为 <a href=\"https://en.wikipedia.org/wiki/ImageNet\">ImageNet<\/a> 的庞大图像集合，其中包含约1400万张带注释的图像，催生了 <a href=\"https://image-net.org/challenges/LSVRC/\">ImageNet 大规模视觉识别挑战赛<\/a>。<\/p>\n<p><img alt=\"ILSVRC 准确率\" src=\"https://raw.githubusercontent.com/songbing1521/AI-For-Beginners-zh-CN/main/lessons/1-Intro/images/ilsvrc.gif\" /><\/p>\n<blockquote>\n<p>图片由 <a href=\"http://soshnikov.com\">Dmitry Soshnikov<\/a> 提供<\/p>\n<\/blockquote>\n<p>2012年，<a href=\"#/doc/lessons/4-ComputerVision/07-ConvNets/README.md\">卷积神经网络<\/a>首次用于图像分类，导致分类错误率显著下降（从接近30%降至16.4%）。2015年，微软研究院的 ResNet 架构<a href=\"https://doi.org/10.1109/ICCV.2015.123\">达到了人类级别的准确率<\/a>。<\/p>\n<p>从那时起，神经网络在许多任务中表现出了非常成功的效果：<\/p>\n<hr />\n<table>\n<thead>\n<tr>\n<th>年份<\/th>\n<th>达到人类水平<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2015<\/td>\n<td><a href=\"https://doi.org/10.1109/ICCV.2015.123\">图像分类<\/a><\/td>\n<\/tr>\n<tr>\n<td>2016<\/td>\n<td><a href=\"https://arxiv.org/abs/1610.05256\">对话语音识别<\/a><\/td>\n<\/tr>\n<tr>\n<td>2018<\/td>\n<td><a href=\"https://arxiv.org/abs/1803.05567\">自动机器翻译<\/a>（中译英）<\/td>\n<\/tr>\n<tr>\n<td>2020<\/td>\n<td><a href=\"https://arxiv.org/abs/2009.13682\">图像描述生成<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>在过去几年中，我们见证了大型语言模型的巨大成功，例如 BERT 和 GPT-3。这主要是因为有大量的通用文本数据可用，使我们能够训练模型以捕捉文本的结构和意义，在通用文本集合上进行预训练，然后将这些模型专门化用于更具体的任务。我们将在本课程后续部分中学习更多关于<a href=\"#/doc/lessons/5-NLP/README.md\">自然语言处理<\/a>的内容。<\/p>\n<h2>🚀 挑战<\/h2>\n<p>在互联网上进行探索，找出你认为人工智能最有效的应用领域。是地图应用程序、语音转文字服务还是视频游戏？研究该系统是如何构建的。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/2\">课后测验<\/a><\/h2>\n<h2>复习与自学<\/h2>\n<p>通过阅读<a href=\"https://github.com/microsoft/ML-For-Beginners/tree/main/1-Introduction/2-history-of-ML\">这节课<\/a>来复习人工智能和机器学习的历史。从该课程顶部的手绘笔记或本课程中选取一个元素，深入研究以了解其演变背后的文化背景。<\/p>\n<p><strong>作业<\/strong>：<a href=\"#/doc/lessons/1-Intro/assignment.md\">游戏开发挑战<\/a><\/p>\n<hr />\n<!-- CO-OP TRANSLATOR DISCLAIMER START -->\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务<a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a>进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。原始语言的文档应被视为权威来源。对于重要信息，建议使用专业人工翻译。我们对因使用此翻译而产生的任何误解或误读不承担责任。<\/p>\n<!-- CO-OP TRANSLATOR DISCLAIMER END -->"},"lessons/1-Intro/assignment.md":{"t":"第1章 · AI 导论 · 作业","h":"<h1>游戏创作马拉松<\/h1>\n<p>游戏是一个深受人工智能（AI）和机器学习（ML）发展影响的领域。在本次作业中，请撰写一篇关于你喜欢的游戏的短文，探讨该游戏如何受到AI演变的影响。这个游戏应该足够古老，以便能够体现多种计算处理系统的影响。一个很好的例子是国际象棋或围棋，但你也可以看看像乒乓球（Pong）或吃豆人（Pac-Man）这样的电子游戏。撰写一篇文章，讨论该游戏的过去、现在以及AI的未来发展。<\/p>\n<hr />\n<!-- CO-OP TRANSLATOR DISCLAIMER START -->\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务<a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a>进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。原始语言的文档应被视为权威来源。对于重要信息，建议使用专业人工翻译。我们对因使用此翻译而产生的任何误解或误读不承担责任。<\/p>\n<!-- CO-OP TRANSLATOR DISCLAIMER END -->"},"lessons/2-Symbolic/README.md":{"t":"知识表示与专家系统","h":"<h1>知识表示与专家系统<\/h1>\n<p><img alt=\"符号人工智能内容摘要\" src=\"../translated_images/zh-CN/ai-symbolic.715a30cb610411a6.webp\" /><\/p>\n<blockquote>\n<p>草图由 <a href=\"https://twitter.com/girlie_mac\">Tomomi Imura<\/a> 绘制<\/p>\n<\/blockquote>\n<p>人工智能的追求是基于对知识的探索，以类似人类的方式理解世界。但你该如何实现这一点呢？<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/3\">课前测验<\/a><\/h2>\n<p>在人工智能的早期阶段，自顶向下创建智能系统的方法（在上一课中讨论）很流行。其想法是从人类身上提取知识，转换成机器可读的形式，然后用它来自动解决问题。这种方法基于两个重要理念：<\/p>\n<ul>\n<li>知识表示<\/li>\n<li>推理<\/li>\n<\/ul>\n<h2>知识表示<\/h2>\n<p>符号人工智能中的一个重要概念是<strong>知识<\/strong>。必须区分知识与<em>信息<\/em>或<em>数据<\/em>。例如，可以说书中包含知识，因为学习书籍可以成为专家。然而，书中实际上包含的是<em>数据<\/em>，通过阅读书籍并将这些数据整合进我们的世界模型，我们把数据转化为知识。<\/p>\n<blockquote>\n<p>✅ <strong>知识<\/strong>是我们头脑中包含的东西，代表我们对世界的理解。它是通过主动的<strong>学习<\/strong>过程获得的，将我们接收到的信息片段整合进我们的活动世界模型。<\/p>\n<\/blockquote>\n<p>通常，我们不会严格定义知识，而是通过<a href=\"https://en.wikipedia.org/wiki/DIKW_pyramid\">DIKW金字塔<\/a>将其与其他相关概念对齐。它包含以下概念：<\/p>\n<ul>\n<li><strong>数据<\/strong>是以物理媒介表示的事物，如书面文字或口语。数据独立于人类存在，可以在人与人之间传递。<\/li>\n<li><strong>信息<\/strong>是我们头脑中对数据的解释。例如，当我们听到“计算机”这个词时，我们对它有一定理解。<\/li>\n<li><strong>知识<\/strong>是信息被整合进我们的世界模型。例如，一旦我们了解计算机是什么，我们便开始对它的工作原理、价格及用途有一些想法。这些相互关联的概念网络构成了我们的知识。<\/li>\n<li><strong>智慧<\/strong>是我们对世界理解的更高层次，代表<em>元知识<\/em>，例如关于知识何时及如何使用的某种认知。<\/li>\n<\/ul>\n<p><img src=\"../translated_images/zh-CN/DIKW_Pyramid.94126f7d2bd8db5b.webp\" width=\"30%\"/><\/p>\n<p><em>图片来自<a href=\"https://commons.wikimedia.org/w/index.php?curid=37705247\">维基百科<\/a>，作者Longlivetheux，CC BY-SA 4.0<\/em><\/p>\n<p>因此，<strong>知识表示<\/strong>的问题是找到一种有效方式，将知识以数据形式表示于计算机内部，使其能被自动使用。这可以看作一个光谱：<\/p>\n<p><img alt=\"知识表示光谱\" src=\"../translated_images/zh-CN/knowledge-spectrum.b60df631852c0217.webp\" /><\/p>\n<blockquote>\n<p>图片来自 <a href=\"http://soshnikov.com\">Dmitry Soshnikov<\/a><\/p>\n<\/blockquote>\n<ul>\n<li>在左侧，是计算机能够有效使用的非常简单的知识表示类型。最简单的是算法式，知识由计算机程序表示。然而，这不是最佳的知识表示方式，因为它不够灵活。我们头脑中的知识往往是非算法的。<\/li>\n<li>在右侧，是自然文本这类表示手段。它最强大，但无法用于自动推理。<\/li>\n<\/ul>\n<blockquote>\n<p>✅ 花一分钟思考你是如何在头脑中表示知识并转化为笔记的。有哪种格式对你来说特别有效，有助于记忆？<\/p>\n<\/blockquote>\n<h2>计算机知识表示分类<\/h2>\n<p>我们可以将不同的计算机知识表示方法分为以下几类：<\/p>\n<ul>\n<li><strong>网络表示<\/strong>基于我们头脑中存在一个相互关联的概念网络。我们可以尝试在计算机中以图的形式重现同样的网络——所谓的<strong>语义网络<\/strong>。<\/li>\n<\/ul>\n<ol>\n<li><strong>对象-属性-值三元组<\/strong>或<strong>属性-值对<\/strong>。由于图可以被表示为计算机中的节点和边列表，我们可以用一个三元组列表表示语义网络，三元组包含对象、属性和值。例如，我们构建以下关于编程语言的三元组：<\/li>\n<\/ol>\n<table>\n<thead>\n<tr>\n<th>对象<\/th>\n<th>属性<\/th>\n<th>值<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Python<\/td>\n<td>is<\/td>\n<td>Untyped-Language<\/td>\n<\/tr>\n<tr>\n<td>Python<\/td>\n<td>invented-by<\/td>\n<td>Guido van Rossum<\/td>\n<\/tr>\n<tr>\n<td>Python<\/td>\n<td>block-syntax<\/td>\n<td>indentation<\/td>\n<\/tr>\n<tr>\n<td>Untyped-Language<\/td>\n<td>doesn't have<\/td>\n<td>type definitions<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>✅ 思考三元组如何用来表示其他类型的知识。<\/p>\n<\/blockquote>\n<ol start=\"2\">\n<li><strong>层次表示<\/strong>强调我们头脑中常常构建一个对象层次。例如，我们知道金丝雀是鸟，而所有鸟都有翅膀。我们还对金丝雀通常的颜色和飞行速度有所了解。<\/li>\n<\/ol>\n<ul>\n<li><strong>框架表示<\/strong>基于将每个对象或对象类表示为包含<strong>槽位<\/strong>的<strong>框架<\/strong>。槽位有可能的默认值、值的限制或可以调用的存储过程以获得槽位的值。所有框架形成一个类似面向对象编程语言中的对象层次。<\/li>\n<li><strong>场景<\/strong>是一种特殊的框架，表示可以随时间展开的复杂情境。<\/li>\n<\/ul>\n<p><strong>Python<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>槽位<\/th>\n<th>值<\/th>\n<th>默认值<\/th>\n<th>范围<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>名称<\/td>\n<td>Python<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>类别<\/td>\n<td>Untyped-Language<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>变量大小写<\/td>\n<td><\/td>\n<td>CamelCase<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>程序长度<\/td>\n<td><\/td>\n<td><\/td>\n<td>5-5000 行<\/td>\n<\/tr>\n<tr>\n<td>块语法<\/td>\n<td>缩进<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ol start=\"3\">\n<li>\n<p><strong>过程表示<\/strong>基于通过一系列条件发生时可执行的动作列表来表示知识。\n   - 产生规则是允许我们得出结论的 if-then 语句。例如，医生可能有规则说<strong>如果<\/strong>病人有高烧<strong>或<\/strong>血液检测中C-反应蛋白含量高**，那么病人有炎症。一旦遇到其中一个条件，我们就可以得出炎症结论，并在进一步推理中使用。\n   - 算法可以被认为是过程表示的另一种形式，尽管它们几乎从不直接用于基于知识的系统。<\/p>\n<\/li>\n<li>\n<p><strong>逻辑<\/strong>最初由亚里士多德提出，作为表示普遍人类知识的方法。\n   - 谓词逻辑作为数学理论过于丰富，无法计算，因此通常使用其某个子集，如在Prolog中使用的Horn子句。\n   - 描述逻辑是一族逻辑系统，用于表示和推理对象层次及分布式知识表示，如<em>语义网<\/em>。<\/p>\n<\/li>\n<\/ol>\n<h2>专家系统<\/h2>\n<p>符号人工智能的早期成功之一是所谓的<strong>专家系统<\/strong>——设计用来在有限问题领域充当专家的计算机系统。它们基于从一个或多个专家处提取的<strong>知识库<\/strong>，并包含一个在其上执行推理的<strong>推理引擎<\/strong>。<\/p>\n<table>\n<thead>\n<tr>\n<th><img alt=\"人类结构\" src=\"../translated_images/zh-CN/arch-human.5d4d35f1bba3ab1c.webp\" /><\/th>\n<th><img alt=\"基于知识的系统\" src=\"../translated_images/zh-CN/arch-kbs.3ec5c150b09fa8da.webp\" /><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>人类神经系统简化结构<\/td>\n<td>基于知识的系统架构<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>专家系统构建类似人类推理系统，包含<strong>短期记忆<\/strong>和<strong>长期记忆<\/strong>。类似地，在基于知识的系统中我们区分以下组成部分：<\/p>\n<ul>\n<li><strong>问题记忆<\/strong>：包含当前正在解决问题的知识，即患者的体温或血压、是否有炎症等。这也称为<strong>静态知识<\/strong>，因为它包含我们当前对问题的快照——所谓的<em>问题状态<\/em>。<\/li>\n<li><strong>知识库<\/strong>：代表问题领域的长期知识。它从人类专家手动提取，在每次咨询间不变。由于它允许我们从一个问题状态导航到另一个状态，也称为<strong>动态知识<\/strong>。<\/li>\n<li><strong>推理引擎<\/strong>：协调整个在问题状态空间的搜索过程，必要时向用户提问。它还负责找到适用于每个状态的规则。<\/li>\n<\/ul>\n<p>例如，考虑一个基于动物物理特征决定动物种类的专家系统：<\/p>\n<p><img alt=\"与-或树\" src=\"../translated_images/zh-CN/AND-OR-Tree.5592d2c70187f283.webp\" /><\/p>\n<blockquote>\n<p>图片来自 <a href=\"http://soshnikov.com\">Dmitry Soshnikov<\/a><\/p>\n<\/blockquote>\n<p>该图称为<strong>与-或树<\/strong>，是产生规则集合的图形表示。绘制树在提取专家知识初期十分有用。为了在计算机内表示知识，更方便用规则表示：<\/p>\n<pre><code>IF the animal eats meat\nOR (animal has sharp teeth\n    AND animal has claws\n    AND animal has forward-looking eyes\n) \nTHEN the animal is a carnivore\n<\/code><\/pre>\n<p>你可以注意到，规则左侧的每一个条件和动作本质上是对象-属性-值（OAV）三元组。<strong>工作内存<\/strong>包含与当前解决问题相关的OAV三元组集合。<strong>规则引擎<\/strong>寻找满足条件的规则并应用它们，向工作内存添加新的三元组。<\/p>\n<blockquote>\n<p>✅ 自己绘制一个你喜欢主题的与-或树吧！<\/p>\n<\/blockquote>\n<h3>前向推理与后向推理<\/h3>\n<p>上述过程称为<strong>前向推理<\/strong>。它从工作内存中关于问题的初始数据开始，然后执行以下推理循环：<\/p>\n<ol>\n<li>如果目标属性已在工作内存中——停止并给出结果<\/li>\n<li>找出所有条件当前满足的规则——获得<strong>冲突集<\/strong>规则<\/li>\n<li>执行<strong>冲突解决<\/strong>——选出本步将执行的一条规则。冲突解决有不同策略：\n   - 选择知识库中第一个适用规则\n   - 随机选择规则\n   - 选择<em>更具体<\/em>规则，即“左侧”（LHS）条件满足最多的规则<\/li>\n<li>应用选中规则，向问题状态插入新知识<\/li>\n<li>从步骤1重复<\/li>\n<\/ol>\n<p>但在某些情况下，我们可能希望以对问题一无所知开始，提出帮助得出结论的问题。例如，在医学诊断中，一般不会先做完所有检查再诊断患者，而是在需要决策时做检查。<\/p>\n<p>该过程可用<strong>后向推理<\/strong>建模。它由<strong>目标<\/strong>驱动——我们想找到的属性值：<\/p>\n<ol>\n<li>选择所有能给出目标值的规则（即目标在右侧，RHS）——冲突集<\/li>\n<li>如果该属性无规则或有规则指出需向用户询问值——则询问，否则：<\/li>\n<li>使用冲突解决策略选择一条将用作<em>假设<\/em>的规则——尝试证明该规则<\/li>\n<li>递归地对规则左侧所有属性重复该过程，尝试将它们视为目标证明<\/li>\n<li>如果任何步骤失败——回到步骤3选用另一规则<\/li>\n<\/ol>\n<blockquote>\n<p>✅ 何种情形下前向推理更合适？后向推理呢？<\/p>\n<\/blockquote>\n<h3>实现专家系统<\/h3>\n<p>专家系统可使用不同工具实现：<\/p>\n<ul>\n<li>直接用某高级编程语言编写。通常不是最佳选择，因为知识库系统的主要优势是知识和推理分离，领域专家理应能编写规则而不必懂推理细节。<\/li>\n<li>使用<strong>专家系统壳<\/strong>，即专门设计用于通过某些知识表示语言填充知识的系统。<\/li>\n<\/ul>\n<h2>✍️ 练习：动物推理<\/h2>\n<p>参见 <a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/2-Symbolic/Animals.ipynb\">Animals.ipynb<\/a> ，示例实现了前向和后向推理专家系统。<\/p>\n<blockquote>\n<p><strong>备注<\/strong>：本例较为简单，仅展示专家系统基本样貌。只有当规则数量达到一定量（约200条以上）时，系统才会表现出某种<em>智能<\/em>行为。规则过多时，难以一一记住，此时你可能开始怀疑系统为何做出某些决策。但基于知识系统的关键特点是你总能<em>解释<\/em>任何决策是如何作出的。<\/p>\n<\/blockquote>\n<h2>本体论与语义网<\/h2>\n<p>20世纪末，曾有一项倡议利用知识表示对互联网资源进行注释，以便能够找到符合非常具体查询的资源。该倡议称为<strong>语义网<\/strong>，依赖以下几个概念：<\/p>\n<ul>\n<li>基于<strong><a href=\"https://en.wikipedia.org/wiki/Description_logic\">描述逻辑<\/a><\/strong>（DL）的一种特殊知识表示。它类似框架知识表示，因为它建立含属性对象的层次，但具有形式逻辑语义和推理。存在一整个DL家族，在表达能力与推理算法复杂度之间进行平衡。<\/li>\n<li>分布式知识表示，其中所有概念由全局URI标识符表示，能够创建跨互联网的知识层次。<\/li>\n<li>一个基于 XML 的知识描述语言家族：RDF（资源描述框架）、RDFS（RDF 词汇表）、OWL（本体网络语言）。<\/li>\n<\/ul>\n<p>语义网的核心概念之一是<strong>本体<\/strong>。它指的是使用某种形式化知识表示对问题领域的明确说明。最简单的本体可以只是问题领域中对象的层次结构，但更复杂的本体会包含可用于推理的规则。<\/p>\n<p>在语义网中，所有表示均基于三元组。每个对象和每个关系都由 URI 唯一标识。例如，如果我们想陈述这个 AI 课程是由 Dmitry Soshnikov 于 2022 年 1 月 1 日开发的事实——我们可以使用以下三元组：<\/p>\n<p><img src=\"../translated_images/zh-CN/triplet.4b9b332587593298.webp\" width=\"30%\"/><\/p>\n<pre><code>http://github.com/microsoft/ai-for-beginners http://www.example.com/terms/creation-date “Jan 1, 2022”\nhttp://github.com/microsoft/ai-for-beginners http://purl.org/dc/elements/1.1/creator http://soshnikov.com\n<\/code><\/pre>\n<blockquote>\n<p>✅ 这里 <code>http://www.example.com/terms/creation-date<\/code> 和 <code>http://purl.org/dc/elements/1.1/creator<\/code> 是表达<em>创建者<\/em>和<em>创建日期<\/em>概念的一些广为人知且被普遍接受的 URI。<\/p>\n<\/blockquote>\n<p>在更复杂的情况下，如果我们想定义一个创建者列表，可以使用 RDF 中定义的一些数据结构。<\/p>\n<p><img src=\"../translated_images/zh-CN/triplet-complex.32094972c7b4441b.webp\" width=\"40%\"/><\/p>\n<blockquote>\n<p>上图由 <a href=\"http://soshnikov.com\">Dmitry Soshnikov<\/a> 绘制<\/p>\n<\/blockquote>\n<p>语义网建设的进展在某种程度上被搜索引擎和自然语言处理技术的发展减缓了，这些技术可以从文本中提取结构化数据。然而，在某些领域，仍然有大量工作致力于维护本体和知识库。一些值得关注的项目：<\/p>\n<ul>\n<li><a href=\"https://wikidata.org/\">WikiData<\/a> 是一个与维基百科关联的机器可读知识库集合。大部分数据来自维基百科的 <em>信息框<\/em>，即维基百科页面内的结构化内容。你可以用专门为语义网设计的查询语言 SPARQL 来<a href=\"https://query.wikidata.org/\">查询<\/a> wikidata。这里是一个示例查询，显示人类中最常见的眼睛颜色：<\/li>\n<\/ul>\n<pre><code class=\"language-sparql\">#defaultView:BubbleChart\nSELECT ?eyeColorLabel (COUNT(?human) AS ?count)\nWHERE\n{\n  ?human wdt:P31 wd:Q5.       # human instance-of homo sapiens\n  ?human wdt:P1340 ?eyeColor. # human eye-color ?eyeColor\n  SERVICE wikibase:label { bd:serviceParam wikibase:language &quot;en&quot;. }\n}\nGROUP BY ?eyeColorLabel\n<\/code><\/pre>\n<ul>\n<li><a href=\"https://www.dbpedia.org/\">DBpedia<\/a> 是另一个类似 WikiData 的项目。<\/li>\n<\/ul>\n<blockquote>\n<p>✅ 如果你想试验构建自己的本体，或者打开已有本体，有一个很棒的图形化本体编辑器叫做 <a href=\"https://protege.stanford.edu/\">Protégé<\/a>。下载它，或者在线使用。<\/p>\n<\/blockquote>\n<p><img src=\"../translated_images/zh-CN/protege.274177ceeac13b38.webp\" width=\"70%\"/><\/p>\n<p><em>Web Protégé 编辑器打开了罗曼诺夫家族的本体。截屏来自 Dmitry Soshnikov<\/em><\/p>\n<h2>✍️ 练习：家族本体<\/h2>\n<p>参见 <a href=\"https://github.com/Ezana135/AI-For-Beginners/blob/main/lessons/2-Symbolic/FamilyOntology.ipynb\">FamilyOntology.ipynb<\/a>，该示例演示了如何使用语义网技术对家庭关系进行推理。我们将使用常见的 GEDCOM 格式表示的家谱和家族关系本体，构建给定个体集合的所有家族关系图。<\/p>\n<h2>微软概念图<\/h2>\n<p>大多数情况下，本体都是精心手工创建的。然而，也可以从非结构化数据中<strong>挖掘<\/strong>本体，例如来自自然语言文本。<\/p>\n<p>微软研究院曾做过这样的尝试，产出了<a href=\"https://blogs.microsoft.com/ai/microsoft-researchers-release-graph-that-helps-machines-conceptualize/?WT.mc_id=academic-77998-cacaste\">微软概念图<\/a>。<\/p>\n<p>它是一个以 <code>is-a<\/code> 继承关系分组的大型实体集合。它可以回答诸如“微软是什么？”的问题——答案类似于“微软是一家公司，概率为 0.87，同时也是一个品牌，概率为 0.75”。<\/p>\n<p>该图谱既可通过 REST API 访问，也可以作为一个大型可下载文本文件列出所有实体对。<\/p>\n<h2>✍️ 练习：概念图<\/h2>\n<p>尝试 <a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/2-Symbolic/MSConceptGraph.ipynb\">MSConceptGraph.ipynb<\/a> 笔记本，看看我们如何使用微软概念图将新闻文章分到几个类别中。<\/p>\n<h2>结论<\/h2>\n<p>如今，人工智能常被认为是<em>机器学习<\/em>或<em>神经网络<\/em>的同义词。然而，人类也表现出明确的推理能力，而这正是当前神经网络尚未处理的内容。在实际项目中，明确推理仍然用于执行需要解释或能控制修改系统行为的任务。<\/p>\n<h2>🚀 挑战<\/h2>\n<p>本节课对应的家族本体笔记本中，提供了试验其他家族关系的机会。尝试发现家谱中人们之间的新联系。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/4\">课后测验<\/a><\/h2>\n<h2>复习与自学<\/h2>\n<p>在网上做些研究，了解人类尝试量化和编码知识的领域。看看布鲁姆的认知分类法，回顾人类历史上如何试图理解他们的世界。探索林奈创建生物分类法的工作，观察门捷列夫如何创建化学元素的描述和分类方法。你还能发现哪些有趣的例子？<\/p>\n<p><strong>作业<\/strong>: <a href=\"#/doc/lessons/2-Symbolic/assignment.md\">构建本体<\/a><\/p>\n<hr />\n<!-- CO-OP TRANSLATOR DISCLAIMER START -->\n<p><strong>免责声明<\/strong>：<br />\n本文件已使用AI翻译服务<a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a>进行翻译。虽然我们努力保证准确性，但请注意自动翻译可能存在错误或不准确之处。原始文件的母语版本应被视为权威来源。对于重要信息，建议采用专业人工翻译。我们不对因使用本翻译而产生的任何误解或误释承担责任。<\/p>\n<!-- CO-OP TRANSLATOR DISCLAIMER END -->"},"lessons/2-Symbolic/assignment.md":{"t":"第2章 · 符号 AI · 作业","h":"<h1>构建本体<\/h1>\n<p>构建知识库的核心是对一个主题的事实进行分类建模。选择一个主题——比如一个人、一个地方或一个事物——然后为该主题构建一个模型。使用本课中描述的一些技术和建模策略。例如，可以创建一个包含家具、灯具等的客厅本体。客厅与厨房有什么不同？浴室呢？你如何判断这是一个客厅而不是餐厅？使用 <a href=\"https://protege.stanford.edu/\">Protégé<\/a> 来构建你的本体。<\/p>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原文档的原始语言版本为权威来源。对于关键信息，建议使用专业人工翻译。我们对因使用此翻译而引起的任何误解或误读不承担责任。<\/p>"},"lessons/3-NeuralNetworks/README.md":{"t":"神经网络简介","h":"<h1>神经网络简介<\/h1>\n<p><img alt=\"神经网络内容总结涂鸦\" src=\"../translated_images/zh-CN/ai-neuralnetworks.1c687ae40bc86e83.webp\" /><\/p>\n<p>正如我们在介绍中讨论的那样，实现智能的一种方法是训练一个<strong>计算机模型<\/strong>或一个<strong>人工大脑<\/strong>。自20世纪中期以来，研究人员尝试了各种数学模型，直到近年来，这一方向取得了巨大的成功。这些大脑的数学模型被称为<strong>神经网络<\/strong>。<\/p>\n<blockquote>\n<p>有时神经网络被称为<em>人工神经网络<\/em>（Artificial Neural Networks，ANNs），以表明我们讨论的是模型，而不是真实的神经元网络。<\/p>\n<\/blockquote>\n<h2>机器学习<\/h2>\n<p>神经网络属于一个更大的学科，称为<strong>机器学习<\/strong>，其目标是利用数据训练计算机模型，使其能够解决问题。机器学习是人工智能的重要组成部分，但我们在本课程中不涉及经典的机器学习内容。<\/p>\n<blockquote>\n<p>请访问我们的独立课程 <strong><a href=\"http://github.com/microsoft/ml-for-beginners\">机器学习入门<\/a><\/strong>，了解更多关于经典机器学习的内容。<\/p>\n<\/blockquote>\n<p>在机器学习中，我们假设有一些示例数据集 <strong>X<\/strong> 和对应的输出值 <strong>Y<\/strong>。示例通常是由<strong>特征<\/strong>组成的N维向量，而输出被称为<strong>标签<\/strong>。<\/p>\n<p>我们将讨论两种最常见的机器学习问题：<\/p>\n<ul>\n<li><strong>分类<\/strong>：需要将输入对象分类到两个或多个类别中。<\/li>\n<li><strong>回归<\/strong>：需要为每个输入样本预测一个数值。<\/li>\n<\/ul>\n<blockquote>\n<p>当将输入和输出表示为张量时，输入数据集是一个大小为 M&times;N 的矩阵，其中 M 是样本数量，N 是特征数量。输出标签 Y 是一个大小为 M 的向量。<\/p>\n<\/blockquote>\n<p>在本课程中，我们将仅关注神经网络模型。<\/p>\n<h2>神经元的模型<\/h2>\n<p>从生物学中我们知道，大脑由神经细胞（神经元）组成，每个神经元有多个“输入”（树突）和一个“输出”（轴突）。树突和轴突都可以传导电信号，它们之间的连接——称为突触——可以表现出不同程度的导电性，这种导电性由神经递质调节。<\/p>\n<table>\n<thead>\n<tr>\n<th><img alt=\"神经元模型\" src=\"../translated_images/zh-CN/synapse-wikipedia.ed20a9e4726ea1c6.webp\" /><\/th>\n<th><img alt=\"神经元模型\" src=\"../translated_images/zh-CN/artneuron.1a5daa88d20ebe6f.webp\" /><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>真实神经元 <em>（<a href=\"https://en.wikipedia.org/wiki/Synapse#/media/File:SynapseSchematic_lines.svg\">图片<\/a>来自维基百科）<\/em><\/td>\n<td>人工神经元 <em>（作者提供图片）<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>因此，神经元的最简单数学模型包含若干输入 X<sub>1<\/sub>, ..., X<sub>N<\/sub> 和一个输出 Y，以及一系列权重 W<sub>1<\/sub>, ..., W<sub>N<\/sub>。输出的计算公式为：<\/p>\n<p><img src=\"../translated_images/zh-CN/netout.1eb15eb76fd76731.webp\" alt=\"Y = f\\left(\\sum_{i=1}^N X_iW_i\\right)\" width=\"131\" height=\"53\" align=\"center\"/><\/p>\n<p>其中 f 是某种非线性的<strong>激活函数<\/strong>。<\/p>\n<blockquote>\n<p>早期的神经元模型在 Warren McCullock 和 Walter Pitts 于1943年发表的经典论文 <a href=\"https://www.cs.cmu.edu/~./epxing/Class/10715/reading/McCulloch.and.Pitts.pdf\">《A logical calculus of the ideas immanent in nervous activity》<\/a> 中被描述。Donald Hebb 在他的书《<a href=\"https://books.google.com/books?id=VNetYrB8EBoC\">The Organization of Behavior: A Neuropsychological Theory<\/a>》中提出了训练这些网络的方法。<\/p>\n<\/blockquote>\n<h2>本节内容<\/h2>\n<p>在本节中，我们将学习以下内容：\n* <a href=\"#/doc/lessons/3-NeuralNetworks/03-Perceptron/README.md\">感知器<\/a>：最早的用于二分类的神经网络模型之一\n* <a href=\"#/doc/lessons/3-NeuralNetworks/04-OwnFramework/README.md\">多层网络<\/a>：以及配套的笔记本 <a href=\"../translations/zh-CN/lessons/3-NeuralNetworks/04-OwnFramework/OwnFramework.ipynb\">如何构建我们自己的框架<\/a>\n* <a href=\"#/doc/lessons/3-NeuralNetworks/05-Frameworks/README.md\">神经网络框架<\/a>：包括以下笔记本：<a href=\"../translations/zh-CN/lessons/3-NeuralNetworks/05-Frameworks/IntroPyTorch.ipynb\">PyTorch<\/a> 和 <a href=\"../translations/zh-CN/lessons/3-NeuralNetworks/05-Frameworks/IntroKerasTF.ipynb\">Keras/Tensorflow<\/a>\n* <a href=\"https://raw.githubusercontent.com/songbing1521/AI-For-Beginners-zh-CN/main/lessons/3-NeuralNetworks/05-Frameworks\">过拟合<\/a><\/p>\n<hr />\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。原始语言的文档应被视为权威来源。对于关键信息，建议使用专业人工翻译。我们不对因使用此翻译而产生的任何误解或误读承担责任。<\/p>"},"lessons/3-NeuralNetworks/03-Perceptron/README.md":{"t":"神经网络入门：感知机","h":"<h1>神经网络入门：感知机<\/h1>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/5\">课前测验<\/a><\/h2>\n<p>1957年，康奈尔航空实验室的Frank Rosenblatt首次尝试实现类似现代神经网络的模型。这是一种名为“Mark-1”的硬件实现，设计用于识别简单的几何图形，例如三角形、正方形和圆形。<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><img src='../translated_images/zh-CN/Rosenblatt-wikipedia.294821b285ac796d.webp' alt='Frank Rosenblatt'/><\/td>\n<td><img src='../translated_images/zh-CN/Mark_I_perceptron_wikipedia.1f84eaa2d4b76ec9.webp' alt='The Mark 1 Perceptron' /><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>图片来源：<a href=\"https://en.wikipedia.org/wiki/Perceptron\">维基百科<\/a><\/p>\n<\/blockquote>\n<p>输入图像由20x20的光电池阵列表示，因此神经网络有400个输入和一个二进制输出。一个简单的网络包含一个神经元，也称为<strong>阈值逻辑单元<\/strong>。神经网络的权重类似于电位器，在训练阶段需要手动调整。<\/p>\n<blockquote>\n<p>✅ 电位器是一种允许用户调整电路电阻的设备。<\/p>\n<p>《纽约时报》当时对感知机的报道是：<em>一种电子计算机的胚胎，[海军]期望它能够行走、说话、看见、写作、自我复制并意识到自己的存在。<\/em><\/p>\n<\/blockquote>\n<h2>感知机模型<\/h2>\n<p>假设我们的模型有N个特征，那么输入向量将是一个大小为N的向量。感知机是一种<strong>二分类<\/strong>模型，即它可以区分两类输入数据。我们假设对于每个输入向量x，感知机的输出将是+1或-1，具体取决于类别。输出通过以下公式计算：<\/p>\n<p>y(x) = f(w<sup>T<\/sup>x)<\/p>\n<p>其中f是一个阶跃激活函数<\/p>\n<!-- img src=\"http://www.sciweavers.org/tex2img.php?eq=f%28x%29%20%3D%20%5Cbegin%7Bcases%7D%0A%20%20%20%20%20%20%20%20%20%2B1%20%26%20x%20%5Cgeq%200%20%5C%5C%0A%20%20%20%20%20%20%20%20%20-1%20%26%20x%20%3C%200%0A%20%20%20%20%20%20%20%5Cend%7Bcases%7D%20%5C%5C%0A&bc=White&fc=Black&im=jpg&fs=12&ff=arev&edit=0\" align=\"center\" border=\"0\" alt=\"f(x) = \\begin{cases} +1 & x \\geq 0 \\\\ -1 & x < 0 \\end{cases} \\\\\" width=\"154\" height=\"50\" / -->\n<p><img src=\"../translated_images/zh-CN/activation-func.b4924007c7ce7764.webp\"/><\/p>\n<h2>训练感知机<\/h2>\n<p>为了训练感知机，我们需要找到一个权重向量w，使得大多数值能够被正确分类，即使<strong>误差<\/strong>最小化。这个误差E通过<strong>感知机准则<\/strong>定义如下：<\/p>\n<p>E(w) = -&sum;w<sup>T<\/sup>x<sub>i<\/sub>t<sub>i<\/sub><\/p>\n<p>其中：<\/p>\n<ul>\n<li>求和是在那些导致错误分类的训练数据点i上进行的<\/li>\n<li>x<sub>i<\/sub>是输入数据，t<sub>i<\/sub>对于负样本是-1，对于正样本是+1。<\/li>\n<\/ul>\n<p>这个准则被视为权重w的函数，我们需要对其进行最小化。通常使用一种称为<strong>梯度下降<\/strong>的方法，我们从一些初始权重w<sup>(0)<\/sup>开始，然后在每一步根据以下公式更新权重：<\/p>\n<p>w<sup>(t+1)<\/sup> = w<sup>(t)<\/sup> - &eta;&nabla;E(w)<\/p>\n<p>这里&eta;是所谓的<strong>学习率<\/strong>，&nabla;E(w)表示E的<strong>梯度<\/strong>。计算梯度后，我们得到：<\/p>\n<p>w<sup>(t+1)<\/sup> = w<sup>(t)<\/sup> + &sum;&eta;x<sub>i<\/sub>t<sub>i<\/sub><\/p>\n<p>Python中的算法如下：<\/p>\n<pre><code class=\"language-python\">def train(positive_examples, negative_examples, num_iterations = 100, eta = 1):\n\n    weights = [0,0,0] # Initialize weights (almost randomly :)\n\n    for i in range(num_iterations):\n        pos = random.choice(positive_examples)\n        neg = random.choice(negative_examples)\n\n        z = np.dot(pos, weights) # compute perceptron output\n        if z &lt; 0: # positive example classified as negative\n            weights = weights + eta*weights.shape\n\n        z  = np.dot(neg, weights)\n        if z &gt;= 0: # negative example classified as positive\n            weights = weights - eta*weights.shape\n\n    return weights\n<\/code><\/pre>\n<h2>总结<\/h2>\n<p>在本课中，你学习了感知机，这是一种二分类模型，并了解了如何通过使用权重向量来训练它。<\/p>\n<h2>🚀 挑战<\/h2>\n<p>如果你想尝试构建自己的感知机，可以试试<a href=\"https://docs.microsoft.com/en-us/azure/machine-learning/component-reference/two-class-averaged-perceptron?WT.mc_id=academic-77998-cacaste\">Microsoft Learn上的这个实验<\/a>，它使用了<a href=\"https://docs.microsoft.com/en-us/azure/machine-learning/concept-designer?WT.mc_id=academic-77998-cacaste\">Azure ML设计器<\/a>。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/6\">课后测验<\/a><\/h2>\n<h2>复习与自学<\/h2>\n<p>要了解如何使用感知机解决一个简单问题以及实际问题，并继续学习，请查看<a href=\"../translations/zh-CN/lessons/3-NeuralNetworks/03-Perceptron/Perceptron.ipynb\">感知机<\/a>笔记本。<\/p>\n<p>这里还有一篇有趣的<a href=\"https://towardsdatascience.com/what-is-a-perceptron-basics-of-neural-networks-c4cfea20c590\">关于感知机的文章<\/a>。<\/p>\n<h2><a href=\"#/doc/lessons/3-NeuralNetworks/03-Perceptron/lab/README.md\">作业<\/a><\/h2>\n<p>在本课中，我们实现了一个用于二分类任务的感知机，并使用它来区分两个手写数字。在本实验中，你需要完全解决数字分类问题，即确定给定图像最可能对应的数字。<\/p>\n<ul>\n<li><a href=\"#/doc/lessons/3-NeuralNetworks/03-Perceptron/lab/README.md\">说明<\/a><\/li>\n<li><a href=\"../translations/zh-CN/lessons/3-NeuralNetworks/03-Perceptron/lab/PerceptronMultiClass.ipynb\">笔记本<\/a><\/li>\n<\/ul>\n<hr />"},"lessons/3-NeuralNetworks/03-Perceptron/lab/README.md":{"t":"神经网络入门：感知机 · 实验","h":"<h1>使用感知器进行多类别分类<\/h1>\n<p>来自 <a href=\"https://github.com/microsoft/ai-for-beginners\">AI for Beginners Curriculum<\/a> 的实验任务。<\/p>\n<h2>任务<\/h2>\n<p>利用我们在本课中开发的用于 MNIST 手写数字二分类的代码，创建一个能够识别任意数字的多类别分类器。计算训练集和测试集上的分类准确率，并打印出混淆矩阵。<\/p>\n<h2>提示<\/h2>\n<ol>\n<li>对于每个数字，创建一个用于二分类的 \"该数字 vs. 其他所有数字\" 的数据集。<\/li>\n<li>为二分类训练 10 个不同的感知器（每个数字对应一个）。<\/li>\n<li>定义一个函数，用于对输入数字进行分类。<\/li>\n<\/ol>\n<blockquote>\n<p><strong>提示<\/strong>：如果将所有 10 个感知器的权重组合成一个矩阵，我们可以通过一次矩阵乘法将所有 10 个感知器应用到输入数字上。然后，只需对输出应用 <code>argmax<\/code> 操作，就能找到最可能的数字。<\/p>\n<\/blockquote>\n<h2>起始笔记本<\/h2>\n<p>通过打开 <a href=\"../translations/zh-CN/lessons/3-NeuralNetworks/03-Perceptron/lab/PerceptronMultiClass.ipynb\">PerceptronMultiClass.ipynb<\/a> 开始实验。<\/p>\n<hr />\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务<a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a>进行翻译。尽管我们努力确保准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原始语言的文档作为权威来源。对于关键信息，建议使用专业人工翻译。因使用本翻译而导致的任何误解或误读，我们概不负责。<\/p>"},"lessons/3-NeuralNetworks/04-OwnFramework/README.md":{"t":"神经网络简介：多层感知机","h":"<h1>神经网络简介：多层感知机<\/h1>\n<p>在上一节中，你学习了最简单的神经网络模型——单层感知机，这是一种线性二分类模型。<\/p>\n<p>在本节中，我们将扩展这一模型，构建一个更灵活的框架，使我们能够：<\/p>\n<ul>\n<li>除了二分类，还能进行<strong>多分类<\/strong><\/li>\n<li>除了分类问题，还能解决<strong>回归问题<\/strong><\/li>\n<li>区分那些<strong>非线性可分<\/strong>的类别<\/li>\n<\/ul>\n<p>我们还将开发一个基于 Python 的模块化框架，用于构建不同的神经网络架构。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/7\">课前测验<\/a><\/h2>\n<h2>机器学习的形式化定义<\/h2>\n<p>让我们从形式化定义机器学习问题开始。假设我们有一个训练数据集 <strong>X<\/strong> 和对应的标签 <strong>Y<\/strong>，我们需要构建一个模型 <em>f<\/em>，以实现最准确的预测。预测的质量通过<strong>损失函数<\/strong> &lagran; 来衡量。以下是常用的损失函数：<\/p>\n<ul>\n<li>对于回归问题（需要预测一个数值），可以使用<strong>绝对误差<\/strong> &sum;<sub>i<\/sub>|f(x<sup>(i)<\/sup>)-y<sup>(i)<\/sup>|，或<strong>平方误差<\/strong> &sum;<sub>i<\/sub>(f(x<sup>(i)<\/sup>)-y<sup>(i)<\/sup>)<sup>2<\/sup><\/li>\n<li>对于分类问题，可以使用<strong>0-1损失<\/strong>（本质上等同于模型的<strong>准确率<\/strong>），或<strong>对数损失<\/strong>。<\/li>\n<\/ul>\n<p>对于单层感知机，函数 <em>f<\/em> 定义为线性函数 <em>f(x)=wx+b<\/em>（其中 <em>w<\/em> 是权重矩阵，<em>x<\/em> 是输入特征向量，<em>b<\/em> 是偏置向量）。对于不同的神经网络架构，这个函数可以具有更复杂的形式。<\/p>\n<blockquote>\n<p>在分类问题中，通常希望网络输出的是类别的概率。为了将任意数值转换为概率（例如对输出进行归一化），我们通常使用<strong>softmax<\/strong> 函数 &sigma;，此时函数 <em>f<\/em> 变为 <em>f(x)=&sigma;(wx+b)<\/em>。<\/p>\n<\/blockquote>\n<p>在上述 <em>f<\/em> 的定义中，<em>w<\/em> 和 <em>b<\/em> 被称为<strong>参数<\/strong> &theta;=⟨<em>w,b<\/em>⟩。给定数据集 ⟨<strong>X<\/strong>,<strong>Y<\/strong>⟩，我们可以将整个数据集上的总误差表示为参数 &theta; 的函数。<\/p>\n<blockquote>\n<p>✅ <strong>神经网络训练的目标是通过调整参数 &theta; 来最小化误差<\/strong><\/p>\n<\/blockquote>\n<h2>梯度下降优化<\/h2>\n<p>梯度下降是一种著名的函数优化方法。其核心思想是，我们可以计算损失函数相对于参数的导数（在多维情况下称为<strong>梯度<\/strong>），并调整参数以减少误差。其形式化过程如下：<\/p>\n<ul>\n<li>用一些随机值初始化参数 w<sup>(0)<\/sup>, b<sup>(0)<\/sup><\/li>\n<li>重复以下步骤多次：<ul>\n<li>w<sup>(i+1)<\/sup> = w<sup>(i)<\/sup>-&eta;&part;&lagran;/&part;w<\/li>\n<li>b<sup>(i+1)<\/sup> = b<sup>(i)<\/sup>-&eta;&part;&lagran;/&part;b<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p>在训练过程中，优化步骤通常是基于整个数据集计算的（记住，损失是通过所有训练样本的总和计算的）。然而，在实际操作中，我们会取数据集的小部分，称为<strong>小批量（minibatches）<\/strong>，并基于数据的子集计算梯度。由于每次随机选取子集，这种方法被称为<strong>随机梯度下降（SGD）<\/strong>。<\/p>\n<h2>多层感知机与反向传播<\/h2>\n<p>如上所述，单层网络能够对线性可分的类别进行分类。为了构建更复杂的模型，我们可以将多个网络层组合起来。从数学上讲，这意味着函数 <em>f<\/em> 将具有更复杂的形式，并通过以下几个步骤计算：\n* z<sub>1<\/sub>=w<sub>1<\/sub>x+b<sub>1<\/sub>\n* z<sub>2<\/sub>=w<sub>2<\/sub>&alpha;(z<sub>1<\/sub>)+b<sub>2<\/sub>\n* f = &sigma;(z<sub>2<\/sub>)<\/p>\n<p>这里，&alpha; 是一个<strong>非线性激活函数<\/strong>，&sigma; 是 softmax 函数，参数为 &theta;=&lt;<em>w<sub>1<\/sub>,b<sub>1<\/sub>,w<sub>2<\/sub>,b<sub>2<\/sub><\/em>&gt;。<\/p>\n<p>梯度下降算法保持不变，但计算梯度会更加复杂。根据链式求导法则，我们可以计算导数如下：<\/p>\n<ul>\n<li>&part;&lagran;/&part;w<sub>2<\/sub> = (&part;&lagran;/&part;&sigma;)(&part;&sigma;/&part;z<sub>2<\/sub>)(&part;z<sub>2<\/sub>/&part;w<sub>2<\/sub>)<\/li>\n<li>&part;&lagran;/&part;w<sub>1<\/sub> = (&part;&lagran;/&part;&sigma;)(&part;&sigma;/&part;z<sub>2<\/sub>)(&part;z<sub>2<\/sub>/&part;&alpha;)(&part;&alpha;/&part;z<sub>1<\/sub>)(&part;z<sub>1<\/sub>/&part;w<sub>1<\/sub>)<\/li>\n<\/ul>\n<blockquote>\n<p>✅ 链式求导法则用于计算损失函数相对于参数的导数。<\/p>\n<\/blockquote>\n<p>注意，这些表达式的最左部分是相同的，因此我们可以从损失函数开始，沿着计算图“向后”计算导数。因此，多层感知机的训练方法被称为<strong>反向传播（backpropagation）<\/strong>，简称“反向传播”。<\/p>\n<p><img alt=\"计算图\" src=\"../translated_images/zh-CN/ComputeGraphGrad.4626252c0de03507.webp\"/><\/p>\n<blockquote>\n<p>TODO: 图片引用<\/p>\n<p>✅ 我们将在随后的 notebook 示例中更详细地讲解反向传播。<\/p>\n<\/blockquote>\n<h2>总结<\/h2>\n<p>在本节课中，我们构建了自己的神经网络库，并将其用于一个简单的二维分类任务。<\/p>\n<h2>🚀 挑战<\/h2>\n<p>在配套的 notebook 中，你将实现自己的框架，用于构建和训练多层感知机。你将能够详细了解现代神经网络的运行方式。<\/p>\n<p>请前往 <a href=\"../translations/zh-CN/lessons/3-NeuralNetworks/04-OwnFramework/OwnFramework.ipynb\">OwnFramework<\/a> notebook 并完成相关内容。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/8\">课后测验<\/a><\/h2>\n<h2>复习与自学<\/h2>\n<p>反向传播是人工智能和机器学习中常用的算法，值得<a href=\"https://wikipedia.org/wiki/Backpropagation\">深入学习<\/a>。<\/p>\n<h2><a href=\"#/doc/lessons/3-NeuralNetworks/04-OwnFramework/lab/README.md\">作业<\/a><\/h2>\n<p>在本次实验中，你需要使用本节课中构建的框架来解决 MNIST 手写数字分类问题。<\/p>\n<ul>\n<li><a href=\"#/doc/lessons/3-NeuralNetworks/04-OwnFramework/lab/README.md\">实验说明<\/a><\/li>\n<li><a href=\"../translations/zh-CN/lessons/3-NeuralNetworks/04-OwnFramework/lab/MyFW_MNIST.ipynb\">Notebook<\/a><\/li>\n<\/ul>\n<hr />"},"lessons/3-NeuralNetworks/04-OwnFramework/lab/README.md":{"t":"神经网络简介：多层感知机 · 实验","h":"<h1>使用我们自己的框架进行MNIST分类<\/h1>\n<p>来自<a href=\"https://github.com/microsoft/ai-for-beginners\">AI初学者课程<\/a>的实验任务。<\/p>\n<h2>任务<\/h2>\n<p>使用1层、2层和3层感知器解决MNIST手写数字分类问题。使用我们在课程中开发的神经网络框架完成任务。<\/p>\n<h2>起始笔记本<\/h2>\n<p>通过打开<a href=\"https://raw.githubusercontent.com/songbing1521/AI-For-Beginners-zh-CN/main/lessons/3-NeuralNetworks/04-OwnFramework/lab/MyFW_MNIST.ipynb\">MyFW_MNIST.ipynb<\/a>开始实验。<\/p>\n<h2>问题<\/h2>\n<p>完成实验后，尝试回答以下问题：<\/p>\n<ul>\n<li>层间激活函数是否会影响网络性能？<\/li>\n<li>对于这个任务，我们是否需要2层或3层的网络？<\/li>\n<li>在训练网络时是否遇到任何问题？特别是在层数增加时。<\/li>\n<li>网络的权重在训练过程中如何变化？你可以绘制权重最大绝对值与训练轮次的关系图来理解它们之间的关系。<\/li>\n<\/ul>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原文档的原始语言版本为权威来源。对于关键信息，建议使用专业人工翻译。我们对于因使用此翻译而引起的任何误解或误读不承担责任。<\/p>"},"lessons/3-NeuralNetworks/05-Frameworks/README.md":{"t":"神经网络框架","h":"<h1>神经网络框架<\/h1>\n<p>正如我们已经学习到的，为了高效地训练神经网络，我们需要做到以下两点：<\/p>\n<ul>\n<li>操作张量，例如进行乘法、加法，以及计算一些函数如 sigmoid 或 softmax。<\/li>\n<li>计算所有表达式的梯度，以便执行梯度下降优化。<\/li>\n<\/ul>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/9\">课前测验<\/a><\/h2>\n<p>虽然 <code>numpy<\/code> 库可以完成第一部分，但我们还需要某种机制来计算梯度。在<a href=\"../translations/zh-CN/lessons/3-NeuralNetworks/04-OwnFramework/OwnFramework.ipynb\">我们之前开发的框架<\/a>中，我们必须手动在 <code>backward<\/code> 方法中编写所有的导数函数来实现反向传播。理想情况下，一个框架应该能够让我们计算<em>任何表达式<\/em>的梯度。<\/p>\n<p>另一个重要的事情是能够在 GPU 或其他专用计算单元（如 <a href=\"https://en.wikipedia.org/wiki/Tensor_Processing_Unit\">TPU<\/a>）上进行计算。深度神经网络的训练需要<em>大量<\/em>的计算，因此能够在 GPU 上并行化这些计算非常重要。<\/p>\n<blockquote>\n<p>✅ “并行化”一词指的是将计算分配到多个设备上。<\/p>\n<\/blockquote>\n<p>目前最流行的两个神经网络框架是：<a href=\"http://TensorFlow.org\">TensorFlow<\/a> 和 <a href=\"https://pytorch.org/\">PyTorch<\/a>。它们都提供了一个低级 API，用于在 CPU 和 GPU 上操作张量。在低级 API 之上，还有高级 API，分别是 <a href=\"https://keras.io/\">Keras<\/a> 和 <a href=\"https://pytorchlightning.ai/\">PyTorch Lightning<\/a>。<\/p>\n<table>\n<thead>\n<tr>\n<th>低级 API<\/th>\n<th><a href=\"http://TensorFlow.org\">TensorFlow<\/a><\/th>\n<th><a href=\"https://pytorch.org/\">PyTorch<\/a><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>高级 API<\/td>\n<td><a href=\"https://keras.io/\">Keras<\/a><\/td>\n<td><a href=\"https://pytorchlightning.ai/\">PyTorch Lightning<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>低级 API<\/strong> 允许你构建所谓的<strong>计算图<\/strong>。这个图定义了如何通过给定的输入参数计算输出（通常是损失函数），并且可以在 GPU 上运行计算（如果可用）。这些框架提供了对计算图进行微分以计算梯度的功能，这些梯度可以用于优化模型参数。<\/p>\n<p><strong>高级 API<\/strong> 将神经网络视为<strong>层的序列<\/strong>，使得构建大多数神经网络变得更加简单。训练模型通常只需要准备数据，然后调用一个 <code>fit<\/code> 函数即可完成。<\/p>\n<p>高级 API 允许你快速构建典型的神经网络，而无需担心许多细节。同时，低级 API 提供了对训练过程的更多控制，因此在研究新型神经网络架构时经常使用。<\/p>\n<p>需要注意的是，你可以同时使用这两种 API。例如，你可以使用低级 API 开发自己的网络层架构，然后将其嵌入到使用高级 API 构建和训练的更大网络中。或者，你可以使用高级 API 将网络定义为层的序列，然后使用自己的低级训练循环进行优化。这两种 API 使用相同的基本概念，并且设计为能够很好地协同工作。<\/p>\n<h2>学习<\/h2>\n<p>在本课程中，我们为 PyTorch 和 TensorFlow 提供了大部分内容。你可以选择自己喜欢的框架，只学习对应的笔记本。如果你不确定选择哪个框架，可以在网上查阅一些关于 <strong>PyTorch vs. TensorFlow<\/strong> 的讨论。你也可以同时了解这两个框架以获得更好的理解。<\/p>\n<p>在可能的情况下，我们会为了简化使用高级 API。然而，我们认为从基础上理解神经网络的工作原理非常重要，因此在开始时我们会从低级 API 和张量操作入手。不过，如果你想快速入门，不想花太多时间学习这些细节，可以直接跳到高级 API 的笔记本。<\/p>\n<h2>✍️ 练习：框架<\/h2>\n<p>通过以下笔记本继续学习：<\/p>\n<table>\n<thead>\n<tr>\n<th>低级 API<\/th>\n<th><a href=\"../translations/zh-CN/lessons/3-NeuralNetworks/05-Frameworks/IntroKerasTF.ipynb\">TensorFlow+Keras 笔记本<\/a><\/th>\n<th><a href=\"../translations/zh-CN/lessons/3-NeuralNetworks/05-Frameworks/IntroPyTorch.ipynb\">PyTorch<\/a><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>高级 API<\/td>\n<td><a href=\"../translations/zh-CN/lessons/3-NeuralNetworks/05-Frameworks/IntroKeras.ipynb\">Keras<\/a><\/td>\n<td><em>PyTorch Lightning<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>掌握这些框架后，我们将回顾过拟合的概念。<\/p>\n<h1>过拟合<\/h1>\n<p>过拟合是机器学习中一个极其重要的概念，理解它至关重要！<\/p>\n<p>考虑以下拟合 5 个点的问题（图中的 <code>x<\/code> 表示点）：<\/p>\n<table>\n<thead>\n<tr>\n<th><img alt=\"线性模型\" src=\"../translated_images/zh-CN/overfit1.f24b71c6f652e59e.webp\" /><\/th>\n<th><img alt=\"过拟合模型\" src=\"../translated_images/zh-CN/overfit2.131f5800ae10ca5e.webp\" /><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>线性模型，2 个参数<\/strong><\/td>\n<td><strong>非线性模型，7 个参数<\/strong><\/td>\n<\/tr>\n<tr>\n<td>训练误差 = 5.3<\/td>\n<td>训练误差 = 0<\/td>\n<\/tr>\n<tr>\n<td>验证误差 = 5.1<\/td>\n<td>验证误差 = 20<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>左图展示了一个良好的直线拟合。由于参数数量适当，模型正确捕捉了点的分布规律。<\/li>\n<li>右图中，模型过于强大。由于只有 5 个点，而模型有 7 个参数，它可以调整到通过所有点，使得训练误差为 0。然而，这阻止了模型理解数据背后的正确模式，因此验证误差非常高。<\/li>\n<\/ul>\n<p>在模型的复杂度（参数数量）和训练样本数量之间找到正确的平衡非常重要。<\/p>\n<h2>为什么会发生过拟合<\/h2>\n<ul>\n<li>训练数据不足<\/li>\n<li>模型过于强大<\/li>\n<li>输入数据中噪声过多<\/li>\n<\/ul>\n<h2>如何检测过拟合<\/h2>\n<p>从上图可以看出，过拟合可以通过非常低的训练误差和非常高的验证误差来检测。通常在训练过程中，我们会看到训练误差和验证误差都开始下降，但在某个点之后，验证误差可能停止下降并开始上升。这是过拟合的信号，表明我们可能应该停止训练（或者至少保存模型的快照）。<\/p>\n<p><img alt=\"过拟合\" src=\"../translated_images/zh-CN/Overfitting.408ad91cd90b4371.webp\" /><\/p>\n<h2>如何防止过拟合<\/h2>\n<p>如果你发现发生了过拟合，可以采取以下措施：<\/p>\n<ul>\n<li>增加训练数据量<\/li>\n<li>降低模型的复杂度<\/li>\n<li>使用一些<a href=\"#/doc/lessons/4-ComputerVision/08-TransferLearning/TrainingTricks.md\">正则化技术<\/a>，例如 <a href=\"#/doc/lessons/4-ComputerVision/08-TransferLearning/TrainingTricks.md\">Dropout<\/a>，我们将在后面讨论。<\/li>\n<\/ul>\n<h2>过拟合与偏差-方差权衡<\/h2>\n<p>过拟合实际上是统计学中一个更通用问题的特例，称为<a href=\"https://en.wikipedia.org/wiki/Bias%E2%80%93variance_tradeoff\">偏差-方差权衡<\/a>。如果我们考虑模型中可能的误差来源，可以看到两种类型的误差：<\/p>\n<ul>\n<li><strong>偏差误差<\/strong> 是由于算法无法正确捕捉训练数据之间的关系而引起的。这可能是因为模型不够强大（<strong>欠拟合<\/strong>）。<\/li>\n<li><strong>方差误差<\/strong> 是由于模型拟合了输入数据中的噪声而不是有意义的关系（<strong>过拟合<\/strong>）。<\/li>\n<\/ul>\n<p>在训练过程中，偏差误差会减少（因为模型学会了拟合数据），而方差误差会增加。为了防止过拟合，重要的是在适当的时候停止训练——可以手动（当我们检测到过拟合时）或自动（通过引入正则化）。<\/p>\n<h2>总结<\/h2>\n<p>在本课中，你学习了两个最流行的 AI 框架 TensorFlow 和 PyTorch 的不同 API。此外，你还学习了一个非常重要的话题——过拟合。<\/p>\n<h2>🚀 挑战<\/h2>\n<p>在配套的笔记本中，你会发现底部有“任务”；完成这些笔记本并完成任务。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/10\">课后测验<\/a><\/h2>\n<h2>复习与自学<\/h2>\n<p>研究以下主题：<\/p>\n<ul>\n<li>TensorFlow<\/li>\n<li>PyTorch<\/li>\n<li>过拟合<\/li>\n<\/ul>\n<p>问自己以下问题：<\/p>\n<ul>\n<li>TensorFlow 和 PyTorch 有什么区别？<\/li>\n<li>过拟合和欠拟合有什么区别？<\/li>\n<\/ul>\n<h2><a href=\"#/doc/lessons/3-NeuralNetworks/05-Frameworks/lab/README.md\">作业<\/a><\/h2>\n<p>在本实验中，你需要使用 PyTorch 或 TensorFlow 解决两个分类问题，分别使用单层和多层全连接网络。<\/p>\n<ul>\n<li><a href=\"#/doc/lessons/3-NeuralNetworks/05-Frameworks/lab/README.md\">说明<\/a><\/li>\n<li><a href=\"../translations/zh-CN/lessons/3-NeuralNetworks/05-Frameworks/lab/LabFrameworks.ipynb\">笔记本<\/a><\/li>\n<\/ul>\n<hr />"},"lessons/3-NeuralNetworks/05-Frameworks/lab/README.md":{"t":"神经网络框架 · 实验","h":"<h1>使用 PyTorch/TensorFlow 进行分类<\/h1>\n<p>来自 <a href=\"https://github.com/microsoft/ai-for-beginners\">AI for Beginners Curriculum<\/a> 的实验任务。<\/p>\n<h2>任务<\/h2>\n<p>使用 PyTorch 或 TensorFlow 解决两个分类问题，分别使用单层和多层全连接网络：<\/p>\n<ol>\n<li><strong><a href=\"https://en.wikipedia.org/wiki/Iris_flower_data_set\">鸢尾花分类<\/a><\/strong> 问题 - 一个具有表格输入数据的示例问题，可以通过经典机器学习方法处理。你的目标是根据 4 个数值参数将鸢尾花分类为 3 个类别。<\/li>\n<li><strong>MNIST<\/strong> 手写数字分类问题，我们之前已经见过。<\/li>\n<\/ol>\n<p>尝试不同的网络架构，以获得尽可能高的准确率。<\/p>\n<h2>起始笔记本<\/h2>\n<p>通过打开 <a href=\"https://raw.githubusercontent.com/songbing1521/AI-For-Beginners-zh-CN/main/lessons/3-NeuralNetworks/05-Frameworks/lab/LabFrameworks.ipynb\">LabFrameworks.ipynb<\/a> 开始实验。<\/p>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原文档的原始语言版本为权威来源。对于关键信息，建议使用专业人工翻译。我们对因使用此翻译而引起的任何误解或误读不承担责任。<\/p>"},"lessons/4-ComputerVision/README.md":{"t":"计算机视觉","h":"<h1>计算机视觉<\/h1>\n<p><img alt=\"计算机视觉内容总结涂鸦\" src=\"../translated_images/zh-CN/ai-computervision.6506ebebac3fbf76.webp\" /><\/p>\n<p>在本节中，我们将学习以下内容：<\/p>\n<ul>\n<li><a href=\"#/doc/lessons/4-ComputerVision/06-IntroCV/README.md\">计算机视觉和OpenCV简介<\/a><\/li>\n<li><a href=\"#/doc/lessons/4-ComputerVision/07-ConvNets/README.md\">卷积神经网络<\/a><\/li>\n<li><a href=\"#/doc/lessons/4-ComputerVision/08-TransferLearning/README.md\">预训练网络和迁移学习<\/a> <\/li>\n<li><a href=\"#/doc/lessons/4-ComputerVision/09-Autoencoders/README.md\">自编码器<\/a><\/li>\n<li><a href=\"#/doc/lessons/4-ComputerVision/10-GANs/README.md\">生成对抗网络<\/a><\/li>\n<li><a href=\"#/doc/lessons/4-ComputerVision/11-ObjectDetection/README.md\">目标检测<\/a><\/li>\n<li><a href=\"#/doc/lessons/4-ComputerVision/12-Segmentation/README.md\">语义分割<\/a><\/li>\n<\/ul>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务<a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a>进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原始语言的文档作为权威来源。对于关键信息，建议使用专业人工翻译。我们对因使用本翻译而引起的任何误解或误读不承担责任。<\/p>"},"lessons/4-ComputerVision/06-IntroCV/README.md":{"t":"计算机视觉简介","h":"<h1>计算机视觉简介<\/h1>\n<p><a href=\"https://wikipedia.org/wiki/Computer_vision\">计算机视觉<\/a> 是一个旨在让计算机能够对数字图像进行高层次理解的学科。这是一个非常广泛的定义，因为<em>理解<\/em>可以有很多不同的含义，包括在图片中找到一个物体（<strong>目标检测<\/strong>）、理解发生了什么（<strong>事件检测<\/strong>）、用文字描述图片，或者重建3D场景。此外，还有一些与人类图像相关的特殊任务：年龄和情绪估计、人脸检测与识别，以及3D姿态估计等。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/11\">课前测验<\/a><\/h2>\n<p>计算机视觉最简单的任务之一是<strong>图像分类<\/strong>。<\/p>\n<p>计算机视觉通常被认为是人工智能的一个分支。如今，大多数计算机视觉任务都是通过神经网络解决的。我们将在本节中学习一种专门用于计算机视觉的神经网络类型，<a href=\"#/doc/lessons/4-ComputerVision/07-ConvNets/README.md\">卷积神经网络<\/a>。<\/p>\n<p>然而，在将图像传递给神经网络之前，许多情况下使用一些算法技术来增强图像是有意义的。<\/p>\n<p>以下是一些可用于图像处理的Python库：<\/p>\n<ul>\n<li><strong><a href=\"https://imageio.readthedocs.io/en/stable/\">imageio<\/a><\/strong> 可用于读取/写入不同的图像格式。它还支持ffmpeg，一个将视频帧转换为图像的有用工具。<\/li>\n<li><strong><a href=\"https://pillow.readthedocs.io/en/stable/index.html\">Pillow<\/a><\/strong>（也称为PIL）功能更强大，还支持一些图像操作，如变形、调色板调整等。<\/li>\n<li><strong><a href=\"https://opencv.org/\">OpenCV<\/a><\/strong> 是一个用C++编写的强大的图像处理库，已成为图像处理的<em>事实标准<\/em>。它有一个方便的Python接口。<\/li>\n<li><strong><a href=\"http://dlib.net/\">dlib<\/a><\/strong> 是一个C++库，实施了许多机器学习算法，包括一些计算机视觉算法。它也有一个Python接口，可用于诸如人脸和面部标志检测等具有挑战性的任务。<\/li>\n<\/ul>\n<h2>OpenCV<\/h2>\n<p><a href=\"https://opencv.org/\">OpenCV<\/a> 被认为是图像处理的<em>事实标准<\/em>。它包含许多有用的算法，用C++实现。你也可以通过Python调用OpenCV。<\/p>\n<p>学习OpenCV的一个好地方是<a href=\"https://learnopencv.com/getting-started-with-opencv/\">这个Learn OpenCV课程<\/a>。在我们的课程中，我们的目标不是学习OpenCV，而是向你展示一些使用它的例子，以及如何使用它。<\/p>\n<h3>加载图像<\/h3>\n<p>在Python中，图像可以方便地表示为NumPy数组。例如，大小为320x200像素的灰度图像将存储在一个200x320的数组中，而相同尺寸的彩色图像将具有200x320x3的形状（对应3个颜色通道）。要加载图像，可以使用以下代码：<\/p>\n<pre><code class=\"language-python\">import cv2\nimport matplotlib.pyplot as plt\n\nim = cv2.imread('image.jpeg')\nplt.imshow(im)\n<\/code><\/pre>\n<p>传统上，OpenCV使用BGR（蓝-绿-红）编码来表示彩色图像，而Python中的其他工具则使用更传统的RGB（红-绿-蓝）。为了使图像显示正确，你需要将其转换为RGB颜色空间，可以通过交换NumPy数组中的维度或调用OpenCV函数来实现：<\/p>\n<pre><code class=\"language-python\">im = cv2.cvtColor(im,cv2.COLOR_BGR2RGB)\n<\/code><\/pre>\n<p>同样的<code>cvtColor<\/code>函数也可以用于执行其他颜色空间转换，例如将图像转换为灰度或HSV（色调-饱和度-亮度）颜色空间。<\/p>\n<p>你还可以使用OpenCV逐帧加载视频——在练习<a href=\"../translations/zh-CN/lessons/4-ComputerVision/06-IntroCV/OpenCV.ipynb\">OpenCV Notebook<\/a>中有一个示例。<\/p>\n<h3>图像处理<\/h3>\n<p>在将图像传递给神经网络之前，你可能需要应用几个预处理步骤。OpenCV可以做很多事情，包括：<\/p>\n<ul>\n<li>使用<code>im = cv2.resize(im, (320,200),interpolation=cv2.INTER_LANCZOS)<\/code>对图像进行<strong>调整大小<\/strong>。<\/li>\n<li>使用<code>im = cv2.medianBlur(im,3)<\/code>或<code>im = cv2.GaussianBlur(im, (3,3), 0)<\/code>对图像进行<strong>模糊处理<\/strong>。<\/li>\n<li>通过NumPy数组操作来改变图像的<strong>亮度和对比度<\/strong>，具体方法可参考<a href=\"https://stackoverflow.com/questions/39308030/how-do-i-increase-the-contrast-of-an-image-in-python-opencv\">这个Stackoverflow帖子<\/a>。<\/li>\n<li>使用<a href=\"https://docs.opencv.org/4.x/d7/d4d/tutorial_py_thresholding.html\">阈值处理<\/a>，通过调用<code>cv2.threshold<\/code>或<code>cv2.adaptiveThreshold<\/code>函数，这通常比调整亮度或对比度更优。<\/li>\n<li>对图像应用不同的<a href=\"https://docs.opencv.org/4.5.5/da/d6e/tutorial_py_geometric_transformations.html\">变换<\/a>：<ul>\n<li><strong><a href=\"https://docs.opencv.org/4.5.5/d4/d61/tutorial_warp_affine.html\">仿射变换<\/a><\/strong> 如果你需要对图像进行旋转、调整大小和倾斜，并且知道图像中三个点的源位置和目标位置，仿射变换会保持平行线的平行性。<\/li>\n<li><strong><a href=\"https://medium.com/analytics-vidhya/opencv-perspective-transformation-9edffefb2143\">透视变换<\/a><\/strong> 如果你知道图像中四个点的源位置和目标位置，这会很有用。例如，如果你用智能手机从某个角度拍摄了一张矩形文档的照片，并希望将文档本身变成一个矩形图像。<\/li>\n<\/ul>\n<\/li>\n<li>使用<strong><a href=\"https://docs.opencv.org/4.5.5/d4/dee/tutorial_optical_flow.html\">光流<\/a><\/strong>来理解图像中的运动。<\/li>\n<\/ul>\n<h2>使用计算机视觉的示例<\/h2>\n<p>在我们的<a href=\"../translations/zh-CN/lessons/4-ComputerVision/06-IntroCV/OpenCV.ipynb\">OpenCV Notebook<\/a>中，我们提供了一
