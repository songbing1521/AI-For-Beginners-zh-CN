/translations/zh-CN/lessons/5-NLP/18-Transformers/TransformersPyTorch.ipynb\">PyTorch中的Transformer<\/a><\/li>\n<li><a href=\"../translations/zh-CN/lessons/5-NLP/18-Transformers/TransformersTF.ipynb\">TensorFlow中的Transformer<\/a><\/li>\n<\/ul>\n<h2>总结<\/h2>\n<p>在本课中，你学习了Transformer和注意机制，它们是自然语言处理工具箱中的重要工具。Transformer架构有许多变体，包括BERT、DistilBERT、BigBird、OpenGPT3等，这些模型可以进行微调。<a href=\"https://github.com/huggingface/\">HuggingFace包<\/a>提供了一个库，可以使用PyTorch和TensorFlow训练许多这些架构。<\/p>\n<h2>🚀 挑战<\/h2>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/36\">课后测验<\/a><\/h2>\n<h2>复习与自学<\/h2>\n<ul>\n<li><a href=\"https://mchromiak.github.io/articles/2017/Sep/12/Transformer-Attention-is-all-you-need/\">博客文章<\/a>，解释了经典的<a href=\"https://arxiv.org/abs/1706.03762\">Attention is all you need<\/a>论文。<\/li>\n<li><a href=\"https://towardsdatascience.com/transformers-explained-visually-part-1-overview-of-functionality-95a6dd460452\">一系列博客文章<\/a>，详细解释了Transformer的架构。<\/li>\n<\/ul>\n<h2><a href=\"#/doc/lessons/5-NLP/18-Transformers/assignment.md\">作业<\/a><\/h2>\n<hr />"},"lessons/5-NLP/18-Transformers/assignment.md":{"t":"注意机制与Transformer · 作业","h":"<h1>作业：Transformers<\/h1>\n<p>在 HuggingFace 上尝试使用 Transformers！试试他们提供的一些脚本，来操作他们网站上提供的各种模型：https://huggingface.co/docs/transformers/run_scripts。尝试使用他们的一个数据集，然后从本课程或 Kaggle 导入一个你自己的数据集，看看你是否能生成有趣的文本。制作一个包含你发现的内容的笔记本。<\/p>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原文档的原始语言版本为权威来源。对于关键信息，建议使用专业人工翻译。我们对因使用此翻译而引起的任何误解或误读不承担责任。<\/p>"},"lessons/5-NLP/19-NER/README.md":{"t":"命名实体识别","h":"<h1>命名实体识别<\/h1>\n<p>到目前为止，我们主要集中在一个自然语言处理（NLP）任务——分类。然而，神经网络还可以完成其他的NLP任务，其中之一就是<strong><a href=\"https://wikipedia.org/wiki/Named-entity_recognition\">命名实体识别<\/a><\/strong>（NER），它处理的是识别文本中的特定实体，例如地点、人物姓名、日期时间区间、化学式等等。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/37\">课前测验<\/a><\/h2>\n<h2>使用NER的示例<\/h2>\n<p>假设你想开发一个类似于亚马逊Alexa或谷歌助手的自然语言聊天机器人。智能聊天机器人的工作方式是通过对输入句子进行文本分类来“理解”用户的需求。分类的结果是所谓的<strong>意图<\/strong>，它决定了聊天机器人应该执行什么操作。<\/p>\n<p><img alt=\"Bot NER\" src=\"../translated_images/zh-CN/bot-ner.4b09235dbb0ad275.webp\" width=\"50%\"/><\/p>\n<blockquote>\n<p>图片由作者提供<\/p>\n<\/blockquote>\n<p>然而，用户可能会在短语中提供一些参数。例如，当询问天气时，她可能会指定一个地点或日期。机器人应该能够理解这些实体，并在执行操作之前相应地填充参数槽。这正是NER的作用所在。<\/p>\n<blockquote>\n<p>✅ 另一个例子是<a href=\"https://soshnikov.com/science/analyzing-medical-papers-with-azure-and-text-analytics-for-health/\">分析科学医学论文<\/a>。我们需要寻找的主要内容是特定的医学术语，例如疾病和药物成分。虽然少量疾病可能可以通过子字符串搜索提取，但更复杂的实体，例如化学化合物和药物名称，则需要更复杂的方法。<\/p>\n<\/blockquote>\n<h2>NER作为标记分类<\/h2>\n<p>NER模型本质上是<strong>标记分类模型<\/strong>，因为对于每个输入标记，我们需要决定它是否属于某个实体，如果属于，则属于哪个实体类别。<\/p>\n<p>考虑以下论文标题：<\/p>\n<p><strong>三尖瓣反流<\/strong>和<strong>碳酸锂<\/strong>在新生儿中的<strong>毒性<\/strong>。<\/p>\n<p>这里的实体是：<\/p>\n<ul>\n<li>三尖瓣反流是一种疾病（<code>DIS<\/code>）<\/li>\n<li>碳酸锂是一种化学物质（<code>CHEM<\/code>）<\/li>\n<li>毒性也是一种疾病（<code>DIS<\/code>）<\/li>\n<\/ul>\n<p>注意，一个实体可能跨越多个标记。而且，如本例所示，我们需要区分两个连续的实体。因此，通常为每个实体使用两个类别——一个指定实体的第一个标记（通常使用<code>B-<\/code>前缀，表示<strong>开始<\/strong>），另一个表示实体的延续部分（<code>I-<\/code>，表示<strong>内部标记<\/strong>）。我们还使用<code>O<\/code>作为类别来表示所有<strong>其他<\/strong>标记。这种标记标注称为<a href=\"https://en.wikipedia.org/wiki/Inside%E2%80%93outside%E2%80%93beginning_(tagging)\">BIO标注<\/a>（或IOB）。标注后的标题如下所示：<\/p>\n<table>\n<thead>\n<tr>\n<th>标记<\/th>\n<th>标签<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>三尖瓣<\/td>\n<td>B-DIS<\/td>\n<\/tr>\n<tr>\n<td>反流<\/td>\n<td>I-DIS<\/td>\n<\/tr>\n<tr>\n<td>和<\/td>\n<td>O<\/td>\n<\/tr>\n<tr>\n<td>碳酸<\/td>\n<td>B-CHEM<\/td>\n<\/tr>\n<tr>\n<td>锂<\/td>\n<td>I-CHEM<\/td>\n<\/tr>\n<tr>\n<td>毒性<\/td>\n<td>B-DIS<\/td>\n<\/tr>\n<tr>\n<td>在<\/td>\n<td>O<\/td>\n<\/tr>\n<tr>\n<td>新生儿<\/td>\n<td>O<\/td>\n<\/tr>\n<tr>\n<td>中<\/td>\n<td>O<\/td>\n<\/tr>\n<tr>\n<td>的<\/td>\n<td>O<\/td>\n<\/tr>\n<tr>\n<td>毒性<\/td>\n<td>O<\/td>\n<\/tr>\n<tr>\n<td>。<\/td>\n<td>O<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>由于我们需要在标记和类别之间建立一一对应关系，我们可以从下图中训练一个最右侧的<strong>多对多<\/strong>神经网络模型：<\/p>\n<p><img alt=\"展示常见循环神经网络模式的图片。\" src=\"../translated_images/zh-CN/unreasonable-effectiveness-of-rnn.541ead816778f42d.webp\" /><\/p>\n<blockquote>\n<p><em>图片来自<a href=\"http://karpathy.github.io/2015/05/21/rnn-effectiveness/\">这篇博客文章<\/a>作者为<a href=\"http://karpathy.github.io/\">Andrej Karpathy<\/a>。NER标记分类模型对应于此图片中最右侧的网络架构。<\/em><\/p>\n<\/blockquote>\n<h2>训练NER模型<\/h2>\n<p>由于NER模型本质上是一个标记分类模型，我们可以使用我们已经熟悉的RNN来完成这个任务。在这种情况下，每个循环网络块将返回标记ID。以下示例笔记本展示了如何训练用于标记分类的LSTM。<\/p>\n<h2>✍️ 示例笔记本：NER<\/h2>\n<p>通过以下笔记本继续学习：<\/p>\n<ul>\n<li><a href=\"../translations/zh-CN/lessons/5-NLP/19-NER/NER-TF.ipynb\">使用TensorFlow进行NER<\/a><\/li>\n<\/ul>\n<h2>总结<\/h2>\n<p>NER模型是一种<strong>标记分类模型<\/strong>，这意味着它可以用于执行标记分类。这是NLP中非常常见的任务，帮助识别文本中的特定实体，包括地点、姓名、日期等。<\/p>\n<h2>🚀 挑战<\/h2>\n<p>完成以下链接的作业，训练一个用于医学术语的命名实体识别模型，然后尝试在不同的数据集上使用它。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/38\">课后测验<\/a><\/h2>\n<h2>复习与自学<\/h2>\n<p>阅读博客<a href=\"http://karpathy.github.io/2015/05/21/rnn-effectiveness/\">循环神经网络的非凡有效性<\/a>，并按照文章中的进一步阅读部分加深你的知识。<\/p>\n<h2><a href=\"#/doc/lessons/5-NLP/19-NER/lab/README.md\">作业<\/a><\/h2>\n<p>在本课的作业中，你需要训练一个医学实体识别模型。你可以从本课中描述的LSTM模型训练开始，然后使用BERT变换器模型。阅读<a href=\"#/doc/lessons/5-NLP/19-NER/lab/README.md\">说明<\/a>以获取所有详细信息。<\/p>\n<hr />"},"lessons/5-NLP/19-NER/lab/README.md":{"t":"命名实体识别 · 实验","h":"<h1>命名实体识别 (NER)<\/h1>\n<p>来自 <a href=\"https://github.com/microsoft/ai-for-beginners\">AI for Beginners Curriculum<\/a> 的实验任务。<\/p>\n<h2>任务<\/h2>\n<p>在本实验中，你需要训练一个用于医学术语的命名实体识别模型。<\/p>\n<h2>数据集<\/h2>\n<p>为了训练 NER 模型，我们需要一个标注良好的包含医学实体的数据集。<a href=\"https://biocreative.bioinformatics.udel.edu/tasks/biocreative-v/track-3-cdr/\">BC5CDR 数据集<\/a> 包含了从 1500 多篇论文中提取的疾病和化学物质实体。你可以在其网站注册后下载该数据集。<\/p>\n<p>BC5CDR 数据集的格式如下：<\/p>\n<pre><code>6794356|t|Tricuspid valve regurgitation and lithium carbonate toxicity in a newborn infant.\n6794356|a|A newborn with massive tricuspid regurgitation, atrial flutter, congestive heart failure, and a high serum lithium level is described. This is the first patient to initially manifest tricuspid regurgitation and atrial flutter, and the 11th described patient with cardiac disease among infants exposed to lithium compounds in the first trimester of pregnancy. Sixty-three percent of these infants had tricuspid valve involvement. Lithium carbonate may be a factor in the increasing incidence of congenital heart disease when taken during early pregnancy. It also causes neurologic depression, cyanosis, and cardiac arrhythmia when consumed prior to delivery.\n6794356 0   29  Tricuspid valve regurgitation   Disease D014262\n6794356 34  51  lithium carbonate   Chemical    D016651\n6794356 52  60  toxicity    Disease D064420\n...\n<\/code><\/pre>\n<p>在这个数据集中，第一行和第二行分别是论文标题和摘要，接下来是各个实体的信息，包括它们在标题+摘要块中的起始和结束位置。除了实体类型外，你还可以获得该实体在某些医学本体中的本体 ID。<\/p>\n<p>你需要编写一些 Python 代码，将这些数据转换为 BIO 编码格式。<\/p>\n<h2>网络<\/h2>\n<p>第一次尝试 NER 时，可以使用 LSTM 网络，就像你在课程中看到的示例一样。然而，在 NLP 任务中，<a href=\"https://en.wikipedia.org/wiki/Transformer_(machine_learning_model)\">Transformer 架构<\/a>，特别是 <a href=\"https://en.wikipedia.org/wiki/BERT_(language_model)\">BERT 语言模型<\/a>，通常能取得更好的效果。预训练的 BERT 模型能够理解语言的基本结构，并且可以通过相对较小的数据集和计算成本针对特定任务进行微调。<\/p>\n<p>由于我们计划将 NER 应用于医学场景，因此使用在医学文本上训练的 BERT 模型是合理的。微软研究院发布了一个名为 [PubMedBERT][PubMedBERT] 的预训练模型（[相关论文][PubMedBERT-Pub]），该模型使用 <a href=\"https://pubmed.ncbi.nlm.nih.gov/\">PubMed<\/a> 仓库中的文本进行了微调。<\/p>\n<p>训练 Transformer 模型的事实标准是 <a href=\"https://huggingface.co/\">Hugging Face Transformers<\/a> 库。该库还包含一个由社区维护的预训练模型仓库，其中包括 PubMedBERT。加载和使用该模型只需要几行代码：<\/p>\n<pre><code class=\"language-python\">model_name = &quot;microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract&quot;\nclasses = ... # number of classes: 2*entities+1\ntokenizer = AutoTokenizer.from_pretrained(model_name)\nmodel = BertForTokenClassification.from_pretrained(model_name, classes)\n<\/code><\/pre>\n<p>这段代码为我们提供了一个 <code>model<\/code> 对象，用于基于 <code>classes<\/code> 数量的类别进行标注任务，以及一个 <code>tokenizer<\/code> 对象，用于将输入文本分割为 token。你需要将数据集转换为 BIO 格式，同时考虑到 PubMedBERT 的分词方式。你可以参考 <a href=\"https://gist.github.com/shwars/580b55684be3328eb39ecf01b9cbbd88\">这段 Python 代码<\/a> 来获取灵感。<\/p>\n<h2>收获<\/h2>\n<p>这个任务非常接近实际工作中可能遇到的任务，尤其是当你希望从大量自然语言文本中获取更多洞见时。在我们的案例中，我们可以将训练好的模型应用于 <a href=\"https://www.kaggle.com/allen-institute-for-ai/CORD-19-research-challenge\">COVID 相关论文数据集<\/a>，看看能从中获取哪些洞见。<a href=\"https://soshnikov.com/science/analyzing-medical-papers-with-azure-and-text-analytics-for-health/\">这篇博客文章<\/a> 和 <a href=\"https://www.mdpi.com/2504-2289/6/1/4\">这篇论文<\/a> 描述了可以使用 NER 对该论文语料库进行的研究。<\/p>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原始语言的文档作为权威来源。对于关键信息，建议使用专业人工翻译。因使用本翻译而引起的任何误解或误读，我们概不负责。<\/p>"},"lessons/5-NLP/20-LangModels/README.md":{"t":"预训练大型语言模型","h":"<h1>预训练大型语言模型<\/h1>\n<p>在我们之前的所有任务中，我们都使用带标签的数据集训练神经网络来完成特定任务。而对于像 BERT 这样的大型 Transformer 模型，我们通过自监督的方式进行语言建模来构建语言模型，然后通过进一步的领域特定训练使其专注于特定的下游任务。然而，研究表明，大型语言模型也可以在没有任何领域特定训练的情况下解决许多任务。这类能够实现这一目标的模型家族被称为 <strong>GPT<\/strong>：生成式预训练 Transformer。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/39\">课前测验<\/a><\/h2>\n<h2>文本生成与困惑度<\/h2>\n<p>神经网络能够在没有下游训练的情况下完成通用任务的理念在论文 <a href=\"https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf\">Language Models are Unsupervised Multitask Learners<\/a> 中提出。其核心思想是许多其他任务可以通过 <strong>文本生成<\/strong> 来建模，因为理解文本本质上意味着能够生成文本。由于模型在包含人类知识的大量文本上进行了训练，它也因此对广泛的主题有了深入的了解。<\/p>\n<blockquote>\n<p>理解并能够生成文本也意味着对周围世界有所了解。人类在很大程度上也是通过阅读来学习的，而 GPT 网络在这方面与人类类似。<\/p>\n<\/blockquote>\n<p>文本生成网络通过预测下一个词的概率 $$P(w_N)$$ 来工作。然而，下一个词的无条件概率等于该词在文本语料库中的出现频率。GPT 能够提供下一个词的 <strong>条件概率<\/strong>，即基于前面的词：$$P(w_N | w_{n-1}, ..., w_0)$$<\/p>\n<blockquote>\n<p>您可以在我们的 <a href=\"https://github.com/microsoft/Data-Science-For-Beginners/tree/main/1-Introduction/04-stats-and-probability\">数据科学初学者课程<\/a> 中了解更多关于概率的内容。<\/p>\n<\/blockquote>\n<p>语言生成模型的质量可以通过 <strong>困惑度<\/strong> 来定义。这是一种内在指标，可以在没有任何任务特定数据集的情况下衡量模型质量。它基于 <em>句子的概率<\/em> 的概念——模型对可能是真实的句子赋予高概率（即模型对其不 <strong>困惑<\/strong>），而对不太合理的句子（例如 <em>Can it does what?<\/em>）赋予低概率。当我们给模型提供真实文本语料库中的句子时，我们希望它们具有高概率和低 <strong>困惑度<\/strong>。数学上，困惑度定义为测试集的归一化逆概率：\n$$\n\\mathrm{Perplexity}(W) = \\sqrt[N]{1\\over P(W_1,...,W_N)}\n$$ <\/p>\n<p><strong>您可以使用 <a href=\"https://transformer.huggingface.co/doc/gpt2-large\">Hugging Face 的 GPT 驱动文本编辑器<\/a> 进行文本生成实验<\/strong>。在这个编辑器中，您开始编写文本，按下 <strong>[TAB]<\/strong> 键后会提供几个补全选项。如果选项太短或您不满意，可以再次按下 [TAB] 键，您将获得更多选项，包括更长的文本片段。<\/p>\n<h2>GPT 是一个家族<\/h2>\n<p>GPT 不是单一模型，而是由 <a href=\"https://openai.com\">OpenAI<\/a> 开发和训练的一系列模型。<\/p>\n<p>在 GPT 模型家族中，我们有：<\/p>\n<table>\n<thead>\n<tr>\n<th><a href=\"https://huggingface.co/docs/transformers/model_doc/gpt2#openai-gpt2\">GPT-2<\/a><\/th>\n<th><a href=\"https://openai.com/research/language-models-are-few-shot-learners\">GPT-3<\/a><\/th>\n<th><a href=\"https://openai.com/gpt-4\">GPT-4<\/a><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>语言模型，参数量高达 15 亿。<\/td>\n<td>语言模型，参数量高达 1750 亿。<\/td>\n<td>参数量达 100 万亿，支持图像和文本输入，并输出文本。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>GPT-3 和 GPT-4 模型可以通过 <a href=\"https://azure.microsoft.com/en-us/services/cognitive-services/openai-service/#overview?WT.mc_id=academic-77998-cacaste\">Microsoft Azure 的认知服务<\/a> 和 <a href=\"https://openai.com/api/\">OpenAI API<\/a> 使用。<\/p>\n<h2>提示工程<\/h2>\n<p>由于 GPT 在大量数据上进行了训练以理解语言和代码，它能够根据输入（提示）生成输出。提示是 GPT 的输入或查询，用户通过提示向模型提供任务指令以完成后续任务。为了获得期望的结果，您需要最有效的提示，这涉及选择合适的词语、格式、短语甚至符号。这种方法被称为 <a href=\"https://learn.microsoft.com/en-us/shows/ai-show/the-basics-of-prompt-engineering-with-azure-openai-service?WT.mc_id=academic-77998-bethanycheum\">提示工程<\/a>。<\/p>\n<p><a href=\"https://learn.microsoft.com/en-us/semantic-kernel/prompt-engineering/?WT.mc_id=academic-77998-bethanycheum\">此文档<\/a> 提供了有关提示工程的更多信息。<\/p>\n<h2>✍️ 示例笔记本：<a href=\"../translations/zh-CN/lessons/5-NLP/20-LangModels/GPT-PyTorch.ipynb\">使用 OpenAI-GPT 进行实验<\/a><\/h2>\n<p>通过以下笔记本继续学习：<\/p>\n<ul>\n<li><a href=\"../translations/zh-CN/lessons/5-NLP/20-LangModels/GPT-PyTorch.ipynb\">使用 OpenAI-GPT 和 Hugging Face Transformers 生成文本<\/a><\/li>\n<\/ul>\n<h2>结论<\/h2>\n<p>新的通用预训练语言模型不仅能够建模语言结构，还包含大量自然语言知识。因此，它们可以在零样本或少样本设置中有效地解决一些 NLP 任务。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/40\">课后测验<\/a><\/h2>\n<hr />"},"lessons/6-Other/21-GeneticAlgorithms/README.md":{"t":"遗传算法","h":"<h1>遗传算法<\/h1>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/41\">课前测验<\/a><\/h2>\n<p><strong>遗传算法<\/strong> (GA) 基于一种<strong>进化式方法<\/strong>，通过模拟种群的进化过程来为给定问题找到最优解。这种方法由 <a href=\"https://wikipedia.org/wiki/John_Henry_Holland\">John Henry Holland<\/a> 于1975年提出。<\/p>\n<p>遗传算法基于以下理念：<\/p>\n<ul>\n<li>问题的有效解可以表示为<strong>基因<\/strong><\/li>\n<li><strong>交叉<\/strong>允许我们将两个解结合起来，生成一个新的有效解<\/li>\n<li>使用某种<strong>适应度函数<\/strong>进行<strong>选择<\/strong>，以筛选出更优的解<\/li>\n<li>引入<strong>变异<\/strong>以打破优化过程的稳定性，从而摆脱局部最小值<\/li>\n<\/ul>\n<p>如果你想实现遗传算法，需要以下步骤：<\/p>\n<ul>\n<li>找到一种方法，用<strong>基因<\/strong> g&in;&Gamma; 编码问题的解<\/li>\n<li>在基因集合 &Gamma; 上定义<strong>适应度函数<\/strong> fit: &Gamma;&rightarrow;<strong>R<\/strong>，函数值越小表示解越优。<\/li>\n<li>定义<strong>交叉<\/strong>机制，将两个基因结合生成一个新的有效解 crossover: &Gamma;<sup>2<\/sub>&rightarrow;&Gamma;。<\/li>\n<li>定义<strong>变异<\/strong>机制 mutate: &Gamma;&rightarrow;&Gamma;。<\/li>\n<\/ul>\n<p>在许多情况下，交叉和变异是操作基因的简单算法，比如处理数字序列或位向量。<\/p>\n<p>遗传算法的具体实现可能因情况而异，但总体结构如下：<\/p>\n<ol>\n<li>选择初始种群 G&subset;&Gamma;<\/li>\n<li>随机选择将在此步骤执行的操作：交叉或变异<\/li>\n<li><strong>交叉<\/strong>：\n  * 随机选择两个基因 g<sub>1<\/sub>, g<sub>2<\/sub> &in; G\n  * 计算交叉结果 g=crossover(g<sub>1<\/sub>,g<sub>2<\/sub>)\n  * 如果 fit(g)&lt;fit(g<sub>1<\/sub>) 或 fit(g)&lt;fit(g<sub>2<\/sub>)，用 g 替换种群中的对应基因。<\/li>\n<li><strong>变异<\/strong> - 随机选择一个基因 g&in;G，并用 mutate(g) 替换它<\/li>\n<li>从步骤2开始重复，直到适应度函数值足够小，或达到步骤数限制。<\/li>\n<\/ol>\n<h2>常见任务<\/h2>\n<p>遗传算法通常解决以下任务：<\/p>\n<ol>\n<li>排程优化<\/li>\n<li>最优装箱<\/li>\n<li>最优切割<\/li>\n<li>加速穷举搜索<\/li>\n<\/ol>\n<h2>✍️ 练习：遗传算法<\/h2>\n<p>通过以下笔记本继续学习：<\/p>\n<p>访问<a href=\"../translations/zh-CN/lessons/6-Other/21-GeneticAlgorithms/Genetic.ipynb\">这个笔记本<\/a>，查看两个使用遗传算法的示例：<\/p>\n<ol>\n<li>公平分配宝藏<\/li>\n<li>八皇后问题<\/li>\n<\/ol>\n<h2>总结<\/h2>\n<p>遗传算法被用于解决许多问题，包括物流和搜索问题。这个领域的灵感来源于心理学和计算机科学的交叉研究。<\/p>\n<h2>🚀 挑战<\/h2>\n<p>“遗传算法易于实现，但其行为难以理解。” <a href=\"https://wikipedia.org/wiki/Genetic_algorithm\">来源<\/a> 进行一些研究，找到一个遗传算法的实现，例如解决数独问题，并以草图或流程图的形式解释其工作原理。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/42\">课后测验<\/a><\/h2>\n<h2>复习与自学<\/h2>\n<p>观看<a href=\"https://www.youtube.com/watch?v=qv6UVOQ0F44\">这个精彩视频<\/a>，了解计算机如何通过遗传算法训练的神经网络学习玩超级马里奥。我们将在<a href=\"#/doc/lessons/6-Other/22-DeepRL/README.md\">下一节<\/a>中学习更多关于计算机学习玩游戏的内容。<\/p>\n<h2><a href=\"../translations/zh-CN/lessons/6-Other/21-GeneticAlgorithms/Diophantine.ipynb\">作业：丢番图方程<\/a><\/h2>\n<p>你的目标是解决所谓的<strong>丢番图方程<\/strong>——一个具有整数根的方程。例如，考虑方程 a+2b+3c+4d=30。你需要找到满足该方程的整数根。<\/p>\n<p><em>此作业的灵感来源于<a href=\"https://habr.com/post/128704/\">这篇文章<\/a>。<\/em><\/p>\n<p>提示：<\/p>\n<ol>\n<li>可以考虑根的范围为 [0;30]<\/li>\n<li>作为基因，可以使用根值列表<\/li>\n<\/ol>\n<p>使用 <a href=\"../translations/zh-CN/lessons/6-Other/21-GeneticAlgorithms/Diophantine.ipynb\">Diophantine.ipynb<\/a> 作为起点。<\/p>\n<hr />"},"lessons/6-Other/22-DeepRL/README.md":{"t":"深度强化学习","h":"<h1>深度强化学习<\/h1>\n<p>强化学习（RL）被认为是机器学习的基本范式之一，与监督学习和无监督学习并列。在监督学习中，我们依赖于具有已知结果的数据集，而强化学习则基于<strong>通过实践学习<\/strong>。例如，当我们第一次看到一个电脑游戏时，即使不知道规则，我们也会开始玩，并通过玩游戏和调整行为逐渐提高自己的技能。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/43\">课前测验<\/a><\/h2>\n<p>要进行强化学习，我们需要：<\/p>\n<ul>\n<li>一个<strong>环境<\/strong>或<strong>模拟器<\/strong>，它定义了游戏规则。我们应该能够在模拟器中运行实验并观察结果。<\/li>\n<li>某种<strong>奖励函数<\/strong>，它指示我们的实验是否成功。例如，在学习玩电脑游戏时，奖励可以是我们的最终得分。<\/li>\n<\/ul>\n<p>基于奖励函数，我们应该能够调整自己的行为并提高技能，以便下一次表现更好。强化学习与其他类型的机器学习的主要区别在于，在强化学习中，我们通常不知道自己是否赢了或输了，直到游戏结束。因此，我们无法判断单独的某个动作是否是好的——我们只有在游戏结束时才会收到奖励。<\/p>\n<p>在强化学习过程中，我们通常会进行许多实验。在每次实验中，我们需要在遵循迄今为止学到的最佳策略（<strong>利用<\/strong>）和探索新的可能状态（<strong>探索<\/strong>）之间找到平衡。<\/p>\n<h2>OpenAI Gym<\/h2>\n<p>一个非常适合强化学习的工具是 <a href=\"https://gym.openai.com/\">OpenAI Gym<\/a>——一个<strong>模拟环境<\/strong>，它可以模拟许多不同的环境，从 Atari 游戏到物理学中的杆平衡问题。它是训练强化学习算法最流行的模拟环境之一，由 <a href=\"https://openai.com/\">OpenAI<\/a> 维护。<\/p>\n<blockquote>\n<p><strong>Note<\/strong>: 你可以在 <a href=\"https://gym.openai.com/envs/#classic_control\">这里<\/a> 查看 OpenAI Gym 提供的所有环境。<\/p>\n<\/blockquote>\n<h2>CartPole 平衡<\/h2>\n<p>你可能都见过现代平衡设备，比如 <em>Segway<\/em> 或 <em>Gyroscooters<\/em>。它们能够通过调整轮子来响应加速度计或陀螺仪的信号，从而自动保持平衡。在本节中，我们将学习如何解决一个类似的问题——杆平衡。这类似于马戏团表演者需要在手上平衡杆的情况——但这种杆平衡仅发生在一维空间中。<\/p>\n<p>一种简化的平衡问题被称为 <strong>CartPole<\/strong> 问题。在 CartPole 世界中，我们有一个可以左右移动的水平滑块，目标是在滑块上方保持一个垂直杆的平衡。<\/p>\n<p><img alt=\"a cartpole\" src=\"../translated_images/zh-CN/cartpole.f52a67f27e058170.webp\" width=\"200\"/><\/p>\n<p>要创建和使用这个环境，我们需要几行 Python 代码：<\/p>\n<pre><code class=\"language-python\">import gym\nenv = gym.make(&quot;CartPole-v1&quot;)\n\nenv.reset()\ndone = False\ntotal_reward = 0\nwhile not done:\n   env.render()\n   action = env.action_space.sample()\n   observaton, reward, done, info = env.step(action)\n   total_reward += reward\n\nprint(f&quot;Total reward: {total_reward}&quot;)\n<\/code><\/pre>\n<p>每个环境都可以通过以下方式访问：\n* <code>env.reset<\/code> 开始一个新的实验\n* <code>env.step<\/code> 执行一个模拟步骤。它接收来自<strong>动作空间<\/strong>的一个<strong>动作<\/strong>，并返回一个<strong>观察值<\/strong>（来自观察空间），以及奖励和终止标志。<\/p>\n<p>在上面的示例中，我们在每一步执行随机动作，因此实验的持续时间非常短：<\/p>\n<p><img alt=\"non-balancing cartpole\" src=\"https://raw.githubusercontent.com/songbing1521/AI-For-Beginners-zh-CN/main/lessons/6-Other/22-DeepRL/images/cartpole-nobalance.gif\" /><\/p>\n<p>强化学习算法的目标是训练一个模型——所谓的<strong>策略<\/strong> &pi;——它会根据给定状态返回动作。我们也可以将策略视为概率性的，例如，对于任何状态 <em>s<\/em> 和动作 <em>a<\/em>，它会返回我们在状态 <em>s<\/em> 下采取动作 <em>a<\/em> 的概率 &pi;(<em>a<\/em>|<em>s<\/em>)。<\/p>\n<h2>策略梯度算法<\/h2>\n<p>建模策略的最明显方法是创建一个神经网络，该网络将状态作为输入，并返回相应的动作（或者更确切地说是所有动作的概率）。从某种意义上说，它类似于普通的分类任务，但有一个主要区别——我们事先不知道在每一步应该采取哪些动作。<\/p>\n<p>这里的想法是估计这些概率。我们构建一个<strong>累计奖励<\/strong>向量，显示实验中每一步的总奖励。我们还通过乘以某个系数 &gamma;=0.99 对早期奖励进行<strong>奖励折扣<\/strong>，以减小早期奖励的影响。然后，我们强化实验路径中产生较大奖励的步骤。<\/p>\n<blockquote>\n<p>了解更多关于策略梯度算法的信息，并在<a href=\"../translations/zh-CN/lessons/6-Other/22-DeepRL/CartPole-RL-TF.ipynb\">示例笔记本<\/a>中查看其实际应用。<\/p>\n<\/blockquote>\n<h2>Actor-Critic 算法<\/h2>\n<p>策略梯度方法的改进版本被称为 <strong>Actor-Critic<\/strong>。其核心思想是神经网络将被训练以返回两件事：<\/p>\n<ul>\n<li>策略，决定采取的动作。这部分称为 <strong>actor<\/strong>。<\/li>\n<li>对当前状态下可以获得的总奖励的估计——这部分称为 <strong>critic<\/strong>。<\/li>\n<\/ul>\n<p>从某种意义上说，这种架构类似于 <a href=\"#/doc/lessons/4-ComputerVision/10-GANs/README.md\">GAN<\/a>，其中有两个网络相互对抗进行训练。在 Actor-Critic 模型中，actor 提出我们需要采取的动作，而 critic 尝试进行批判并估计结果。然而，我们的目标是让这两个网络协同训练。<\/p>\n<p>因为我们在实验过程中同时知道真实的累计奖励和 critic 返回的结果，因此构建一个损失函数以最小化它们之间的差异相对容易。这将产生<strong>critic 损失<\/strong>。我们可以使用与策略梯度算法相同的方法计算<strong>actor 损失<\/strong>。<\/p>\n<p>运行这些算法后，我们可以期待我们的 CartPole 表现如下：<\/p>\n<p><img alt=\"a balancing cartpole\" src=\"https://raw.githubusercontent.com/songbing1521/AI-For-Beginners-zh-CN/main/lessons/6-Other/22-DeepRL/images/cartpole-balance.gif\" /><\/p>\n<h2>✍️ 练习：策略梯度和 Actor-Critic 强化学习<\/h2>\n<p>通过以下笔记本继续学习：<\/p>\n<ul>\n<li><a href=\"../translations/zh-CN/lessons/6-Other/22-DeepRL/CartPole-RL-TF.ipynb\">TensorFlow 中的强化学习<\/a><\/li>\n<li><a href=\"../translations/zh-CN/lessons/6-Other/22-DeepRL/CartPole-RL-PyTorch.ipynb\">PyTorch 中的强化学习<\/a><\/li>\n<\/ul>\n<h2>其他强化学习任务<\/h2>\n<p>如今，强化学习是一个快速发展的研究领域。一些有趣的强化学习示例包括：<\/p>\n<ul>\n<li>教电脑玩 <strong>Atari 游戏<\/strong>。这个问题的挑战在于我们没有简单的状态表示为向量，而是一个截图——我们需要使用 CNN 将屏幕图像转换为特征向量或提取奖励信息。Atari 游戏可以在 Gym 中找到。<\/li>\n<li>教电脑玩棋盘游戏，比如国际象棋和围棋。最近，像 <strong>Alpha Zero<\/strong> 这样的最先进程序通过两个代理相互对战并在每一步中不断改进，从零开始进行训练。<\/li>\n<li>在工业中，强化学习用于从模拟中创建控制系统。一个名为 <a href=\"https://azure.microsoft.com/services/project-bonsai/?WT.mc_id=academic-77998-cacaste\">Bonsai<\/a> 的服务专门为此设计。<\/li>\n<\/ul>\n<h2>总结<\/h2>\n<p>我们现在已经学习了如何通过提供定义游戏期望状态的奖励函数，并让代理智能地探索搜索空间，来训练代理以获得良好的结果。我们成功尝试了两种算法，并在相对较短的时间内取得了良好的结果。然而，这只是你强化学习旅程的开始，如果你想深入研究，应该考虑参加专门的课程。<\/p>\n<h2>🚀 挑战<\/h2>\n<p>探索“其他强化学习任务”部分列出的应用，并尝试实现其中一个！<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/44\">课后测验<\/a><\/h2>\n<h2>复习与自学<\/h2>\n<p>在我们的<a href=\"https://github.com/microsoft/ML-For-Beginners/blob/main/8-Reinforcement/README.md\">初学者机器学习课程<\/a>中了解更多关于经典强化学习的内容。<\/p>\n<p>观看<a href=\"https://www.youtube.com/watch?v=qv6UVOQ0F44\">这个精彩视频<\/a>，了解电脑如何学习玩超级马里奥。<\/p>\n<h2>作业：<a href=\"#/doc/lessons/6-Other/22-DeepRL/lab/README.md\">训练一个山地车<\/a><\/h2>\n<p>在这个作业中，你的目标是训练一个不同的 Gym 环境——<a href=\"https://www.gymlibrary.ml/environments/classic_control/mountain_car/\">山地车<\/a>。<\/p>\n<hr />"},"lessons/6-Other/22-DeepRL/lab/README.md":{"t":"深度强化学习 · 实验","h":"<h2>环境<\/h2>\n<p>Mountain Car 环境中，汽车被困在一个山谷中。你的目标是跳出山谷并到达旗帜处。你可以执行的动作包括向左加速、向右加速或保持不动。你可以观察汽车在 x 轴上的位置以及速度。<\/p>\n<h2>起始笔记本<\/h2>\n<p>通过打开 <a href=\"https://raw.githubusercontent.com/songbing1521/AI-For-Beginners-zh-CN/main/lessons/6-Other/22-DeepRL/lab/MountainCar.ipynb\">MountainCar.ipynb<\/a> 开始实验。<\/p>\n<h2>收获<\/h2>\n<p>在整个实验过程中，你应该学到将 RL 算法应用到一个新环境通常是非常直接的，因为 OpenAI Gym 对所有环境都提供了统一的接口，而算法本身并不太依赖于环境的具体性质。你甚至可以重新组织 Python 代码，以便将任何环境作为参数传递给 RL 算法。<\/p>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原始语言的文档作为权威来源。对于关键信息，建议使用专业人工翻译。因使用本翻译而引起的任何误解或误读，我们概不负责。<\/p>"},"lessons/6-Other/23-MultiagentSystems/README.md":{"t":"多智能体系统","h":"<h1>多智能体系统<\/h1>\n<p>实现智能的一种可能方法是所谓的<strong>涌现<\/strong>（或<strong>协同<\/strong>）方法，其基于这样一个事实：许多相对简单的智能体的组合行为可以导致整个系统表现出更复杂（或更智能）的行为。从理论上讲，这种方法基于<a href=\"https://en.wikipedia.org/wiki/Collective_intelligence\">集体智能<\/a>、<a href=\"https://en.wikipedia.org/wiki/Global_brain\">涌现论<\/a>和<a href=\"https://en.wikipedia.org/wiki/Global_brain\">进化控制论<\/a>的原则，这些理论认为，当低级系统被适当地组合成高级系统时，高级系统会获得某种附加价值（即所谓的<em>元系统转变原则<\/em>）。<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/45\">课前测验<\/a><\/h2>\n<p><strong>多智能体系统<\/strong>这一方向在1990年代随着互联网和分布式系统的发展在人工智能领域兴起。经典的人工智能教材之一<a href=\"https://en.wikipedia.org/wiki/Artificial_Intelligence:_A_Modern_Approach\">《人工智能：现代方法》<\/a>从多智能体系统的角度探讨了经典人工智能的观点。<\/p>\n<p>多智能体方法的核心是<strong>智能体<\/strong>的概念——一个生活在某种<strong>环境<\/strong>中的实体，它可以感知环境并对其采取行动。这是一个非常广泛的定义，智能体可以有许多不同的类型和分类：<\/p>\n<ul>\n<li>按其推理能力：<\/li>\n<li><strong>反应型<\/strong>智能体通常具有简单的请求-响应行为<\/li>\n<li><strong>推理型<\/strong>智能体采用某种逻辑推理和/或规划能力<\/li>\n<li>按智能体代码执行的位置：<\/li>\n<li><strong>静态<\/strong>智能体在专用网络节点上工作<\/li>\n<li><strong>移动<\/strong>智能体可以在网络节点之间移动其代码<\/li>\n<li>按其行为：<\/li>\n<li><strong>被动智能体<\/strong>没有具体目标。这类智能体可以对外部刺激做出反应，但不会主动采取行动。<\/li>\n<li><strong>主动智能体<\/strong>有一些目标并努力实现这些目标<\/li>\n<li><strong>认知智能体<\/strong>涉及复杂的规划和推理<\/li>\n<\/ul>\n<p>如今，多智能体系统被应用于许多领域：<\/p>\n<ul>\n<li>在游戏中，许多非玩家角色使用某种人工智能，可以被视为智能体<\/li>\n<li>在视频制作中，渲染涉及人群的复杂3D场景通常使用多智能体模拟<\/li>\n<li>在系统建模中，多智能体方法用于模拟复杂模型的行为。例如，多智能体方法已成功用于预测COVID-19疾病在全球的传播。类似的方法可以用于模拟城市交通，并观察其对交通规则变化的反应。<\/li>\n<li>在复杂的自动化系统中，每个设备可以作为一个独立的智能体，这使得整个系统不那么单一且更具鲁棒性。<\/li>\n<\/ul>\n<p>我们不会深入探讨多智能体系统，但会考虑一个<strong>多智能体建模<\/strong>的示例。<\/p>\n<h2>NetLogo<\/h2>\n<p><a href=\"https://ccl.northwestern.edu/netlogo/\">NetLogo<\/a>是一个基于修改版<a href=\"https://en.wikipedia.org/wiki/Logo_(programming_language)\">Logo<\/a>编程语言的多智能体建模环境。这种语言是为教授编程概念给孩子而开发的，它允许你控制一个名为<strong>乌龟<\/strong>的智能体，该智能体可以移动并留下痕迹。这使得创建复杂的几何图形成为可能，这是一种非常直观的方式来理解智能体的行为。<\/p>\n<p>在NetLogo中，我们可以使用<code>create-turtles<\/code>命令创建许多乌龟。然后我们可以命令所有乌龟执行一些动作（例如下面的例子中向前移动10点）：<\/p>\n<pre><code>create-turtles 10\nask turtles [\n  forward 10\n]\n<\/code><\/pre>\n<p>当然，如果所有乌龟都做同样的事情就没什么意思了，所以我们可以<code>ask<\/code>某些乌龟群体，例如那些在某个点附近的乌龟。我们还可以使用<code>breed [cats cat]<\/code>命令创建不同<em>种类<\/em>的乌龟。这里<code>cat<\/code>是种类的名称，我们需要同时指定单数和复数形式，因为不同的命令使用不同的形式以提高清晰度。<\/p>\n<blockquote>\n<p>✅ 我们不会深入学习NetLogo语言本身——如果你感兴趣，可以访问优秀的<a href=\"https://ccl.northwestern.edu/netlogo/bind/\">初学者互动NetLogo词典<\/a>资源。<\/p>\n<\/blockquote>\n<p>你可以<a href=\"https://ccl.northwestern.edu/netlogo/download.shtml\">下载<\/a>并安装NetLogo来尝试。<\/p>\n<h3>模型库<\/h3>\n<p>NetLogo的一个优点是它包含一个可供尝试的工作模型库。进入<strong>File &rightarrow; Models Library<\/strong>，你会发现许多类别的模型可供选择。<\/p>\n<p><img alt=\"NetLogo模型库\" src=\"../translated_images/zh-CN/NetLogo-ModelLib.efe023afb4763c05.webp\" width=\"60%\"/><\/p>\n<blockquote>\n<p>Dmitry Soshnikov提供的模型库截图<\/p>\n<\/blockquote>\n<p>你可以打开其中一个模型，例如<strong>Biology &rightarrow; Flocking<\/strong>。<\/p>\n<h3>主要原则<\/h3>\n<p>打开模型后，你会进入NetLogo的主界面。以下是一个描述狼和羊种群的示例模型，考虑到有限资源（草地）。<\/p>\n<p><img alt=\"NetLogo主界面\" src=\"../translated_images/zh-CN/NetLogo-Main.32653711ec1a01b3.webp\" /><\/p>\n<blockquote>\n<p>Dmitry Soshnikov提供的截图<\/p>\n<\/blockquote>\n<p>在这个界面上，你可以看到：<\/p>\n<ul>\n<li><strong>界面<\/strong>部分包含：<\/li>\n<li>智能体生活的主场地<\/li>\n<li>不同的控件：按钮、滑块等<\/li>\n<li>用于显示模拟参数的图表<\/li>\n<li><strong>代码<\/strong>标签包含编辑器，你可以在其中编写NetLogo程序<\/li>\n<\/ul>\n<p>在大多数情况下，界面会有一个<strong>Setup<\/strong>按钮，用于初始化模拟状态，以及一个<strong>Go<\/strong>按钮，用于启动执行。这些按钮由代码中的相应处理程序处理，代码如下所示：<\/p>\n<pre><code>to go [\n...\n]\n<\/code><\/pre>\n<p>NetLogo的世界由以下对象组成：<\/p>\n<ul>\n<li><strong>智能体<\/strong>（乌龟），可以在场地上移动并执行某些操作。你可以使用<code>ask turtles [...]<\/code>语法命令智能体，括号中的代码由所有智能体以<em>乌龟模式<\/em>执行。<\/li>\n<li><strong>补丁<\/strong>是场地上的方块区域，智能体生活在其上。你可以引用同一补丁上的所有智能体，或者更改补丁的颜色和其他属性。你也可以<code>ask patches<\/code>执行某些操作。<\/li>\n<li><strong>观察者<\/strong>是一个独特的智能体，控制整个世界。所有按钮处理程序都以<em>观察者模式<\/em>执行。<\/li>\n<\/ul>\n<blockquote>\n<p>✅ 多智能体环境的美妙之处在于，以乌龟模式或补丁模式运行的代码会由所有智能体同时并行执行。因此，通过编写少量代码并编程单个智能体的行为，你可以创建整个模拟系统的复杂行为。<\/p>\n<\/blockquote>\n<h3>群体行为<\/h3>\n<p>作为多智能体行为的一个示例，我们来看看<strong><a href=\"https://en.wikipedia.org/wiki/Flocking_(behavior)\">群体行为<\/a><\/strong>。群体行为是一种复杂模式，非常类似于鸟群飞行的方式。观察它们飞行时，你可能会认为它们遵循某种集体算法，或者它们拥有某种形式的<em>集体智能<\/em>。然而，这种复杂行为的产生仅仅是因为每个单独的智能体（在这种情况下是<em>鸟<\/em>）只观察短距离内的其他智能体，并遵循三个简单规则：<\/p>\n<ul>\n<li><strong>对齐<\/strong> - 朝邻近智能体的平均方向转向<\/li>\n<li><strong>凝聚<\/strong> - 尝试朝邻居的平均位置转向（<em>远距离吸引<\/em>）<\/li>\n<li><strong>分离<\/strong> - 当与其他鸟靠得太近时，尝试远离（<em>短距离排斥<\/em>）<\/li>\n<\/ul>\n<p>你可以运行群体行为示例并观察其行为。你还可以调整参数，例如<em>分离程度<\/em>或<em>视距<\/em>，定义每只鸟能看到的范围。注意，如果你将视距减少到0，所有鸟都会变得“盲目”，群体行为会停止。如果你将分离减少到0，所有鸟会聚集成一条直线。<\/p>\n<blockquote>\n<p>✅ 切换到<strong>代码<\/strong>标签，查看群体行为的三个规则（对齐、凝聚和分离）如何在代码中实现。注意我们如何仅引用视野范围内的智能体。<\/p>\n<\/blockquote>\n<h3>其他可查看的模型<\/h3>\n<p>还有一些有趣的模型可以供你实验：<\/p>\n<ul>\n<li><strong>Art &rightarrow; Fireworks<\/strong>展示了烟花如何被视为单个火流的集体行为<\/li>\n<li><strong>Social Science &rightarrow; Traffic Basic<\/strong>和<strong>Social Science &rightarrow; Traffic Grid<\/strong>展示了城市交通在1D和2D网格中有或没有交通灯的模型。模拟中的每辆车遵循以下规则：<\/li>\n<li>如果前方空间为空——加速（直到某个最大速度）<\/li>\n<li>如果看到前方有障碍物——刹车（你可以调整司机的视距）<\/li>\n<li><strong>Social Science &rightarrow; Party<\/strong>展示了人们在鸡尾酒会上如何聚集。你可以找到导致群体幸福度最快提升的参数组合。<\/li>\n<\/ul>\n<p>从这些示例中可以看出，多智能体模拟可以成为理解由遵循相同或类似逻辑的个体组成的复杂系统行为的一种有用方式。它还可以用于控制虚拟智能体，例如计算机游戏中的<a href=\"https://en.wikipedia.org/wiki/NPC\">NPC<\/a>，或3D动画世界中的智能体。<\/p>\n<h2>推理型智能体<\/h2>\n<p>上述智能体非常简单，通过某种算法对环境变化做出反应。因此它们是<strong>反应型智能体<\/strong>。然而，有时智能体可以进行推理和规划其行动，这种情况下它们被称为<strong>推理型智能体<\/strong>。<\/p>\n<p>一个典型的例子是个人智能体，它接收到人类的指令去预订一个度假行程。假设互联网上有许多智能体可以帮助它。它需要联系其他智能体以查看哪些航班可用，不同日期的酒店价格是多少，并尝试协商最佳价格。当度假计划完成并得到主人确认后，它可以继续预订。<\/p>\n<p>为了实现这一点，智能体需要<strong>通信<\/strong>。为了成功通信，它们需要：<\/p>\n<ul>\n<li>一些<strong>标准语言来交换知识<\/strong>，例如<a href=\"https://en.wikipedia.org/wiki/Knowledge_Interchange_Format\">知识交换格式<\/a>（KIF）和<a href=\"https://en.wikipedia.org/wiki/Knowledge_Query_and_Manipulation_Language\">知识查询与操作语言<\/a>（KQML）。这些语言基于<a href=\"https://en.wikipedia.org/wiki/Speech_act\">言语行为理论<\/a>设计。<\/li>\n<li>这些语言还应包括一些<strong>协商协议<\/strong>，基于不同的<strong>拍卖类型<\/strong>。<\/li>\n<li>一个<strong>通用本体<\/strong>，以便它们引用相同的概念并了解其语义<\/li>\n<li>一种<strong>发现<\/strong>不同智能体功能的方法，也基于某种本体<\/li>\n<\/ul>\n<p>推理型智能体比反应型智能体复杂得多，因为它们不仅对环境变化做出反应，还需要能够<em>主动<\/em>采取行动。一种提出的推理型智能体架构是所谓的信念-愿望-意图（BDI）智能体：<\/p>\n<ul>\n<li><strong>信念<\/strong>构成了智能体对环境的知识集合。它可以被结构化为知识库或智能体可以应用于环境中特定情况的一组规则。<\/li>\n<li><strong>愿望<\/strong>定义了智能体想要做什么，即它的目标。例如，上述个人助理智能体的目标是预订旅行，而酒店智能体的目标是最大化利润。<\/li>\n<li><strong>意图<\/strong>是智能体为实现其目标而计划的具体行动。行动通常会改变环境并导致与其他智能体的通信。<\/li>\n<\/ul>\n<p>有一些平台可用于构建多智能体系统，例如<a href=\"https://jade.tilab.com/\">JADE<\/a>。<a href=\"https://arxiv.org/ftp/arxiv/papers/2007/2007.08961.pdf\">这篇论文<\/a>包含了多智能体平台的综述，以及多智能体系统的简史及其不同的使用场景。<\/p>\n<h2>结论<\/h2>\n<p>多智能体系统可以采取非常不同的形式，并应用于许多不同的领域。\n它们通常专注于单个智能体的简单行为，并通过<strong>协同效应<\/strong>实现整个系统的更复杂行为。<\/p>\n<h2>🚀 挑战<\/h2>\n<p>将本课内容应用于现实世界，尝试构思一个可以解决问题的多智能体系统。例如，多智能体系统需要做些什么来优化校车路线？它如何在面包店中工作？<\/p>\n<h2><a href=\"https://ff-quizzes.netlify.app/en/ai/quiz/46\">课后测验<\/a><\/h2>\n<h2>复习与自学<\/h2>\n<p>复习这种系统在工业中的应用。选择一个领域，例如制造业或视频游戏行业，探索多智能体系统如何用于解决独特问题。<\/p>\n<h2><a href=\"#/doc/lessons/6-Other/23-MultiagentSystems/assignment.md\">NetLogo作业<\/a><\/h2>\n<hr />"},"lessons/6-Other/23-MultiagentSystems/assignment.md":{"t":"多智能体系统 · 作业","h":"<h1>NetLogo 作业<\/h1>\n<p>从 NetLogo 的库中选择一个模型，并使用它尽可能接近地模拟一个现实生活中的情境。一个很好的例子是调整“替代可视化”文件夹中的病毒模型，展示它如何用于模拟 COVID-19 的传播。你能否构建一个模拟现实生活中病毒传播的模型？<\/p>\n<p>通过保存一个副本并制作一个视频演示来展示你的工作，解释该模型如何与现实世界的情境相关联。<\/p>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原始语言的文档作为权威来源。对于关键信息，建议使用专业人工翻译。因使用本翻译而引起的任何误解或误读，我们概不负责。<\/p>"},"lessons/7-Ethics/README.md":{"t":"伦理与负责任的人工智能","h":"<h1>伦理与负责任的人工智能<\/h1>\n<p>你已经快完成这门课程了，希望到现在为止，你已经清楚地了解到人工智能是基于一系列正式的数学方法，这些方法使我们能够发现数据中的关系，并训练模型以复制人类行为的某些方面。在当下，我们认为人工智能是一种非常强大的工具，可以从数据中提取模式，并将这些模式应用于解决新的问题。<\/p>\n<h2><a href=\"https://white-water-09ec41f0f.azurestaticapps.net/quiz/5/\">课前测验<\/a><\/h2>\n<p>然而，在科幻作品中，我们经常看到人工智能对人类构成威胁的故事。这些故事通常围绕某种人工智能叛变展开，即人工智能决定与人类对抗。这暗示人工智能具有某种情感或能够做出开发者未曾预料的决定。<\/p>\n<p>我们在这门课程中学习的人工智能仅仅是大型矩阵运算。它是一种非常强大的工具，可以帮助我们解决问题，但和其他任何强大的工具一样——它既可以被用于好的目的，也可以被用于坏的目的。重要的是，它可能会被<em>滥用<\/em>。<\/p>\n<h2>负责任人工智能的原则<\/h2>\n<p>为了避免人工智能的意外或故意滥用，微软提出了重要的<a href=\"https://www.microsoft.com/ai/responsible-ai?WT.mc_id=academic-77998-cacaste\">负责任人工智能原则<\/a>。以下概念是这些原则的基础：<\/p>\n<ul>\n<li><strong>公平性<\/strong>与<em>模型偏差<\/em>这一重要问题相关，这种偏差可能是由于使用了有偏的数据进行训练。例如，当我们试图预测一个人获得软件开发职位的概率时，模型可能会更倾向于男性——仅仅因为训练数据集可能偏向男性群体。我们需要仔细平衡训练数据并调查模型以避免偏差，并确保模型考虑到更相关的特征。<\/li>\n<li><strong>可靠性与安全性<\/strong>。人工智能模型本质上可能会犯错。神经网络返回的是概率，我们需要在做决策时考虑到这一点。每个模型都有一定的精确度和召回率，我们需要理解这些指标，以防止错误建议可能造成的伤害。<\/li>\n<li><strong>隐私与安全性<\/strong>具有一些人工智能特定的影响。例如，当我们使用某些数据训练模型时，这些数据会以某种方式“整合”到模型中。一方面，这提高了安全性和隐私性，另一方面，我们需要记住模型是基于哪些数据训练的。<\/li>\n<li><strong>包容性<\/strong>意味着我们不是在构建人工智能来取代人类，而是为了增强人类的能力，使我们的工作更具创造性。这也与公平性相关，因为在处理代表性不足的群体时，我们收集的大多数数据集可能会存在偏差，我们需要确保这些群体被包括在内并被人工智能正确处理。<\/li>\n<li><strong>透明性<\/strong>。这包括确保我们始终明确人工智能的使用。此外，在可能的情况下，我们希望使用<em>可解释<\/em>的人工智能系统。<\/li>\n<li><strong>问责性<\/strong>。当人工智能模型做出某些决定时，责任归属并不总是清晰的。我们需要确保理解人工智能决策的责任归属。在大多数情况下，我们希望将人类纳入重要决策的环节，以便实际的人类承担责任。<\/li>\n<\/ul>\n<h2>负责任人工智能的工具<\/h2>\n<p>微软开发了<a href=\"https://github.com/microsoft/responsible-ai-toolbox\">负责任人工智能工具箱<\/a>，其中包含一系列工具：<\/p>\n<ul>\n<li>可解释性仪表板 (InterpretML)<\/li>\n<li>公平性仪表板 (FairLearn)<\/li>\n<li>错误分析仪表板<\/li>\n<li>\n<p>负责任人工智能仪表板，包括：<\/p>\n<\/li>\n<li>\n<p>EconML - 用于因果分析的工具，专注于假设性问题<\/p>\n<\/li>\n<li>DiCE - 用于反事实分析的工具，允许你查看需要更改哪些特征以影响模型的决策<\/li>\n<\/ul>\n<p>关于人工智能伦理的更多信息，请访问机器学习课程中的<a href=\"https://github.com/microsoft/ML-For-Beginners/tree/main/1-Introduction/3-fairness?WT.mc_id=academic-77998-cacaste\">这一课<\/a>，其中包括相关作业。<\/p>\n<h2>复习与自学<\/h2>\n<p>通过这个<a href=\"https://docs.microsoft.com/learn/modules/responsible-ai-principles/?WT.mc_id=academic-77998-cacaste\">学习路径<\/a>了解更多关于负责任人工智能的内容。<\/p>\n<h2><a href=\"https://white-water-09ec41f0f.azurestaticapps.net/quiz/6/\">课后测验<\/a><\/h2>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原文档的原始语言版本为权威来源。对于关键信息，建议使用专业人工翻译。我们对因使用此翻译而引起的任何误解或误读不承担责任。<\/p>"},"lessons/X-Extras/X1-MultiModal/README.md":{"t":"多模态网络","h":"<h1>多模态网络<\/h1>\n<p>在Transformer模型成功解决NLP任务后，相同或类似的架构也被应用于计算机视觉任务。越来越多的人开始关注构建能够<em>结合<\/em>视觉和自然语言能力的模型。其中一个尝试是由OpenAI完成的，称为CLIP和DALL.E。<\/p>\n<h2>对比图像预训练（CLIP）<\/h2>\n<p>CLIP的核心思想是能够比较文本提示与图像，并确定图像与提示的匹配程度。<\/p>\n<p><img alt=\"CLIP架构\" src=\"../translated_images/zh-CN/clip-arch.b3dbf20b4e8ed8be.webp\" /><\/p>\n<blockquote>\n<p><em>图片来源于<a href=\"https://openai.com/blog/clip/\">这篇博客<\/a><\/em><\/p>\n<\/blockquote>\n<p>该模型通过从互联网获取的图像及其标题进行训练。对于每个批次，我们获取N对（图像，文本），并将它们转换为一些向量表示I，..., I / T，..., T。这些表示随后进行匹配。损失函数的定义是最大化对应一对（例如I和T）的向量之间的余弦相似度，同时最小化所有其他对之间的余弦相似度。这就是为什么这种方法被称为<strong>对比学习<\/strong>。<\/p>\n<p>CLIP模型/库可以从<a href=\"https://github.com/openai/CLIP\">OpenAI GitHub<\/a>获取。该方法在<a href=\"https://openai.com/blog/clip/\">这篇博客<\/a>中有所描述，并在<a href=\"https://arxiv.org/pdf/2103.00020.pdf\">这篇论文<\/a>中有更详细的说明。<\/p>\n<p>一旦该模型被预训练，我们可以给它一批图像和一批文本提示，它将返回一个概率张量。CLIP可以用于以下任务：<\/p>\n<p><strong>图像分类<\/strong><\/p>\n<p>假设我们需要将图像分类为猫、狗和人类。在这种情况下，我们可以给模型一个图像，以及一系列文本提示：“<em>一张猫的图片<\/em>”、“<em>一张狗的图片<\/em>”、“<em>一张人类的图片<\/em>”。在结果的3个概率向量中，我们只需选择值最高的索引。<\/p>\n<p><img alt=\"CLIP用于图像分类\" src=\"../translated_images/zh-CN/clip-class.3af42ef0b2b19369.webp\" /><\/p>\n<blockquote>\n<p><em>图片来源于<a href=\"https://openai.com/blog/clip/\">这篇博客<\/a><\/em><\/p>\n<\/blockquote>\n<p><strong>基于文本的图像搜索<\/strong><\/p>\n<p>我们也可以反过来操作。如果我们有一组图像，我们可以将这组图像传递给模型，并提供一个文本提示——这将返回与给定提示最相似的图像。<\/p>\n<h2>✍️ 示例：<a href=\"https://raw.githubusercontent.com/songbing1521/AI-For-Beginners-zh-CN/main/lessons/X-Extras/X1-MultiModal/Clip.ipynb\">使用CLIP进行图像分类和图像搜索<\/a><\/h2>\n<p>打开<a href=\"https://raw.githubusercontent.com/songbing1521/AI-For-Beginners-zh-CN/main/lessons/X-Extras/X1-MultiModal/Clip.ipynb\">Clip.ipynb<\/a>笔记本，查看CLIP的实际应用。<\/p>\n<h2>使用VQGAN+CLIP进行图像生成<\/h2>\n<p>CLIP还可以用于从文本提示生成<strong>图像<\/strong>。为了实现这一点，我们需要一个<strong>生成器模型<\/strong>，能够根据某些向量输入生成图像。其中一个这样的模型称为<a href=\"https://compvis.github.io/taming-transformers/\">VQGAN<\/a>（向量量化GAN）。<\/p>\n<p>VQGAN与普通<a href=\"#/doc/lessons/4-ComputerVision/10-GANs/README.md\">GAN<\/a>的主要区别在于以下几点：\n* 使用自回归Transformer架构生成一系列上下文丰富的视觉部分，这些部分组成图像。这些视觉部分由<a href=\"#/doc/lessons/4-ComputerVision/07-ConvNets/README.md\">卷积神经网络（CNN）<\/a>学习。\n* 使用子图像判别器来检测图像的部分是“真实”还是“伪造”（与传统GAN的“全或无”方法不同）。<\/p>\n<p>可以在<a href=\"https://compvis.github.io/taming-transformers/\">Taming Transformers<\/a>网站上了解更多关于VQGAN的信息。<\/p>\n<p>VQGAN与传统GAN的一个重要区别在于，后者可以从任何输入向量生成一个不错的图像，而VQGAN可能生成一个不连贯的图像。因此，我们需要进一步引导图像创建过程，这可以通过CLIP来实现。<\/p>\n<p><img alt=\"VQGAN+CLIP架构\" src=\"../translated_images/zh-CN/vqgan.5027fe05051dfa31.webp\" /><\/p>\n<p>为了生成与文本提示相对应的图像，我们从一些随机编码向量开始，将其传递给VQGAN以生成图像。然后使用CLIP生成一个损失函数，显示图像与文本提示的匹配程度。目标是通过反向传播调整输入向量参数以最小化该损失。<\/p>\n<p>一个实现VQGAN+CLIP的优秀库是<a href=\"http://github.com/pixray/pixray\">Pixray<\/a>。<\/p>\n<table>\n<thead>\n<tr>\n<th><img alt=\"Pixray生成的图片\" src=\"../translated_images/zh-CN/a_closeup_watercolor_portrait_of_young_male_teacher_of_literature_with_a_book.2384968e9db8a0d0.webp\" /><\/th>\n<th><img alt=\"Pixray生成的图片\" src=\"../translated_images/zh-CN/a_closeup_oil_portrait_of_young_female_teacher_of_computer_science_with_a_computer.e0b6495f210a4390.webp\" /><\/th>\n<th><img alt=\"Pixray生成的图片\" src=\"../translated_images/zh-CN/a_closeup_oil_portrait_of_old_male_teacher_of_math.5362e67aa7fc2683.webp\" /><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>从提示<em>一张年轻男性文学教师拿着书的水彩特写肖像<\/em>生成的图片<\/td>\n<td>从提示<em>一张年轻女性计算机科学教师拿着电脑的油画特写肖像<\/em>生成的图片<\/td>\n<td>从提示<em>一张老年男性数学教师站在黑板前的油画特写肖像<\/em>生成的图片<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>图片来自<strong>人工教师<\/strong>系列，由<a href=\"http://soshnikov.com\">Dmitry Soshnikov<\/a>创作<\/p>\n<\/blockquote>\n<h2>DALL-E<\/h2>\n<h3><a href=\"https://openai.com/research/dall-e\">DALL-E 1<\/a><\/h3>\n<p>DALL-E是一个基于GPT-3的版本，能够根据提示生成图像。它使用了120亿参数进行训练。<\/p>\n<p>与CLIP不同，DALL-E将文本和图像作为一个单一的令牌流输入。因此，可以根据多个提示生成图像。<\/p>\n<h3><a href=\"https://openai.com/dall-e-2\">DALL-E 2<\/a><\/h3>\n<p>DALL-E 1和2的主要区别在于，后者能够生成更真实的图像和艺术作品。<\/p>\n<p>以下是使用DALL-E生成图像的示例：\n<img alt=\"DALL-E生成的图片\" src=\"../translated_images/zh-CN/DALL%C2%B7E%202023-06-20%2015.56.56%20-%20a%20closeup%20watercolor%20portrait%20of%20young%20male%20teacher%20of%20literature%20with%20a%20book.56499a0c282407c9.webp\" /> |  <img alt=\"DALL-E生成的图片\" src=\"../translated_images/zh-CN/DALL%C2%B7E%202023-06-20%2015.57.43%20-%20a%20closeup%20oil%20portrait%20of%20young%20female%20teacher%20of%20computer%20science%20with%20a%20computer.081e8aed073e2fbf.webp\" /> | <img alt=\"DALL-E生成的图片\" src=\"../translated_images/zh-CN/DALL%C2%B7E%202023-06-20%2015.58.42%20-%20%20a%20closeup%20oil%20portrait%20of%20old%20male%20teacher%20of%20mathematics%20in%20front%20of%20blackboard.534175cf58a361d9.webp\" />\n----|----|----\n从提示<em>一张年轻男性文学教师拿着书的水彩特写肖像<\/em>生成的图片 | 从提示<em>一张年轻女性计算机科学教师拿着电脑的油画特写肖像<\/em>生成的图片 | 从提示<em>一张老年男性数学教师站在黑板前的油画特写肖像<\/em>生成的图片<\/p>\n<h2>参考文献<\/h2>\n<ul>\n<li>VQGAN论文：<a href=\"https://compvis.github.io/taming-transformers/paper/paper.pdf\">Taming Transformers for High-Resolution Image Synthesis<\/a><\/li>\n<li>CLIP论文：<a href=\"https://arxiv.org/pdf/2103.00020.pdf\">Learning Transferable Visual Models From Natural Language Supervision<\/a><\/li>\n<\/ul>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原始语言的文档作为权威来源。对于关键信息，建议使用专业人工翻译。我们对因使用此翻译而引起的任何误解或误读不承担责任。<\/p>"},"etc/Mindmap.md":{"t":"AI","h":"<h1>AI<\/h1>\n<h2><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/1-Intro/README.md\">AI简介<\/a><\/h2>\n<ul>\n<li>AI定义<\/li>\n<li>AI历史<\/li>\n<li>AI方法<ul>\n<li>自上而下/符号主义<\/li>\n<li>自下而上/神经<\/li>\n<li>进化<\/li>\n<li>协同 / 新兴AI<\/li>\n<\/ul>\n<\/li>\n<li><a href=\"https://www.microsoft.com/ai/ai-business-school/?WT.mc_id=academic-77998-cacaste\">微软AI商业学院<\/a><\/li>\n<\/ul>\n<h2><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/2-Symbolic/README.md\">符号AI<\/a><\/h2>\n<ul>\n<li>知识表示<\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/2-Symbolic/Animals.ipynb\">专家系统<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/2-Symbolic/FamilyOntology.ipynb\">本体论<\/a><\/li>\n<li>语义网<\/li>\n<\/ul>\n<h2><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/3-NeuralNetworks/README.md\">神经网络<\/a><\/h2>\n<ul>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/3-NeuralNetworks/03-Perceptron/README.md\">感知器<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/3-NeuralNetworks/04-OwnFramework/README.md\">多层网络<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/3-NeuralNetworks/05-Frameworks/README.md\">框架简介<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/3-NeuralNetworks/05-Frameworks/IntroPyTorch.ipynb\">PyTorch<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/3-NeuralNetworks/05-Frameworks/IntroKerasTF.md\">TensorFlow<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/3-NeuralNetworks/05-Frameworks/Overfitting.md\">过拟合<\/a><\/li>\n<\/ul>\n<h2><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/4-ComputerVision/README.md\">计算机视觉<\/a><\/h2>\n<ul>\n<li>在微软学习平台<ul>\n<li><a href=\"https://docs.microsoft.com/learn/paths/explore-computer-vision-microsoft-azure/?WT.mc_id=academic-77998-cacaste\">AI基础：探索计算机视觉<\/a><\/li>\n<li><a href=\"https://docs.microsoft.com/learn/modules/intro-computer-vision-pytorch/?WT.mc_id=academic-77998-cacaste\">使用PyTorch的计算机视觉<\/a><\/li>\n<li><a href=\"https://docs.microsoft.com/learn/modules/intro-computer-vision-TensorFlow/?WT.mc_id=academic-77998-cacaste\">使用TensorFlow的计算机视觉<\/a><\/li>\n<\/ul>\n<\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/4-ComputerVision/06-IntroCV/README.md\">CV简介。OpenCV<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/4-ComputerVision/07-ConvNets/README.md\">卷积网络<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/4-ComputerVision/07-ConvNets/CNN_Architectures.md\">CNN架构<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/4-ComputerVision/08-TransferLearning/README.md\">迁移学习<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/4-ComputerVision/08-TransferLearning/TrainingTricks.md\">训练技巧<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/4-ComputerVision/09-Autoencoders/README.md\">自动编码器和变分自动编码器<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/4-ComputerVision/10-GANs/README.md\">生成对抗网络<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/4-ComputerVision/10-GANs/StyleTransfer.ipynb\">风格迁移<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/4-ComputerVision/11-ObjectDetection/README.md\">目标检测<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/4-ComputerVision/12-Segmentation/README.md\">分割<\/a><\/li>\n<\/ul>\n<h2><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/5-NLP/README.md\">自然语言处理<\/a><\/h2>\n<ul>\n<li>在微软学习平台<ul>\n<li><a href=\"https://docs.microsoft.com/learn/paths/explore-natural-language-processing/?WT.mc_id=academic-77998-cacaste\">AI基础：探索自然语言处理<\/a><\/li>\n<li><a href=\"https://docs.microsoft.com/learn/modules/intro-natural-language-processing-pytorch/?WT.mc_id=academic-77998-cacaste\">使用PyTorch的NLP<\/a><\/li>\n<li><a href=\"https://docs.microsoft.com/learn/modules/intro-natural-language-processing-TensorFlow/?WT.mc_id=academic-77998-cacaste\">使用TensorFlow的NLP<\/a><\/li>\n<\/ul>\n<\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/5-NLP/13-TextRep/README.md\">文本表示<\/a><ul>\n<li>词袋模型<\/li>\n<li>TF/IDF<\/li>\n<\/ul>\n<\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/5-NLP/14-Embeddings/README.md\">语义嵌入<\/a><ul>\n<li>Word2Vec<\/li>\n<li>GloVE<\/li>\n<\/ul>\n<\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/5-NLP/15-LanguageModeling\">语言建模<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/5-NLP/16-RNN/README.md\">循环神经网络<\/a><ul>\n<li>LSTM<\/li>\n<li>GRU<\/li>\n<\/ul>\n<\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/5-NLP/17-GenerativeNetworks/README.md\">生成性循环网络<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/5-NLP/18-Transformers/README.md\">Transformers和BERT<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/5-NLP/19-NER/README.md\">命名实体识别<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/5-NLP/20-LanguageModels/README.md\">文本生成和GPT<\/a><\/li>\n<\/ul>\n<h2>其他技术<\/h2>\n<ul>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/6-Other/21-GeneticAlgorithms/README.md\">遗传算法<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/6-Other/22-DeepRL/README.md\">深度强化学习<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/6-Other/23-MultiagentSystems/README.md\">多智能体系统<\/a><\/li>\n<\/ul>\n<h2><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/7-Ethics/README.md\">AI伦理<\/a><\/h2>\n<ul>\n<li><a href=\"https://docs.microsoft.com/learn/paths/responsible-ai-business-principles/?WT.mc_id=academic-77998-cacaste\">微软学习：负责任的AI<\/a><\/li>\n<\/ul>\n<h2>额外内容<\/h2>\n<ul>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/X-Extras/X1-MultiModal/README.md\">多模态网络<\/a><\/li>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/lessons/X-Extras/X1-MultiModal/Clip.ipynb\">CLIP<\/a><\/li>\n<li>DALL-E<\/li>\n<li>VQ-GAN<\/li>\n<\/ul>\n<hr />\n<!-- CO-OP TRANSLATOR DISCLAIMER START -->\n<p><strong>免责声明<\/strong>：<br />\n本文件使用 AI 翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 翻译。虽然我们力求准确，但请注意，自动翻译可能包含错误或不准确之处。原始语言的文件应被视为权威来源。对于关键信息，建议使用专业人工翻译。对于因使用本翻译而产生的任何误解或误读，我们不承担任何责任。<\/p>\n<!-- CO-OP TRANSLATOR DISCLAIMER END -->"},"troubleshoot.md":{"t":"AI-For-Beginners 故障排查指南","h":"<h1>AI-For-Beginners 故障排查指南<\/h1>\n<p>本指南旨在帮助您解决使用或贡献 <a href=\"https://github.com/microsoft/AI-For-Beginners\">AI-For-Beginners<\/a> 仓库时遇到的常见问题。每个问题都包括背景信息、症状、原因解释以及逐步解决方案。<\/p>\n<hr />\n<h2>目录<\/h2>\n<ul>\n<li><a href=\"../.\">常见问题<\/a><\/li>\n<li><a href=\"../.\">安装问题<\/a><\/li>\n<li><a href=\"../.\">配置问题<\/a><\/li>\n<li><a href=\"../.\">运行笔记本<\/a><\/li>\n<li><a href=\"../.\">性能问题<\/a><\/li>\n<li><a href=\"../.\">教材网站问题<\/a><\/li>\n<li><a href=\"../.\">贡献问题<\/a><\/li>\n<li><a href=\"../.\">常见问答<\/a><\/li>\n<li><a href=\"../.\">获取帮助<\/a><\/li>\n<\/ul>\n<hr />\n<h2>常见问题<\/h2>\n<h3>1. 仓库无法正确克隆<\/h3>\n<p><strong>背景：<\/strong> 克隆操作可以将仓库复制到您的机器上。<\/p>\n<p><strong>症状：<\/strong>\n- 错误：<code>fatal: repository not found<\/code>\n- 错误：<code>Permission denied (publickey)<\/code><\/p>\n<p><strong>可能原因：<\/strong>\n- 仓库 URL 不正确\n- 权限不足\n- SSH 密钥未配置<\/p>\n<p><strong>解决方案：<\/strong>\n1. <strong>检查仓库 URL。<\/strong><br />\n   使用 HTTPS URL：<br />\n<code>git clone https://github.com/microsoft/AI-For-Beginners.git<\/code>\n2. <strong>如果 SSH 失败，切换到 HTTPS。<\/strong><br />\n   如果出现 <code>Permission denied (publickey)<\/code> 错误，请使用上述 HTTPS 链接代替 SSH。\n3. <strong>配置 SSH 密钥（可选）。<\/strong><br />\n   如果您希望使用 SSH，请参考 <a href=\"https://docs.github.com/en/authentication/connecting-to-github-with-ssh\">GitHub 的 SSH 指南<\/a>。<\/p>\n<hr />\n<h2>安装问题<\/h2>\n<h3>2. Python 环境问题<\/h3>\n<p><strong>背景：<\/strong> 仓库依赖于 Python 和各种库。<\/p>\n<p><strong>症状：<\/strong>\n- 错误：<code>ModuleNotFoundError: No module named '&lt;package&gt;'<\/code>\n- 运行脚本或笔记本时出现导入错误<\/p>\n<p><strong>可能原因：<\/strong>\n- 依赖未安装\n- Python 版本错误<\/p>\n<p><strong>解决方案：<\/strong>\n1. <strong>设置虚拟环境。<\/strong><br />\n<code>bash\n   python -m venv venv\n   source venv/bin/activate   # On Windows: venv\\Scripts\\activate<\/code>\n2. <strong>安装依赖项。<\/strong><br />\n<code>bash\n   pip install -r requirements.txt<\/code>\n3. <strong>检查 Python 版本。<\/strong><br />\n   使用 Python 3.7 或更高版本。<br />\n<code>bash\n   python --version<\/code><\/p>\n<h3>3. 未安装 Jupyter<\/h3>\n<p><strong>背景：<\/strong> 笔记本是核心学习资源。<\/p>\n<p><strong>症状：<\/strong>\n- 错误：<code>jupyter: command not found<\/code>\n- 笔记本无法启动<\/p>\n<p><strong>可能原因：<\/strong>\n- 未安装 Jupyter<\/p>\n<p><strong>解决方案：<\/strong>\n1. <strong>安装 Jupyter Notebook。<\/strong><br />\n<code>bash\n   pip install notebook<\/code>\n   或者，如果使用 Anaconda：\n   <code>bash\n   conda install notebook<\/code>\n2. <strong>启动 Jupyter Notebook。<\/strong><br />\n<code>bash\n   jupyter notebook<\/code><\/p>\n<h3>4. 依赖版本冲突<\/h3>\n<p><strong>背景：<\/strong> 如果包版本不匹配，项目可能会出现问题。<\/p>\n<p><strong>症状：<\/strong>\n- 关于版本不兼容的错误或警告<\/p>\n<p><strong>可能原因：<\/strong>\n- 旧的或冲突的 Python 包<\/p>\n<p><strong>解决方案：<\/strong>\n1. <strong>在干净的环境中安装。<\/strong><br />\n   删除旧的 venv/conda 环境并创建一个新的。\n2. <strong>使用指定版本。<\/strong><br />\n   始终运行：\n   <code>bash\n   pip install -r requirements.txt<\/code>\n   如果失败，请按照 README 手动安装缺失的包。<\/p>\n<hr />\n<h2>配置问题<\/h2>\n<h3>5. 环境变量未设置<\/h3>\n<p><strong>背景：<\/strong> 某些模块可能需要密钥、令牌或配置设置。<\/p>\n<p><strong>症状：<\/strong>\n- 错误：<code>KeyError<\/code> 或关于缺少配置的警告<\/p>\n<p><strong>可能原因：<\/strong>\n- 必需的环境变量未设置<\/p>\n<p><strong>解决方案：<\/strong>\n1. <strong>检查 <code>.env.example<\/code> 或类似文件。<\/strong>\n2. <strong>创建 <code>.env<\/code> 文件并填写所需值。<\/strong>\n3. <strong>设置环境变量后重新加载终端或 IDE。<\/strong><\/p>\n<hr />\n<h2>运行笔记本<\/h2>\n<h3>6. 笔记本无法打开或运行<\/h3>\n<p><strong>背景：<\/strong> Jupyter 笔记本需要正确的设置。<\/p>\n<p><strong>症状：<\/strong>\n- 笔记本无法启动\n- 浏览器未自动打开<\/p>\n<p><strong>可能原因：<\/strong>\n- 未安装 Jupyter\n- 浏览器配置问题<\/p>\n<p><strong>解决方案：<\/strong>\n1. <strong>安装 Jupyter（参见安装问题部分）。<\/strong>\n2. <strong>手动打开笔记本。<\/strong>\n   - 从终端复制 URL（例如 <code>http://localhost:8888/?token=...<\/code>），并将其粘贴到浏览器中。<\/p>\n<h3>7. 内核崩溃或冻结<\/h3>\n<p><strong>背景：<\/strong> 笔记本内核可能因资源限制或代码错误而崩溃。<\/p>\n<p><strong>症状：<\/strong>\n- 内核反复崩溃或重启\n- 内存不足错误<\/p>\n<p><strong>可能原因：<\/strong>\n- 数据集过大\n- 不兼容的代码或包<\/p>\n<p><strong>解决方案：<\/strong>\n1. <strong>重启内核。<\/strong><br />\n   使用 Jupyter 中的“重启内核”按钮。\n2. <strong>检查内存使用情况。<\/strong><br />\n   关闭未使用的应用程序。\n3. <strong>在云平台上运行笔记本。<\/strong><br />\n   使用 <a href=\"https://colab.research.google.com/\">Google Colab<\/a> 或 <a href=\"https://notebooks.azure.com/\">Azure Notebooks<\/a>。<\/p>\n<hr />\n<h2>性能问题<\/h2>\n<h3>8. 笔记本运行缓慢<\/h3>\n<p><strong>背景：<\/strong> 某些 AI 任务需要大量内存和 CPU。<\/p>\n<p><strong>症状：<\/strong>\n- 执行速度慢\n- 笔记本电脑风扇声音很大<\/p>\n<p><strong>可能原因：<\/strong>\n- 数据集或模型过大\n- 系统资源有限<\/p>\n<p><strong>解决方案：<\/strong>\n1. <strong>使用云平台。<\/strong>\n   - 将笔记本上传到 Colab 或 Azure Notebooks。\n2. <strong>减少数据集大小。<\/strong>\n   - 使用样本数据进行练习。\n3. <strong>关闭不必要的程序。<\/strong>\n   - 释放系统内存。<\/p>\n<hr />\n<h2>教材网站问题<\/h2>\n<h3>9. 章节无法加载<\/h3>\n<p><strong>背景：<\/strong> 在线教材显示课程和章节内容。<\/p>\n<p><strong>症状：<\/strong>\n- 某章节（例如 Transformers/BERT）缺失或无法打开<\/p>\n<p><strong>已知问题：<\/strong><br />\n- <a href=\"https://github.com/microsoft/AI-For-Beginners/issues/303\">问题 #303<\/a>：“第 18 章 Transformers. BERT 无法在教材网站上打开。” 原因是文件名错误（<code>READMEtransformers.md<\/code> 而不是 <code>README.md<\/code>）。<\/p>\n<p><strong>解决方案：<\/strong>\n1. <strong>检查文件重命名错误。<\/strong><br />\n   如果您是贡献者，请确保章节文件命名为 <code>README.md<\/code>。\n2. <strong>报告缺失文件。<\/strong><br />\n   在 GitHub 上提交问题，注明章节名称和错误详情。<\/p>\n<hr />\n<h2>贡献问题<\/h2>\n<h3>10. PR 未被接受或构建失败<\/h3>\n<p><strong>背景：<\/strong> 贡献必须通过测试并遵循指南。<\/p>\n<p><strong>症状：<\/strong>\n- 拉取请求被拒绝\n- CI/CD 管道错误<\/p>\n<p><strong>可能原因：<\/strong>\n- 测试失败\n- 未遵循编码标准<\/p>\n<p><strong>解决方案：<\/strong>\n1. <strong>阅读贡献指南。<\/strong>\n   - 遵循仓库的 <a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/CONTRIBUTING.md\">CONTRIBUTING.md<\/a>。\n2. <strong>在推送之前本地运行测试。<\/strong>\n3. <strong>检查代码格式或 linting 规则。<\/strong><\/p>\n<hr />\n<h2>常见问答<\/h2>\n<h3>哪里可以找到特定模块的帮助？<\/h3>\n<ul>\n<li>每个模块通常都有自己的 README。从那里开始了解设置和使用技巧。<\/li>\n<\/ul>\n<h3>如何报告错误或请求新功能？<\/h3>\n<ul>\n<li><a href=\"https://github.com/microsoft/AI-For-Beginners/issues/new\">提交 GitHub 问题<\/a>，并提供清晰的描述和复现步骤。<\/li>\n<\/ul>\n<h3>如果我的问题未列出，可以寻求帮助吗？<\/h3>\n<ul>\n<li>可以！先搜索现有问题，如果没有找到您的问题，请创建一个新问题。<\/li>\n<\/ul>\n<hr />\n<h2>获取帮助<\/h2>\n<ul>\n<li><strong>检查问题：<\/strong> <a href=\"https://github.com/microsoft/AI-For-Beginners/issues\">GitHub Issues<\/a><\/li>\n<li><strong>提问：<\/strong> 使用 GitHub Discussions 或提交问题。<\/li>\n<li><strong>社区：<\/strong> 查看仓库链接以获取聊天/论坛选项。<\/li>\n<\/ul>\n<hr />\n<p><em>最后更新：2025-09-20<\/em><\/p>\n<hr />\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。原始语言的文档应被视为权威来源。对于关键信息，建议使用专业人工翻译。我们对因使用此翻译而产生的任何误解或误读不承担责任。<\/p>"},"lessons/sketchnotes/README.md":{"t":"README.md","h":"<p>所有课程的手绘笔记可以在这里下载。<\/p>\n<p>🎨 由以下作者创作：Tomomi Imura（Twitter: <a href=\"https://twitter.com/girlie_mac\">@girlie_mac<\/a>，GitHub: <a href=\"https://github.com/girliemac\">girliemac<\/a>）<\/p>\n<p><a href=\"https://creativecommons.org/licenses/by-sa/4.0/\"><img alt=\"CC BY-SA 4.0\" src=\"https://img.shields.io/badge/License-CC%20BY--SA%204.0-lightgrey.svg\" /><\/a><\/p>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原文档的原始语言版本为权威来源。对于关键信息，建议使用专业人工翻译。我们对于因使用本翻译而引起的任何误解或误读不承担责任。<\/p>"},"examples/README.md":{"t":"适合初学者的 AI 示例","h":"<h1>适合初学者的 AI 示例<\/h1>\n<p>欢迎！该目录包含简单的独立示例，帮助您入门 AI 和机器学习。每个示例都设计得适合初学者，配有详细注释和逐步解释。<\/p>\n<h2>📚 示例概览<\/h2>\n<table>\n<thead>\n<tr>\n<th>示例<\/th>\n<th>描述<\/th>\n<th>难度<\/th>\n<th>先决条件<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/examples/01-hello-ai-world.py\">Hello AI World<\/a><\/td>\n<td>你的第一个 AI 程序 - 简单的模式识别<\/td>\n<td>⭐ 初学者<\/td>\n<td>Python 基础<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/examples/02-simple-neural-network.py\">简单神经网络<\/a><\/td>\n<td>从零搭建神经网络<\/td>\n<td>⭐⭐ 初学者+<\/td>\n<td>Python，基础数学<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/examples/03-image-classifier.ipynb\">图像分类器<\/a><\/td>\n<td>使用预训练模型分类图像<\/td>\n<td>⭐⭐ 初学者+<\/td>\n<td>Python，numpy<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://github.com/microsoft/AI-For-Beginners/blob/main/examples/04-text-sentiment.py\">文本情感分析<\/a><\/td>\n<td>分析文本情感（正面/负面）<\/td>\n<td>⭐⭐ 初学者+<\/td>\n<td>Python<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>🚀 快速开始<\/h2>\n<h3>先决条件<\/h3>\n<p>请确保安装了 Python（推荐版本 3.8 及以上）。安装所需的包：<\/p>\n<pre><code class=\"language-bash\"># 用于Python脚本\npip install numpy\n\n# 用于Jupyter笔记本（图像分类器）\npip install jupyter numpy pillow tensorflow\n<\/code><\/pre>\n<p>或者使用主课程中的 conda 环境：<\/p>\n<pre><code class=\"language-bash\">conda env create --name ai4beg --file ../environment.yml\nconda activate ai4beg\n<\/code><\/pre>\n<h3>运行示例<\/h3>\n<p><strong>对于 Python 脚本（.py 文件）：<\/strong><\/p>\n<pre><code class=\"language-bash\">python 01-hello-ai-world.py\n<\/code><\/pre>\n<p><strong>对于 Jupyter 笔记本（.ipynb 文件）：<\/strong><\/p>\n<pre><code class=\"language-bash\">jupyter notebook 03-image-classifier.ipynb\n<\/code><\/pre>\n<h2>📖 学习路径<\/h2>\n<p>我们建议按顺序完成以下示例：<\/p>\n<ol>\n<li><strong>从 “Hello AI World” 开始<\/strong> - 学习模式识别基础<\/li>\n<li><strong>构建一个简单神经网络<\/strong> - 理解神经网络的工作原理<\/li>\n<li><strong>尝试图像分类器<\/strong> - 体验 AI 在真实图像中的应用<\/li>\n<li><strong>分析文本情感<\/strong> - 探索自然语言处理<\/li>\n<\/ol>\n<h2>💡 初学者提示<\/h2>\n<ul>\n<li><strong>仔细阅读代码注释<\/strong> - 它们解释了每行代码的作用<\/li>\n<li><strong>多多实验！<\/strong> - 尝试修改数值，观察结果<\/li>\n<li><strong>不用担心一开始理解全部内容<\/strong> - 学习需要时间<\/li>\n<li><strong>有问题就问<\/strong> - 使用<a href=\"https://github.com/microsoft/AI-For-Beginners/discussions\">讨论区<\/a><\/li>\n<\/ul>\n<h2>🔗 后续步骤<\/h2>\n<p>完成这些示例后，继续探索完整课程：\n- <a href=\"#/doc/lessons/1-Intro/README.md\">AI 入门介绍<\/a>\n- <a href=\"#/doc/lessons/3-NeuralNetworks/README.md\">神经网络<\/a>\n- <a href=\"#/doc/lessons/4-ComputerVision/README.md\">计算机视觉<\/a>\n- <a href=\"#/doc/lessons/5-NLP/README.md\">自然语言处理<\/a><\/p>\n<h2>🤝 贡献指南<\/h2>\n<p>觉得这些示例有帮助吗？帮助我们改进它们：\n- 报告问题或提出改进建议\n- 添加更多适合初学者的示例\n- 改进文档和注释<\/p>\n<hr />\n<p><em>记住：每个专家都曾是初学者。祝学习愉快！🎓<\/em><\/p>\n<hr />\n<!-- CO-OP TRANSLATOR DISCLAIMER START -->\n<p><strong>免责声明<\/strong>：\n本文件由 AI 翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 翻译完成。尽管我们力求准确，但请注意，自动翻译可能包含错误或不准确之处。原始语言版文件应视为权威来源。对于重要信息，建议使用专业人工翻译。我们对因使用本翻译而产生的任何误解或误释不承担责任。<\/p>\n<!-- CO-OP TRANSLATOR DISCLAIMER END -->"},"etc/quiz-app/README.md":{"t":"测验","h":"<h1>测验<\/h1>\n<p>这些测验是 AI 课程（https://aka.ms/ai-beginners）的课前和课后测验。<\/p>\n<h2>添加翻译后的测验集<\/h2>\n<p>通过在 <code>assets/translations<\/code> 文件夹中创建相应的测验结构来添加测验翻译。原始测验位于 <code>assets/translations/en<\/code> 文件夹中。测验按照课程分为多个组别。请确保编号与正确的测验部分对齐。整个课程共有 40 个测验，编号从 0 开始。<\/p>\n<p>编辑翻译内容后，修改翻译文件夹中的 <code>index.js<\/code> 文件，按照 <code>en<\/code> 文件夹中的约定导入所有文件。<\/p>\n<p>接着，编辑 <code>assets/translations<\/code> 文件夹中的 <code>index.js<\/code> 文件，导入新翻译的文件。<\/p>\n<p>然后，编辑此应用中的 <code>App.vue<\/code> 文件中的下拉菜单，添加您的语言。确保本地化缩写与您的语言文件夹名称匹配。<\/p>\n<p>最后，编辑翻译课程中的所有测验链接（如果存在），将本地化作为查询参数添加，例如：<code>?loc=fr<\/code>。<\/p>\n<h2>项目设置<\/h2>\n<pre><code>npm install\n<\/code><\/pre>\n<h3>编译并热加载用于开发<\/h3>\n<pre><code>npm run serve\n<\/code><\/pre>\n<h3>编译并压缩用于生产<\/h3>\n<pre><code>npm run build\n<\/code><\/pre>\n<h3>检查并修复文件<\/h3>\n<pre><code>npm run lint\n<\/code><\/pre>\n<h3>自定义配置<\/h3>\n<p>请参阅 <a href=\"https://cli.vuejs.org/config/\">配置参考<\/a>。<\/p>\n<p>致谢：感谢此测验应用的原始版本：https://github.com/arpan45/simple-quiz-vue<\/p>\n<h2>部署到 Azure<\/h2>\n<p>以下是帮助您入门的分步指南：<\/p>\n<ol>\n<li>\n<p>Fork GitHub 仓库<br />\n确保您的静态 Web 应用代码在 GitHub 仓库中。Fork 此仓库。<\/p>\n<\/li>\n<li>\n<p>创建 Azure 静态 Web 应用<br />\n- 创建一个 <a href=\"http://azure.microsoft.com\">Azure 账户<\/a><br />\n- 访问 <a href=\"https://portal.azure.com\">Azure 门户<\/a><br />\n- 点击“创建资源”，搜索“静态 Web 应用”。<br />\n- 点击“创建”。<\/p>\n<\/li>\n<li>\n<p>配置静态 Web 应用<br />\n- 基本信息：<br />\n  - 订阅：选择您的 Azure 订阅。<br />\n  - 资源组：创建一个新的资源组或使用现有的资源组。<br />\n  - 名称：为您的静态 Web 应用提供一个名称。<br />\n  - 区域：选择离您的用户最近的区域。<\/p>\n<\/li>\n<\/ol>\n<ul>\n<li>\n<h4>部署详情：<\/h4>\n<\/li>\n<li>源：选择“GitHub”。  <\/li>\n<li>GitHub 账户：授权 Azure 访问您的 GitHub 账户。  <\/li>\n<li>组织：选择您的 GitHub 组织。  <\/li>\n<li>仓库：选择包含静态 Web 应用的仓库。  <\/li>\n<li>\n<p>分支：选择您要部署的分支。<\/p>\n<\/li>\n<li>\n<h4>构建详情：<\/h4>\n<\/li>\n<li>构建预设：选择您的应用所使用的框架（例如 React、Angular、Vue 等）。  <\/li>\n<li>应用位置：指定包含应用代码的文件夹（例如，如果在根目录，则为 /）。  <\/li>\n<li>API 位置：如果有 API，请指定其位置（可选）。  <\/li>\n<li>输出位置：指定生成的构建输出所在的文件夹（例如 build 或 dist）。<\/li>\n<\/ul>\n<ol start=\"4\">\n<li>\n<p>审核并创建<br />\n审核您的设置并点击“创建”。Azure 将设置必要的资源，并在您的仓库中创建一个 GitHub Actions 工作流。<\/p>\n<\/li>\n<li>\n<p>GitHub Actions 工作流<br />\nAzure 会自动在您的仓库中创建一个 GitHub Actions 工作流文件（.github/workflows/azure-static-web-apps-<name>.yml）。此工作流将处理构建和部署过程。<\/p>\n<\/li>\n<li>\n<p>监控部署<br />\n前往 GitHub 仓库中的“Actions”标签页。<br />\n您应该会看到一个正在运行的工作流。此工作流将构建并部署您的静态 Web 应用到 Azure。<br />\n工作流完成后，您的应用将在提供的 Azure URL 上上线。<\/p>\n<\/li>\n<\/ol>\n<h3>示例工作流文件<\/h3>\n<p>以下是 GitHub Actions 工作流文件的示例：<br />\nname: Azure Static Web Apps CI/CD  <\/p>\n<pre><code>on:\n  push:\n    branches:\n      - main\n  pull_request:\n    types: [opened, synchronize, reopened, closed]\n    branches:\n      - main\n\njobs:\n  build_and_deploy_job:\n    runs-on: ubuntu-latest\n    name: Build and Deploy Job\n    steps:\n      - uses: actions/checkout@v2\n      - name: Build And Deploy\n        id: builddeploy\n        uses: Azure/static-web-apps-deploy@v1\n        with:\n          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}\n          repo_token: ${{ secrets.GITHUB_TOKEN }}\n          action: &quot;upload&quot;\n          app_location: &quot;etc/quiz-app # App source code path&quot;\n          api_location: &quot;&quot;API source code path optional\n          output_location: &quot;dist&quot; #Built app content directory - optional\n<\/code><\/pre>\n<h3>其他资源<\/h3>\n<ul>\n<li><a href=\"https://learn.microsoft.com/azure/static-web-apps/getting-started\">Azure 静态 Web 应用文档<\/a>  <\/li>\n<li><a href=\"https://docs.github.com/actions/use-cases-and-examples/deploying/deploying-to-azure-static-web-app\">GitHub Actions 文档<\/a>  <\/li>\n<\/ul>\n<p><strong>免责声明<\/strong>：<br />\n本文档使用AI翻译服务 <a href=\"https://github.com/Azure/co-op-translator\">Co-op Translator<\/a> 进行翻译。尽管我们努力确保翻译的准确性，但请注意，自动翻译可能包含错误或不准确之处。应以原始语言的文档作为权威来源。对于关键信息，建议使用专业人工翻译。因使用本翻译而引起的任何误解或误读，我们概不负责。<\/p>"}},"nav":[{"label":"🏁 课程总览","docs":[{"id":"README.md","label":"课程总览"}]},{"label":"第0章 · 课程准备","docs":[{"id":"lessons/0-course-setup/for-teachers.md","label":"👨‍🏫 教师指南"},{"id":"lessons/0-course-setup/how-to-run.md","label":"▶ 如何运行课程"},{"id":"lessons/0-course-setup/setup.md","label":"🛠 环境搭建"}]},{"label":"第1章 · AI 导论","docs":[{"id":"lessons/1-Intro/README.md","label":"章节概述","children":[{"id":"lessons/1-Intro/assignment.md","label":"📝 作业"}]}]},{"label":"第2章 · 符号 AI","docs":[{"id":"lessons/2-Symbolic/README.md","label":"章节概述","children":[{"id":"lessons/2-Symbolic/assignment.md","label":"📝 作业"}]}]},{"label":"第3章 · 神经网络","docs":[{"id":"lessons/3-NeuralNetworks/README.md","label":"章节概述","children":[]},{"id":"lessons/3-NeuralNetworks/03-Perceptron/README.md","label":"神经网络入门：感知机","children":[{"id":"lessons/3-NeuralNetworks/03-Perceptron/lab/README.md","label":"🧪 实验"}]},{"id":"lessons/3-NeuralNetworks/04-OwnFramework/README.md","label":"神经网络简介：多层感知机","children":[{"id":"lessons/3-NeuralNetworks/04-OwnFramework/lab/README.md","label":"🧪 实验"}]},{"id":"lessons/3-NeuralNetworks/05-Frameworks/README.md","label":"神经网络框架","children":[{"id":"lessons/3-NeuralNetworks/05-Frameworks/lab/README.md","label":"🧪 实验"}]}]},{"label":"第4章 · 计算机视觉","docs":[{"id":"lessons/4-ComputerVision/README.md","label":"章节概述","children":[]},{"id":"lessons/4-ComputerVision/06-IntroCV/README.md","label":"计算机视觉简介","children":[{"id":"lessons/4-ComputerVision/06-IntroCV/lab/README.md","label":"🧪 实验"}]},{"id":"lessons/4-ComputerVision/07-ConvNets/README.md","label":"卷积神经网络","children":[{"id":"lessons /08-TransferLearning/README.md","lessons/4-ComputerVision/08-TransferLearning/TrainingTricks.md","lessons/4-ComputerVision/08-TransferLearning/lab/README.md","lessons/4-ComputerVision/09-Autoencoders/README.md","lessons/4-ComputerVision/10-GANs/README.md","lessons/4-ComputerVision/11-ObjectDetection/README.md","lessons/4-ComputerVision/11-ObjectDetection/lab/README.md","lessons/4-ComputerVision/12-Segmentation/README.md","lessons/4-ComputerVision/12-Segmentation/lab/README.md","lessons/5-NLP/README.md","lessons/5-NLP/13-TextRep/README.md","lessons/5-NLP/13-TextRep/assignment.md","lessons/5-NLP/14-Embeddings/README.md","lessons/5-NLP/14-Embeddings/assignment.md","lessons/5-NLP/15-LanguageModeling/README.md","lessons/5-NLP/15-LanguageModeling/lab/README.md","lessons/5-NLP/16-RNN/README.md","lessons/5-NLP/16-RNN/assignment.md","lessons/5-NLP/17-GenerativeNetworks/README.md","lessons/5-NLP/17-GenerativeNetworks/lab/README.md","lessons/5-NLP/18-Transformers/README.md","lessons/5-NLP/18-Transformers/assignment.md","lessons/5-NLP/19-NER/README.md","lessons/5-NLP/19-NER/lab/README.md","lessons/5-NLP/20-LangModels/README.md","lessons/6-Other/21-GeneticAlgorithms/README.md","lessons/6-Other/22-DeepRL/README.md","lessons/6-Other/22-DeepRL/lab/README.md","lessons/6-Other/23-MultiagentSystems/README.md","lessons/6-Other/23-MultiagentSystems/assignment.md","lessons/7-Ethics/README.md","lessons/X-Extras/X1-MultiModal/README.md","lessons/README.md","etc/Mindmap.md","troubleshoot.md","lessons/sketchnotes/README.md","examples/README.md","etc/quiz-app/README.md"]}</script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const {docs, nav, order} = DATA;
const docEl = document.getElementById('doc');
const sidebar = document.getElementById('sidebar');

// id -> 面包屑（模块/课程名）
const crumb = {};
nav.forEach(m => m.docs.forEach(d => {
  const prefix = crumb[d.id] === undefined ? m.label : crumb[d.id];
  if (!(d.id in crumb)) crumb[d.id] = m.label;
  (d.children || []).forEach(c => { if (!(c.id in crumb)) crumb[c.id] = (docs[d.id] ? docs[d.id].t : '') ; });
}));

// 侧边栏
nav.forEach((m, mi) => {
  const box = document.createElement('div');
  box.className = 'mod';
  box.innerHTML = '<div class="mlabel">' + m.label + '</div>';
  const items = document.createElement('div');
  items.className = 'items';
  m.docs.forEach(d => {
    const a = document.createElement('a');
    a.className = 'side-link'; a.href = '#/doc/' + encodeURIComponent(d.id);
    a.textContent = d.label; a.dataset.doc = d.id;
    items.appendChild(a);
    (d.children || []).forEach(c => {
      const ca = document.createElement('a');
      ca.className = 'side-link child-link'; ca.href = '#/doc/' + encodeURIComponent(c.id);
      ca.textContent = c.label; ca.dataset.doc = c.id;
      items.appendChild(ca);
    });
  });
  box.appendChild(items);
  box.querySelector('.mlabel').addEventListener('click', () => box.classList.toggle('open'));
  sidebar.appendChild(box);
});

function renderMath(){
  if (window.renderMathInElement) {
    renderMathInElement(docEl, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ],
      throwOnError: false
    });
  }
}

function currentId(){
  const m = location.hash.match(/^#\/doc\/(.+)$/);
  return m ? decodeURIComponent(m[1]) : (order[0] || 'README.md');
}

function show(){
  const id = currentId();
  const d = docs[id];
  if (!d) { docEl.innerHTML = '<p>找不到该笔记。</p>'; return; }
  // 隐藏加载失败的图片
  let h = d.h.replace(/<img /g, '<img onerror="this.style.display=\'none\'" loading="lazy" ');
  docEl.innerHTML = '<div class="breadcrumb">' + (crumb[id] || '') + '</div>' + h;
  // 高亮侧边栏
  sidebar.querySelectorAll('.side-link').forEach(a => a.classList.toggle('active', a.dataset.doc === id));
  sidebar.querySelectorAll('.mod').forEach(b => {
    const has = b.querySelector('.side-link.active');
    b.classList.toggle('current', !!has);
    if (has) b.classList.add('open');
  });
  // 上一篇 / 下一篇
  const i = order.indexOf(id);
  const prev = i > 0 ? order[i - 1] : null;
  const next = i >= 0 && i < order.length - 1 ? order[i + 1] : null;
  let pager = '<div class="pager">';
  pager += prev ? '<a href="#/doc/' + encodeURIComponent(prev) + '"><div class="dir">← 上一篇</div><div class="pt">' + docs[prev].t + '</div></a>' : '<span></span>';
  pager += next ? '<a class="next" href="#/doc/' + encodeURIComponent(next) + '"><div class="dir">下一篇 →</div><div class="pt">' + docs[next].t + '</div></a>' : '<span></span>';
  pager += '</div>';
  docEl.insertAdjacentHTML('beforeend', pager);
  renderMath();
  window.scrollTo(0, 0);
  document.getElementById('results').classList.remove('show');
}
window.addEventListener('hashchange', show);

// 搜索
const q = document.getElementById('q');
const results = document.getElementById('results');
const plain = {};
Object.keys(docs).forEach(id => {
  const tmp = document.createElement('div');
  tmp.innerHTML = docs[id].h;
  plain[id] = (docs[id].t + ' ' + tmp.textContent).replace(/\s+/g, ' ');
});
q.addEventListener('input', () => {
  const kw = q.value.trim().toLowerCase();
  if (!kw) { results.classList.remove('show'); return; }
  let hits = Object.keys(docs).filter(id => plain[id].toLowerCase().includes(kw));
  hits.sort((a, b) => {
    const ta = docs[a].t.toLowerCase().includes(kw) ? 0 : 1;
    const tb = docs[b].t.toLowerCase().includes(kw) ? 0 : 1;
    if (ta !== tb) return ta - tb;
    return order.indexOf(a) - order.indexOf(b);
  });
  hits = hits.slice(0, 30);
  results.innerHTML = hits.length
    ? hits.map(id => '<a class="r" href="#/doc/' + encodeURIComponent(id) + '"><div class="rt">' + docs[id].t + '</div><div class="rm">' + (crumb[id] || '') + '</div></a>').join('')
    : '<div class="empty">没有找到包含「' + q.value + '」的笔记</div>';
  results.classList.add('show');
});
document.addEventListener('click', e => {
  if (!e.target.closest('.searchbox')) results.classList.remove('show');
});

// 回到顶部
const totop = document.getElementById('totop');
window.addEventListener('scroll', () => totop.style.display = window.scrollY > 500 ? 'block' : 'none');
totop.addEventListener('click', () => window.scrollTo({top: 0, behavior: 'smooth'}));

// 默认展开第一章
const firstMod = sidebar.querySelector('.mod:nth-child(2)');
if (firstMod) firstMod.classList.add('open');
show();
</script>
